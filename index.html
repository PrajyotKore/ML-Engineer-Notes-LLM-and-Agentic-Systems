w Derivation:\nApplying the chain rule for the loss gradient w.r.t layer $l$'s activation $x_l$:\n$$ \\frac{\\partial \\mathcal{L}}{\\partial x_l} = \\frac{\\partial \\mathcal{L}}{\\partial x_L} \\frac{\\partial x_L}{\\partial x_l} = \\frac{\\partial \\mathcal{L}}{\\partial x_L} \\left( I + \\frac{\\partial}{\\partial x_l} \\sum_{k=l}^{L-1} \\mathcal{F}(x_k, \\mathcal{W}_k) \\right) $$\n\n#### Profound Mathematical Implications:\n1. **No Vanishing Gradients**: The term $\\frac{\\partial \\mathcal{L}}{\\partial x_L} \\cdot I$ provides an uninterrupted, additive identity highway for gradients to flow directly from the final output $x_L$ back to the earliest layer $x_l$, regardless of network depth ($L \\to \\infty$).\n2. **Singularity Prevention**: The gradient $\\frac{\\partial \\mathcal{L}}{\\partial x_l}$ cannot vanish unless the matrix $\\left( I + \\frac{\\partial}{\\partial x_l} \\sum_{k=l}^{L-1} \\mathcal{F} \\right) = 0$, which is extraordinarily improbable in high dimensions.\n\n---\n\n### 4.2 Pre-LayerNorm vs. Post-LayerNorm Stability\n\n```\nPost-LN:  x_{l+1} = LayerNorm( x_l + SubLayer(x_l) )    ---> Gradient scales as O(1 / \u221a(L)) (Unstable!)\nPre-LN:   x_{l+1} = x_l + SubLayer( LayerNorm(x_l) )    ---> Pure Identity Highway (Stable at 100+ layers)\n```\n\nIn **Post-LN** (original Vaswani et al. Transformer), the residual stream is normalized at every layer:\n$$ x_{l+1} = \\text{LN}(x_l + \\mathcal{F}(x_l)) $$\nThe gradient highway is broken because the derivative of $\\text{LN}(\\cdot)$ multiplies the gradient at every layer. The expected gradient norm scales as $O\\left(\\frac{1}{\\sqrt{L}}\\right)$, requiring delicate learning rate warmups to prevent early training divergence.\n\nIn **Pre-LN** (all modern LLMs):\n$$ x_{l+1} = x_l + \\mathcal{F}(\\text{LN}(x_l)) $$\nThe identity connection $x_l \\to x_{l+1}$ remains strictly additive, enabling stable training of 100+ layer models without complex learning rate tricks.\n\n---\n\n## 5. Weight Initialization Theory & Variance Preservation\n\nLet $y = W x = \\sum_{j=1}^{d_{in}} W_{ij} x_j$, where elements $x_j$ are i.i.d. with mean 0 and variance $\\text{Var}(x)$, and weights $W_{ij}$ are i.i.d. with mean 0 and variance $\\text{Var}(W)$, independent of $x$.\n\nThe variance of output $y_i$ is:\n$$ \\text{Var}(y_i) = \\text{Var}\\left( \\sum_{j=1}^{d_{in}} W_{ij} x_j \\right) = \\sum_{j=1}^{d_{in}} \\text{Var}(W_{ij} x_j) $$\nSince $\\mathbb{E}[W_{ij}] = 0$ and $\\mathbb{E}[x_j] = 0$:\n$$ \\text{Var}(W_{ij} x_j) = \\mathbb{E}[(W_{ij} x_j)^2] - (\\mathbb{E}[W_{ij} x_j])^2 = \\mathbb{E}[W_{ij}^2] \\mathbb{E}[x_j^2] = \\text{Var}(W) \\text{Var}(x) $$\n$$ \\text{Var}(y_i) = d_{in} \\text{Var}(W) \\text{Var}(x) $$\n\nTo preserve activation variance throughout the forward pass ($\\text{Var}(y_i) = \\text{Var}(x)$):\n$$ d_{in} \\text{Var}(W) = 1 \\implies \\mathbf{\\text{Var}(W) = \\frac{1}{d_{in}}} $$\n\nSimilarly, to preserve gradient variance during the backward pass:\n$$ d_{out} \\text{Var}(W) = 1 \\implies \\mathbf{\\text{Var}(W) = \\frac{1}{d_{out}}} $$\n\n### 5.1 Xavier / Glorot Initialization (For Linear / Tanh Activations)\nHarmonic mean compromise between forward and backward variance:\n$$ \\text{Var}(W) = \\frac{2}{d_{in} + d_{out}} \\implies W_{ij} \\sim \\mathcal{N}\\left(0, \\frac{2}{d_{in} + d_{out}}\\right) \\quad \\text{or} \\quad \\mathcal{U}\\left(-\\sqrt{\\frac{6}{d_{in} + d_{out}}}, \\sqrt{\\frac{6}{d_{in} + d_{out}}}\\right) $$\n\n### 5.2 He / Kaiming Initialization (For ReLU Activations)\nBecause ReLU zeroes out half of the activations ($\\mathbb{E}[\\max(0, x)^2] = \\frac{1}{2} \\text{Var}(x)$), the variance is halved at every layer:\n$$ \\text{Var}(y_i) = \\frac{1}{2} d_{in} \\text{Var}(W) \\text{Var}(x) \\implies \\mathbf{\\text{Var}(W) = \\frac{2}{d_{in}}} $$\n\n### 5.3 Deep Transformer Residual Scaling (Small-Init)\nIn a Transformer with $L$ residual layers: $x_L = x_0 + \\sum_{l=1}^L \\mathcal{F}_l(x_{l-1})$.  \nIf each residual branch has unit variance, $\\text{Var}(x_L) \\approx L \\cdot \\text{Var}(x_0)$, causing activations to explode with depth.  \n*Modern Rule*: Scale residual projection weights (e.g., Attention Output projection and FFN down-projection) at initialization by:\n$$ W_{\\text{proj}} \\sim \\mathcal{N}\\left(0, \\frac{2}{d_{in} \\cdot 2L}\\right) = \\frac{1}{\\sqrt{2L}} \\cdot \\text{Init}(W) $$\n\n---\n\n## 6. PyTorch Implementation Reference\n\n```python\nimport torch\nimport torch.nn as nn\nimport torch.nn.functional as F\n\nclass RMSNorm(nn.Module):\n    \"\"\"\n    Root Mean Square Layer Normalization (RMSNorm).\n    Used in modern LLM architectures (LLaMA, DeepSeek, Mistral).\n    \"\"\"\n    def __init__(self, dim: int, eps: float = 1e-6):\n        super().__init__()\n        self.eps = eps\n        self.weight = nn.Parameter(torch.ones(dim))\n\n    def _norm(self, x: torch.Tensor) -> torch.Tensor:\n        # Compute RMS along the feature dimension: \u221a(mean(x\u00b2) + \u03b5)\n        return x * torch.rsqrt(x.pow(2).mean(-1, keepdim=True) + self.eps)\n\n    def forward(self, x: torch.Tensor) -> torch.Tensor:\n        # Cast to float32 for stable variance computation before downcasting\n        output = self._norm(x.float()).type_as(x)\n        return output * self.weight\n\ndef numerically_stable_cross_entropy(logits: torch.Tensor, targets: torch.Tensor) -> torch.Tensor:\n    \"\"\"\n    Numerically stable Cross-Entropy loss via Log-Sum-Exp trick.\n    logits: [Batch, Vocab_Size]\n    targets: [Batch] (class indices)\n    \"\"\"\n    # 1. Log-Sum-Exp Trick: max_logit subtraction prevents exp() overflow\n    max_logits, _ = torch.max(logits, dim=-1, keepdim=True)\n    stabilized_logits = logits - max_logits\n    \n    # 2. Compute log(sum(exp(z - max_z)))\n    log_sum_exp = torch.log(torch.sum(torch.exp(stabilized_logits), dim=-1, keepdim=True))\n    \n    # 3. Log-Softmax: log(p_i) = (z_i - max_z) - log_sum_exp\n    log_probs = stabilized_logits - log_sum_exp\n    \n    # 4. Gather true token log probabilities: -log(p_{target})\n    batch_indices = torch.arange(logits.size(0), device=logits.device)\n    target_log_probs = log_probs[batch_indices, targets]\n    \n    return -torch.mean(target_log_probs)\n\n# Unit Validation\nif __name__ == \"__main__\":\n    B, D, V = 4, 128, 1000\n    x = torch.randn(B, D)\n    rms = RMSNorm(D)\n    normed = rms(x)\n    assert normed.shape == (B, D), \"RMSNorm dimension mismatch!\"\n    \n    dummy_logits = torch.randn(B, V)\n    dummy_targets = torch.randint(0, V, (B,))\n    \n    custom_loss = numerically_stable_cross_entropy(dummy_logits, dummy_targets)\n    torch_loss = F.cross_entropy(dummy_logits, dummy_targets)\n    \n    assert torch.allclose(custom_loss, torch_loss, atol=1e-5), \"Loss mismatch with PyTorch standard!\"\n    print(\"All mathematical assertions passed successfully.\")\n```\n\n---\n\n## 7. Deep Interview Interrogation Ladder\n\n- **Level 1 (Concept)**: What is the primary difference between LayerNorm and RMSNorm?\n- **Level 3 (Mechanics)**: Why does Post-LayerNorm cause training instability in deep transformers while Pre-LayerNorm does not?\n- **Level 5 (Derivation)**: Derive step-by-step why the gradient of Cross-Entropy Loss with Softmax simplifies to $p_i - y_i$.\n- **Level 7 (Hardware & Autodiff)**: Explain why reverse-mode automatic differentiation evaluates Vector-Jacobian Products (VJPs) rather than materializing the full Jacobian matrix.\n- **Level 9 (Deep Systems)**: If you scale a Transformer model from 32 to 128 layers, why do standard weight initializations cause activation explosion, and how do you mathematically adjust the initial variance of residual projection layers?\n- **Level 10 (Principal Engineering)**: Walk through the exact memory access patterns and arithmetic intensity of RMSNorm vs. LayerNorm on an NVIDIA H100 GPU. Why does RMSNorm enable higher Model FLOPs Utilization (MFU) in large-scale cluster pre-training?\n", "html": "<h1>02_03_ML_AND_DL_FOUNDATIONS \u2014 Mathematical &amp; Mechanistic Reference</h1>\n<blockquote>\n<p><strong>Audience</strong>: ML Engineers, LLM Systems Engineers, and AI Researchers preparing for senior/principal technical interviews.<br />\n<strong>Core Objective</strong>: Provide an uncompromising, mathematically rigorous foundation of Deep Learning mechanics \u2014 deriving backpropagation, loss gradients, normalization dynamics, residual gradient propagation, and weight initialization from first principles.</p>\n</blockquote>\n<hr />\n<h2>1. The Core Architecture of Backpropagation</h2>\n<h3>1.1 Computational Graph &amp; Chain Rule Calculus</h3>\n<p>Let a deep neural network be represented as a directed acyclic graph (DAG) of <span class=\"katex-inline\">$L$</span> layers:</p>\n<div class=\"katex-display\">$$x_0 \\xrightarrow{f_1(x_0, W_1)} x_1 \\xrightarrow{f_2(x_1, W_2)} x_2 \\dots \\xrightarrow{f_L(x_{L-1}, W_L)} x_L \\xrightarrow{\\mathcal{L}(x_L, y)} \\text{Scalar Loss } \\mathcal{L}$$</div>\n\n<p>Where <span class=\"katex-inline\">$x_l \\in \\mathbb{R}^{d_l}$</span> is the hidden state vector at layer <span class=\"katex-inline\">$l$</span>, and <span class=\"katex-inline\">$W_l \\in \\mathbb{R}^{d_l \\times d_{l-1}}$</span> is the parameter matrix.</p>\n<ul>\n<li><strong>Forward Propagation</strong>:<br />\n  <div class=\"katex-display\">$$z_l = W_l x_{l-1} + b_l$$</div></li>\n</ul>\n<div class=\"katex-display\">$$x_l = \\sigma_l(z_l)$$</div>\n<p>where <span class=\"katex-inline\">$\\sigma_l(\\cdot)$</span> is an element-wise activation function.</p>\n<ul>\n<li>\n<p><strong>Reverse-Mode Automatic Differentiation (Backpropagation)</strong>:<br />\n  Let <span class=\"katex-inline\">$\\delta_l = \\frac{\\partial \\mathcal{L}}{\\partial z_l} \\in \\mathbb{R}^{1 \\times d_l}$</span> be the error vector (adjoint state) at pre-activation <span class=\"katex-inline\">$z_l$</span>.<br />\n  By the multivariate chain rule:<br />\n  <div class=\"katex-display\">$$\\delta_l = \\frac{\\partial \\mathcal{L}}{\\partial z_l} = \\frac{\\partial \\mathcal{L}}{\\partial x_l} \\cdot \\frac{\\partial x_l}{\\partial z_l} = \\left( \\delta_{l+1} W_{l+1} \\right) \\odot \\sigma_l&#x27;(z_l)$$</div>\n</p>\n</li>\n<li>\n<p><strong>Parameter Gradients</strong>:<br />\n  <div class=\"katex-display\">$$\\frac{\\partial \\mathcal{L}}{\\partial W_l} = \\delta_l^T x_{l-1} \\in \\mathbb{R}^{d_l \\times d_{l-1}}$$</div></p>\n</li>\n</ul>\n<div class=\"katex-display\">$$\\frac{\\partial \\mathcal{L}}{\\partial b_l} = \\delta_l \\in \\mathbb{R}^{1 \\times d_l}$$</div>\n\n<pre><code>Forward Pass:   x_{l-1} \u2500\u2500\u2500\u2500\u2500\u2500\u25ba [ W_l \u00b7 x_{l-1} + b_l ] \u2500\u2500z_l\u2500\u2500\u25ba [ \u03c3_l(\u00b7) ] \u2500\u2500x_l\u2500\u2500\u25ba\n                                          \u2502                              \u2502\nBackward Pass:  \u2202L/\u2202x_{l-1} \u25c4\u2500\u2500 [ \u00b7 W_l^T ] \u25c4\u2500\u2500\u2500 \u03b4_l \u25c4\u2500\u2500\u2500 [ \u00b7 \u03c3_l'(z_l) ] \u25c4\u2500\u2500\u2500 \u2202L/\u2202x_l\n</code></pre>\n<hr />\n<h2>2. Complete Mathematical Derivation: Softmax &amp; Cross-Entropy</h2>\n<h3>2.1 The Softmax Jacobian Matrix</h3>\n<p>Given unnormalized logits vector <span class=\"katex-inline\">$z = [z_1, z_2, \\dots, z_C]^T \\in \\mathbb{R}^C$</span>, the Softmax function outputs class probabilities <span class=\"katex-inline\">$p = [p_1, p_2, \\dots, p_C]^T \\in \\mathbb{R}^C$</span>:</p>\n<div class=\"katex-display\">$$p_i = \\frac{e^{z_i}}{\\sum_{k=1}^C e^{z_k}} = \\frac{e^{z_i}}{S(z)} \\quad \\text{where } S(z) = \\sum_{k=1}^C e^{z_k}$$</div>\n\n<p>We seek the Jacobian matrix <span class=\"katex-inline\">$J \\in \\mathbb{R}^{C \\times C}$</span> where <span class=\"katex-inline\">$J_{ij} = \\frac{\\partial p_i}{\\partial z_j}$</span>.</p>\n<h4>Case 1: Diagonal Elements (<span class=\"katex-inline\">$i = j$</span>)</h4>\n<p>Using the quotient rule <span class=\"katex-inline\">$\\frac{d}{dx}\\left(\\frac{u}{v}\\right) = \\frac{u&#x27;v - uv&#x27;}{v^2}$</span>:</p>\n<div class=\"katex-display\">$$\\frac{\\partial p_i}{\\partial z_i} = \\frac{\\frac{\\partial}{\\partial z_i}(e^{z_i}) S(z) - e^{z_i} \\frac{\\partial}{\\partial z_i}(S(z))}{S(z)^2} = \\frac{e^{z_i} S(z) - e^{z_i} e^{z_i}}{S(z)^2} = \\frac{e^{z_i}}{S(z)} - \\left(\\frac{e^{z_i}}{S(z)}\\right)^2 = p_i - p_i^2 = p_i(1 - p_i)$$</div>\n\n<h4>Case 2: Off-Diagonal Elements (<span class=\"katex-inline\">$i \\neq j$</span>)</h4>\n<div class=\"katex-display\">$$\\frac{\\partial p_i}{\\partial z_j} = \\frac{0 \\cdot S(z) - e^{z_i} \\frac{\\partial}{\\partial z_j}(S(z))}{S(z)^2} = \\frac{-e^{z_i} e^{z_j}}{S(z)^2} = -\\left(\\frac{e^{z_i}}{S(z)}\\right)\\left(\\frac{e^{z_j}}{S(z)}\\right) = -p_i p_j$$</div>\n\n<h4>Unified Jacobian Formulation:</h4>\n<p>Using the Kronecker delta <span class=\"katex-inline\">$\\delta_{ij} = \\begin{cases} 1 &amp; \\text{if } i = j \\\\ 0 &amp; \\text{if } i \\neq j \\end{cases}$</span>:</p>\n<div class=\"katex-display\">$$\\frac{\\partial p_i}{\\partial z_j} = p_i (\\delta_{ij} - p_j)$$</div>\n<p>In matrix notation:</p>\n<div class=\"katex-display\">$$J_{\\text{softmax}} = \\text{diag}(p) - p p^T \\in \\mathbb{R}^{C \\times C}$$</div>\n\n<hr />\n<h3>2.2 Analytical Gradient of Cross-Entropy Loss with Softmax</h3>\n<p>For a categorical distribution with one-hot ground-truth vector <span class=\"katex-inline\">$y \\in \\{0, 1\\}^C$</span> (<span class=\"katex-inline\">$\\sum_{k=1}^C y_k = 1$</span>), the Cross-Entropy loss is:</p>\n<div class=\"katex-display\">$$\\mathcal{L}_{\\text{CE}}(z, y) = -\\sum_{k=1}^C y_k \\log(p_k)$$</div>\n\n<p>We calculate the gradient with respect to logit <span class=\"katex-inline\">$z_i$</span>:</p>\n<div class=\"katex-display\">$$\\frac{\\partial \\mathcal{L}}{\\partial z_i} = -\\sum_{k=1}^C y_k \\frac{\\partial \\log(p_k)}{\\partial z_i} = -\\sum_{k=1}^C \\frac{y_k}{p_k} \\frac{\\partial p_k}{\\partial z_i}$$</div>\n\n<p>Substituting the Softmax Jacobian derivative <span class=\"katex-inline\">$\\frac{\\partial p_k}{\\partial z_i} = p_k(\\delta_{ki} - p_i)$</span>:</p>\n<div class=\"katex-display\">$$\\frac{\\partial \\mathcal{L}}{\\partial z_i} = -\\sum_{k=1}^C \\frac{y_k}{p_k} \\left[ p_k(\\delta_{ki} - p_i) \\right] = -\\sum_{k=1}^C y_k (\\delta_{ki} - p_i) = -\\left( \\sum_{k=1}^C y_k \\delta_{ki} - p_i \\sum_{k=1}^C y_k \\right)$$</div>\n\n<p>Since <span class=\"katex-inline\">$y$</span> is a one-hot distribution (<span class=\"katex-inline\">$\\sum_{k=1}^C y_k \\delta_{ki} = y_i$</span> and <span class=\"katex-inline\">$\\sum_{k=1}^C y_k = 1$</span>):</p>\n<div class=\"katex-display\">$$\\frac{\\partial \\mathcal{L}}{\\partial z_i} = -(y_i - p_i \\cdot 1) = p_i - y_i$$</div>\n\n<p>In full vector notation:</p>\n<div class=\"katex-display\">$$\\nabla_z \\mathcal{L}_{\\text{CE}} = p - y \\in \\mathbb{R}^C$$</div>\n\n<h4>Deep Engineering Insight:</h4>\n<p>The error gradient at the output logits is simply the <strong>difference between predicted probabilities and target probabilities</strong>. This elegant linearity prevents vanishing gradients when the model is wrong and confident (<span class=\"katex-inline\">$p_i \\approx 0, y_i = 1 \\implies \\text{gradient} \\approx -1$</span>).</p>\n<hr />\n<h3>2.3 Numerical Stability: Log-Sum-Exp Trick</h3>\n<p>Directly computing <span class=\"katex-inline\">$p_i = \\frac{e^{z_i}}{\\sum_j e^{z_j}}$</span> on GPUs causes:<br />\n1. <strong>Overflow</strong>: If <span class=\"katex-inline\">$z_i &gt; 88.7$</span> in standard IEEE 754 FP32, <span class=\"katex-inline\">$e^{z_i} \\to +\\infty$</span> (results in <code>NaN</code>).<br />\n2. <strong>Underflow</strong>: If all <span class=\"katex-inline\">$z_i &lt; -88.7$</span>, <span class=\"katex-inline\">$e^{z_i} \\to 0$</span>, leading to <span class=\"katex-inline\">$\\frac{0}{0} \\to \\text{NaN}$</span>.</p>\n<h4>The Mathematical Shift-Invariance Property:</h4>\n<p>For any scalar constant <span class=\"katex-inline\">$c \\in \\mathbb{R}$</span>:</p>\n<div class=\"katex-display\">$$\\frac{e^{z_i - c}}{\\sum_{j=1}^C e^{z_j - c}} = \\frac{e^{z_i} e^{-c}}{\\sum_{j=1}^C e^{z_j} e^{-c}} = \\frac{e^{z_i} e^{-c}}{e^{-c} \\sum_{j=1}^C e^{z_j}} = \\frac{e^{z_i}}{\\sum_{j=1}^C e^{z_j}}$$</div>\n\n<p>Choosing <span class=\"katex-inline\">$c = \\max_{j} z_j$</span>:</p>\n<div class=\"katex-display\">$$\\tilde{z}_i = z_i - \\max_j z_j \\leq 0 \\implies e^{\\tilde{z}_i} \\in (0, 1]$$</div>\n<p>At least one element has <span class=\"katex-inline\">$e^{\\tilde{z}_{\\max}} = e^0 = 1$</span>, guaranteeing the denominator is strictly <span class=\"katex-inline\">$\\geq 1$</span> and preventing both overflow and division by zero.</p>\n<hr />\n<h2>3. Normalization Mathematics: LayerNorm vs. RMSNorm</h2>\n<pre><code>\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                             Input Vector x                               \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                      \u2502                               \u2502\n                      \u25bc                               \u25bc\n     \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510   \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n     \u2502       LayerNorm (Ba et al.)     \u2502   \u2502      RMSNorm (Zhang &amp; Sennrich) \u2502\n     \u2502  1. Compute Mean \u03bc              \u2502   \u2502  1. No Mean Subtraction (\u03bc = 0) \u2502\n     \u2502  2. Compute Variance \u03c3^2        \u2502   \u2502  2. Compute Root-Mean-Square    \u2502\n     \u2502  3. Normalize: (x - \u03bc) / \u221a(\u03c3\u00b2+\u03b5)\u2502   \u2502  3. Normalize: x / RMS(x)       \u2502\n     \u2502  4. Affine: \u03b3 \u2299 x_hat + \u03b2       \u2502   \u2502  4. Scaling Only: \u03b3 \u2299 x_hat     \u2502\n     \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518   \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n</code></pre>\n<h3>3.1 Layer Normalization (LayerNorm)</h3>\n<p>Given a token representation vector <span class=\"katex-inline\">$x \\in \\mathbb{R}^d$</span>:<br />\n1. <strong>Mean</strong>: <span class=\"katex-inline\">$\\mu = \\frac{1}{d} \\sum_{i=1}^d x_i$</span><br />\n2. <strong>Variance</strong>: <span class=\"katex-inline\">$\\sigma^2 = \\frac{1}{d} \\sum_{i=1}^d (x_i - \\mu)^2$</span><br />\n3. <strong>Standardized Activation</strong>: <span class=\"katex-inline\">$\\hat{x}_i = \\frac{x_i - \\mu}{\\sqrt{\\sigma^2 + \\epsilon}}$</span><br />\n4. <strong>Affine Transformation</strong>: <span class=\"katex-inline\">$y_i = \\gamma_i \\hat{x}_i + \\beta_i$</span>  (<span class=\"katex-inline\">$\\gamma, \\beta \\in \\mathbb{R}^d$</span> are learnable parameters).</p>\n<h4>LayerNorm Backward Pass Gradient Derivations:</h4>\n<p>Let the incoming gradient from the upstream layer be <span class=\"katex-inline\">$\\frac{\\partial \\mathcal{L}}{\\partial y} \\in \\mathbb{R}^d$</span>.<br />\n- Gradient w.r.t parameters:<br />\n  <div class=\"katex-display\">$$\\frac{\\partial \\mathcal{L}}{\\partial \\gamma_i} = \\frac{\\partial \\mathcal{L}}{\\partial y_i} \\hat{x}_i, \\quad \\frac{\\partial \\mathcal{L}}{\\partial \\beta_i} = \\frac{\\partial \\mathcal{L}}{\\partial y_i}$$</div></p>\n<ul>\n<li>\n<p>Gradient w.r.t normalized input:<br />\n  <div class=\"katex-display\">$$\\frac{\\partial \\mathcal{L}}{\\partial \\hat{x}_i} = \\frac{\\partial \\mathcal{L}}{\\partial y_i} \\gamma_i$$</div></p>\n</li>\n<li>\n<p>Exact gradient w.r.t input <span class=\"katex-inline\">$x_i$</span>:<br />\n  <div class=\"katex-display\">$$\\frac{\\partial \\mathcal{L}}{\\partial x_i} = \\frac{1}{\\sqrt{\\sigma^2 + \\epsilon}} \\left[ \\frac{\\partial \\mathcal{L}}{\\partial \\hat{x}_i} - \\frac{1}{d} \\sum_{j=1}^d \\frac{\\partial \\mathcal{L}}{\\partial \\hat{x}_j} - \\frac{\\hat{x}_i}{d} \\sum_{j=1}^d \\frac{\\partial \\mathcal{L}}{\\partial \\hat{x}_j} \\hat{x}_j \\right]$$</div>\n</p>\n</li>\n</ul>\n<hr />\n<h3>3.2 Root Mean Square Normalization (RMSNorm)</h3>\n<p>Zhang &amp; Sennrich (2019) proved that the computational benefit of LayerNorm comes entirely from <strong>scaling invariance</strong> rather than mean-shifting. RMSNorm discards the mean calculation and bias parameter <span class=\"katex-inline\">$\\beta$</span>.</p>\n<h4>Mathematical Formulation:</h4>\n<div class=\"katex-display\">$$\\text{RMS}(x) = \\sqrt{\\frac{1}{d} \\sum_{i=1}^d x_i^2 + \\epsilon} = \\sqrt{\\frac{1}{d} \\|x\\|_2^2 + \\epsilon}$$</div>\n<div class=\"katex-display\">$$\\bar{x}_i = \\frac{x_i}{\\text{RMS}(x)}$$</div>\n<div class=\"katex-display\">$$y_i = \\gamma_i \\bar{x}_i$$</div>\n\n<h4>Exact RMSNorm Backward Pass Derivation:</h4>\n<p>Let <span class=\"katex-inline\">$g_i = \\frac{\\partial \\mathcal{L}}{\\partial y_i} \\gamma_i$</span>.</p>\n<div class=\"katex-display\">$$\\frac{\\partial \\mathcal{L}}{\\partial x_i} = \\sum_{j=1}^d g_j \\frac{\\partial \\bar{x}_j}{\\partial x_i}$$</div>\n<p>Since <span class=\"katex-inline\">$\\bar{x}_j = x_j \\left( \\frac{1}{d} \\sum_{k=1}^d x_k^2 + \\epsilon \\right)^{-1/2}$</span>:</p>\n<div class=\"katex-display\">$$\\frac{\\partial \\bar{x}_j}{\\partial x_i} = \\frac{\\delta_{ij}}{\\text{RMS}(x)} - \\frac{x_j x_i}{d \\cdot \\text{RMS}(x)^3}$$</div>\n<p>Substituting into the chain rule:</p>\n<div class=\"katex-display\">$$\\frac{\\partial \\mathcal{L}}{\\partial x_i} = \\frac{1}{\\text{RMS}(x)} \\left[ g_i - \\frac{x_i}{d \\cdot \\text{RMS}(x)^2} \\sum_{j=1}^d g_j x_j \\right] = \\frac{1}{\\text{RMS}(x)} \\left[ g_i - \\bar{x}_i \\left( \\frac{1}{d} \\sum_{j=1}^d g_j \\bar{x}_j \\right) \\right]$$</div>\n\n<h4>Why Modern LLMs (LLaMA-3, Mistral, Gemma, DeepSeek) Use RMSNorm Exclusively:</h4>\n<ol>\n<li><strong>Computational Speed</strong>: Saves 7 CUDA memory read/write passes per layer by eliminating mean reductions.</li>\n<li><strong>GPU Kernel Fusion</strong>: RMSNorm can be fused into a single Triton/CUDA kernel reading <span class=\"katex-inline\">$x$</span> once, computing RMS in SRAM shared registers, scaling, and writing output <span class=\"katex-inline\">$y$</span> directly to HBM.</li>\n<li><strong>Training Stability</strong>: Preserves the scale-invariance property (<span class=\"katex-inline\">$\\text{RMSNorm}(\\alpha x) = \\text{RMSNorm}(x)$</span>), which keeps gradients bounded across deep Transformer stacks.</li>\n</ol>\n<hr />\n<h2>4. Residual Connections &amp; Gradient Flow Dynamics</h2>\n<h3>4.1 The Additive Gradient Highway Theorem</h3>\n<p>Consider a deep network with residual connections (He et al., 2016):</p>\n<div class=\"katex-display\">$$x_{l+1} = x_l + \\mathcal{F}(x_l, \\mathcal{W}_l)$$</div>\n<p>Recursively expanding from layer <span class=\"katex-inline\">$l$</span> to any deeper layer <span class=\"katex-inline\">$L &gt; l$</span>:</p>\n<div class=\"katex-display\">$$x_L = x_l + \\sum_{k=l}^{L-1} \\mathcal{F}(x_k, \\mathcal{W}_k)$$</div>\n\n<h4>Gradient Flow Derivation:</h4>\n<p>Applying the chain rule for the loss gradient w.r.t layer <span class=\"katex-inline\">$l$</span>'s activation <span class=\"katex-inline\">$x_l$</span>:</p>\n<div class=\"katex-display\">$$\\frac{\\partial \\mathcal{L}}{\\partial x_l} = \\frac{\\partial \\mathcal{L}}{\\partial x_L} \\frac{\\partial x_L}{\\partial x_l} = \\frac{\\partial \\mathcal{L}}{\\partial x_L} \\left( I + \\frac{\\partial}{\\partial x_l} \\sum_{k=l}^{L-1} \\mathcal{F}(x_k, \\mathcal{W}_k) \\right)$$</div>\n\n<h4>Profound Mathematical Implications:</h4>\n<ol>\n<li><strong>No Vanishing Gradients</strong>: The term <span class=\"katex-inline\">$\\frac{\\partial \\mathcal{L}}{\\partial x_L} \\cdot I$</span> provides an uninterrupted, additive identity highway for gradients to flow directly from the final output <span class=\"katex-inline\">$x_L$</span> back to the earliest layer <span class=\"katex-inline\">$x_l$</span>, regardless of network depth (<span class=\"katex-inline\">$L \\to \\infty$</span>).</li>\n<li><strong>Singularity Prevention</strong>: The gradient <span class=\"katex-inline\">$\\frac{\\partial \\mathcal{L}}{\\partial x_l}$</span> cannot vanish unless the matrix <span class=\"katex-inline\">$\\left( I + \\frac{\\partial}{\\partial x_l} \\sum_{k=l}^{L-1} \\mathcal{F} \\right) = 0$</span>, which is extraordinarily improbable in high dimensions.</li>\n</ol>\n<hr />\n<h3>4.2 Pre-LayerNorm vs. Post-LayerNorm Stability</h3>\n<pre><code>Post-LN:  x_{l+1} = LayerNorm( x_l + SubLayer(x_l) )    ---&gt; Gradient scales as O(1 / \u221a(L)) (Unstable!)\nPre-LN:   x_{l+1} = x_l + SubLayer( LayerNorm(x_l) )    ---&gt; Pure Identity Highway (Stable at 100+ layers)\n</code></pre>\n<p>In <strong>Post-LN</strong> (original Vaswani et al. Transformer), the residual stream is normalized at every layer:</p>\n<div class=\"katex-display\">$$x_{l+1} = \\text{LN}(x_l + \\mathcal{F}(x_l))$$</div>\n<p>The gradient highway is broken because the derivative of <span class=\"katex-inline\">$\\text{LN}(\\cdot)$</span> multiplies the gradient at every layer. The expected gradient norm scales as <span class=\"katex-inline\">$O\\left(\\frac{1}{\\sqrt{L}}\\right)$</span>, requiring delicate learning rate warmups to prevent early training divergence.</p>\n<p>In <strong>Pre-LN</strong> (all modern LLMs):</p>\n<div class=\"katex-display\">$$x_{l+1} = x_l + \\mathcal{F}(\\text{LN}(x_l))$$</div>\n<p>The identity connection <span class=\"katex-inline\">$x_l \\to x_{l+1}$</span> remains strictly additive, enabling stable training of 100+ layer models without complex learning rate tricks.</p>\n<hr />\n<h2>5. Weight Initialization Theory &amp; Variance Preservation</h2>\n<p>Let <span class=\"katex-inline\">$y = W x = \\sum_{j=1}^{d_{in}} W_{ij} x_j$</span>, where elements <span class=\"katex-inline\">$x_j$</span> are i.i.d. with mean 0 and variance <span class=\"katex-inline\">$\\text{Var}(x)$</span>, and weights <span class=\"katex-inline\">$W_{ij}$</span> are i.i.d. with mean 0 and variance <span class=\"katex-inline\">$\\text{Var}(W)$</span>, independent of <span class=\"katex-inline\">$x$</span>.</p>\n<p>The variance of output <span class=\"katex-inline\">$y_i$</span> is:</p>\n<div class=\"katex-display\">$$\\text{Var}(y_i) = \\text{Var}\\left( \\sum_{j=1}^{d_{in}} W_{ij} x_j \\right) = \\sum_{j=1}^{d_{in}} \\text{Var}(W_{ij} x_j)$$</div>\n<p>Since <span class=\"katex-inline\">$\\mathbb{E}[W_{ij}] = 0$</span> and <span class=\"katex-inline\">$\\mathbb{E}[x_j] = 0$</span>:</p>\n<div class=\"katex-display\">$$\\text{Var}(W_{ij} x_j) = \\mathbb{E}[(W_{ij} x_j)^2] - (\\mathbb{E}[W_{ij} x_j])^2 = \\mathbb{E}[W_{ij}^2] \\mathbb{E}[x_j^2] = \\text{Var}(W) \\text{Var}(x)$$</div>\n<div class=\"katex-display\">$$\\text{Var}(y_i) = d_{in} \\text{Var}(W) \\text{Var}(x)$$</div>\n\n<p>To preserve activation variance throughout the forward pass (<span class=\"katex-inline\">$\\text{Var}(y_i) = \\text{Var}(x)$</span>):</p>\n<div class=\"katex-display\">$$d_{in} \\text{Var}(W) = 1 \\implies \\mathbf{\\text{Var}(W) = \\frac{1}{d_{in}}}$$</div>\n\n<p>Similarly, to preserve gradient variance during the backward pass:</p>\n<div class=\"katex-display\">$$d_{out} \\text{Var}(W) = 1 \\implies \\mathbf{\\text{Var}(W) = \\frac{1}{d_{out}}}$$</div>\n\n<h3>5.1 Xavier / Glorot Initialization (For Linear / Tanh Activations)</h3>\n<p>Harmonic mean compromise between forward and backward variance:</p>\n<div class=\"katex-display\">$$\\text{Var}(W) = \\frac{2}{d_{in} + d_{out}} \\implies W_{ij} \\sim \\mathcal{N}\\left(0, \\frac{2}{d_{in} + d_{out}}\\right) \\quad \\text{or} \\quad \\mathcal{U}\\left(-\\sqrt{\\frac{6}{d_{in} + d_{out}}}, \\sqrt{\\frac{6}{d_{in} + d_{out}}}\\right)$$</div>\n\n<h3>5.2 He / Kaiming Initialization (For ReLU Activations)</h3>\n<p>Because ReLU zeroes out half of the activations (<span class=\"katex-inline\">$\\mathbb{E}[\\max(0, x)^2] = \\frac{1}{2} \\text{Var}(x)$</span>), the variance is halved at every layer:</p>\n<div class=\"katex-display\">$$\\text{Var}(y_i) = \\frac{1}{2} d_{in} \\text{Var}(W) \\text{Var}(x) \\implies \\mathbf{\\text{Var}(W) = \\frac{2}{d_{in}}}$$</div>\n\n<h3>5.3 Deep Transformer Residual Scaling (Small-Init)</h3>\n<p>In a Transformer with <span class=\"katex-inline\">$L$</span> residual layers: <span class=\"katex-inline\">$x_L = x_0 + \\sum_{l=1}^L \\mathcal{F}_l(x_{l-1})$</span>.<br />\nIf each residual branch has unit variance, <span class=\"katex-inline\">$\\text{Var}(x_L) \\approx L \\cdot \\text{Var}(x_0)$</span>, causing activations to explode with depth.<br />\n<em>Modern Rule</em>: Scale residual projection weights (e.g., Attention Output projection and FFN down-projection) at initialization by:</p>\n<div class=\"katex-display\">$$W_{\\text{proj}} \\sim \\mathcal{N}\\left(0, \\frac{2}{d_{in} \\cdot 2L}\\right) = \\frac{1}{\\sqrt{2L}} \\cdot \\text{Init}(W)$$</div>\n\n<hr />\n<h2>6. PyTorch Implementation Reference</h2>\n<pre><code class=\"language-python\">import torch\nimport torch.nn as nn\nimport torch.nn.functional as F\n\nclass RMSNorm(nn.Module):\n    &quot;&quot;&quot;\n    Root Mean Square Layer Normalization (RMSNorm).\n    Used in modern LLM architectures (LLaMA, DeepSeek, Mistral).\n    &quot;&quot;&quot;\n    def __init__(self, dim: int, eps: float = 1e-6):\n        super().__init__()\n        self.eps = eps\n        self.weight = nn.Parameter(torch.ones(dim))\n\n    def _norm(self, x: torch.Tensor) -&gt; torch.Tensor:\n        # Compute RMS along the feature dimension: \u221a(mean(x\u00b2) + \u03b5)\n        return x * torch.rsqrt(x.pow(2).mean(-1, keepdim=True) + self.eps)\n\n    def forward(self, x: torch.Tensor) -&gt; torch.Tensor:\n        # Cast to float32 for stable variance computation before downcasting\n        output = self._norm(x.float()).type_as(x)\n        return output * self.weight\n\ndef numerically_stable_cross_entropy(logits: torch.Tensor, targets: torch.Tensor) -&gt; torch.Tensor:\n    &quot;&quot;&quot;\n    Numerically stable Cross-Entropy loss via Log-Sum-Exp trick.\n    logits: [Batch, Vocab_Size]\n    targets: [Batch] (class indices)\n    &quot;&quot;&quot;\n    # 1. Log-Sum-Exp Trick: max_logit subtraction prevents exp() overflow\n    max_logits, _ = torch.max(logits, dim=-1, keepdim=True)\n    stabilized_logits = logits - max_logits\n\n    # 2. Compute log(sum(exp(z - max_z)))\n    log_sum_exp = torch.log(torch.sum(torch.exp(stabilized_logits), dim=-1, keepdim=True))\n\n    # 3. Log-Softmax: log(p_i) = (z_i - max_z) - log_sum_exp\n    log_probs = stabilized_logits - log_sum_exp\n\n    # 4. Gather true token log probabilities: -log(p_{target})\n    batch_indices = torch.arange(logits.size(0), device=logits.device)\n    target_log_probs = log_probs[batch_indices, targets]\n\n    return -torch.mean(target_log_probs)\n\n# Unit Validation\nif __name__ == &quot;__main__&quot;:\n    B, D, V = 4, 128, 1000\n    x = torch.randn(B, D)\n    rms = RMSNorm(D)\n    normed = rms(x)\n    assert normed.shape == (B, D), &quot;RMSNorm dimension mismatch!&quot;\n\n    dummy_logits = torch.randn(B, V)\n    dummy_targets = torch.randint(0, V, (B,))\n\n    custom_loss = numerically_stable_cross_entropy(dummy_logits, dummy_targets)\n    torch_loss = F.cross_entropy(dummy_logits, dummy_targets)\n\n    assert torch.allclose(custom_loss, torch_loss, atol=1e-5), &quot;Loss mismatch with PyTorch standard!&quot;\n    print(&quot;All mathematical assertions passed successfully.&quot;)\n</code></pre>\n<hr />\n<h2>7. Deep Interview Interrogation Ladder</h2>\n<ul>\n<li><strong>Level 1 (Concept)</strong>: What is the primary difference between LayerNorm and RMSNorm?</li>\n<li><strong>Level 3 (Mechanics)</strong>: Why does Post-LayerNorm cause training instability in deep transformers while Pre-LayerNorm does not?</li>\n<li><strong>Level 5 (Derivation)</strong>: Derive step-by-step why the gradient of Cross-Entropy Loss with Softmax simplifies to <span class=\"katex-inline\">$p_i - y_i$</span>.</li>\n<li><strong>Level 7 (Hardware &amp; Autodiff)</strong>: Explain why reverse-mode automatic differentiation evaluates Vector-Jacobian Products (VJPs) rather than materializing the full Jacobian matrix.</li>\n<li><strong>Level 9 (Deep Systems)</strong>: If you scale a Transformer model from 32 to 128 layers, why do standard weight initializations cause activation explosion, and how do you mathematically adjust the initial variance of residual projection layers?</li>\n<li><strong>Level 10 (Principal Engineering)</strong>: Walk through the exact memory access patterns and arithmetic intensity of RMSNorm vs. LayerNorm on an NVIDIA H100 GPU. Why does RMSNorm enable higher Model FLOPs Utilization (MFU) in large-scale cluster pre-training?</li>\n</ul>"}, {"id": "04_TRANSFORMERS_AND_LLMS", "file": "04_TRANSFORMERS_AND_LLMS.md", "title": "Transformers & Modern LLMs (MLA, RoPE, SwiGLU, MoE)", "priority": "P0", "phase": "Phase 2: Core LLM", "content": "# 04_TRANSFORMERS_AND_LLMS \u2014 Mathematical & Architectural Reference\n\n> **Audience**: ML Engineers, LLM Systems Engineers, and AI Researchers preparing for senior/principal technical interviews.  \n> **Core Objective**: Provide an exhaustive, mathematically rigorous masterclass on Transformer mechanics \u2014 covering Scaled Dot-Product Attention, Multi-Head Latent Attention (MLA), RoPE/YaRN mathematical proofs, SwiGLU gating, Mixture of Experts (MoE) load balancing, and long-context scaling.\n\n---\n\n## 1. The Core Attention Machinery\n\n### 1.1 Scaled Dot-Product Attention: Variance Preservation Derivation\n\nLet $Q \\in \\mathbb{R}^{B \\times S_q \\times d_k}$, $K \\in \\mathbb{R}^{B \\times S_{kv} \\times d_k}$, and $V \\in \\mathbb{R}^{B \\times S_{kv} \\times d_v}$ denote Query, Key, and Value tensors.\n\n$$ \\text{Attention}(Q, K, V) = \\text{Softmax}\\left( \\frac{Q K^T}{\\sqrt{d_k}} + M \\right) V $$\n\nWhere $M \\in \\mathbb{R}^{S_q \\times S_{kv}}$ is the causal attention mask:\n$$ M_{ij} = \\begin{cases} 0 & \\text{if } i \\geq j \\\\ -\\infty & \\text{if } i < j \\end{cases} $$\n\n#### Mathematical Proof: Why the $\\frac{1}{\\sqrt{d_k}}$ Scaling Factor is Mandatory\nConsider a single query vector $q \\in \\mathbb{R}^{d_k}$ and key vector $k \\in \\mathbb{R}^{d_k}$. Assume components $q_i, k_i$ are independent random variables with zero mean and unit variance:\n$$ \\mathbb{E}[q_i] = \\mathbb{E}[k_i] = 0, \\quad \\text{Var}(q_i) = \\text{Var}(k_i) = 1 $$\n\nThe dot product is $S = q^T k = \\sum_{i=1}^{d_k} q_i k_i$.\n1. **Expected Value**:\n   $$ \\mathbb{E}[S] = \\mathbb{E}\\left[\\sum_{i=1}^{d_k} q_i k_i\\right] = \\sum_{i=1}^{d_k} \\mathbb{E}[q_i] \\mathbb{E}[k_i] = 0 $$\n2. **Variance**:\n   $$ \\text{Var}(S) = \\text{Var}\\left(\\sum_{i=1}^{d_k} q_i k_i\\right) = \\sum_{i=1}^{d_k} \\text{Var}(q_i k_i) $$\n   Since $q_i, k_i$ are independent:\n   $$ \\text{Var}(q_i k_i) = \\mathbb{E}[(q_i k_i)^2] - (\\mathbb{E}[q_i k_i])^2 = \\mathbb{E}[q_i^2]\\mathbb{E}[k_i^2] - 0 = \\text{Var}(q_i)\\text{Var}(k_i) = 1 \\cdot 1 = 1 $$\n   Therefore:\n   $$ \\mathbf{\\text{Var}(S) = \\sum_{i=1}^{d_k} 1 = d_k \\implies \\text{Std}(S) = \\sqrt{d_k}} $$\n\n#### The Failure Mode without Scaling:\nFor modern head dimensions $d_k = 128$, $\\text{Std}(S) = \\sqrt{128} \\approx 11.31$.  \nWhen logits have standard deviation $\\sim 11.3$, the Softmax function pushes outputs to extreme values ($p_{\\max} \\approx 1, p_i \\approx 0$).  \nRecall the Softmax Jacobian: $\\frac{\\partial p_i}{\\partial z_j} = p_i(\\delta_{ij} - p_j)$.  \nWhen $p_i \\in \\{0, 1\\}$, $p_i(1 - p_i) \\to 0$, causing **vanishing gradients** across the entire attention layer during backpropagation.  \nScaling by $\\frac{1}{\\sqrt{d_k}}$ normalizes $\\text{Var}\\left(\\frac{q^T k}{\\sqrt{d_k}}\\right) = 1$, keeping gradients within the optimal non-saturating zone.\n\n---\n\n### 1.2 Attention Taxonomy: MHA, MQA, GQA, and MLA\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 MHA (Vaswani et al.)   \u2502  \u2502 MQA (Shazeer 2019)     \u2502  \u2502 GQA (Ainslie et al.)   \u2502  \u2502 MLA (DeepSeek-V2/V3)   \u2502\n\u2502 N_q = 64, N_kv = 64    \u2502  \u2502 N_q = 64, N_kv = 1     \u2502  \u2502 N_q = 64, N_kv = 8     \u2502  \u2502 Low-Rank Latent Vector \u2502\n\u2502 KV Cache: 100% (High)  \u2502  \u2502 KV Cache: 1.56% (Lossy)\u2502  \u2502 KV Cache: 12.5% (Ideal)\u2502  \u2502 KV Cache: ~10% (Exact) \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n#### Mathematical Comparison Table:\n\n| Architecture | Query Heads ($N_q$) | Key/Value Heads ($N_{kv}$) | KV Cache Memory per Token/Layer | Quality / Accuracy Retention |\n| :--- | :--- | :--- | :--- | :--- |\n| **Multi-Head Attention (MHA)** | $H$ | $H$ | $2 \\cdot H \\cdot d_k \\cdot 2 \\text{ bytes}$ | 100% (Baseline) |\n| **Multi-Query Attention (MQA)** | $H$ | $1$ | $2 \\cdot 1 \\cdot d_k \\cdot 2 \\text{ bytes}$ | Noticeable quality degradation on complex retrieval |\n| **Grouped-Query Attention (GQA)** | $H$ | $G = \\frac{H}{\\text{group\\_size}}$ | $2 \\cdot G \\cdot d_k \\cdot 2 \\text{ bytes}$ | $\\sim 99\\%$ of MHA quality with $\\frac{H}{G}\\times$ memory savings |\n| **Multi-Head Latent Attention (MLA)** | $H$ | Compressed Latent $d_c$ | $(d_c + d_R) \\cdot 2 \\text{ bytes}$ | Matches or exceeds MHA quality with lower footprint |\n\n---\n\n## 2. Multi-Head Latent Attention (MLA) \u2014 DeepSeek Architecture\n\n### 2.1 Theoretical Motivation\nIn standard GQA (e.g. LLaMA-3 70B with $N_{kv}=8, d_k=128$), the KV cache at 128k context still occupies hundreds of gigabytes across the cluster, severely bounding inference throughput. DeepSeek introduced **Multi-Head Latent Attention (MLA)** to compress Key and Value representations into a low-rank latent space while preserving full expressive power.\n\n### 2.2 Mathematical Formulation of MLA\n\nLet $h_t \\in \\mathbb{R}^{d_{\\text{model}}}$ be the hidden state at token $t$.\n\n```\nHidden State h_t (dim d_model)\n   \u2502\n   \u251c\u2500\u2500\u2500\u25ba Down-Projection: c_t^{KV} = W^{DKV} \u00b7 h_t   [Compressed KV Latent: dim d_c << H \u00b7 d_h]\n   \u2502        \u2502\n   \u2502        \u251c\u2500\u2500\u25ba Up-Projection Keys:   k_{t, i}^C = W_i^{UK} \u00b7 c_t^{KV}\n   \u2502        \u2514\u2500\u2500\u25ba Up-Projection Values: v_{t, i}^C = W_i^{UV} \u00b7 c_t^{KV}\n   \u2502\n   \u2514\u2500\u2500\u2500\u25ba Decoupled RoPE Key:           k_t^R = RoPE(W^{KR} \u00b7 h_t)  [dim d_R]\n```\n\n#### Step 1: Low-Rank KV Compression (For Cache Storage)\nInstead of caching full high-dimensional $K$ and $V$ tensors, MLA projects $h_t$ into a compressed latent vector $c_t^{KV} \\in \\mathbb{R}^{d_c}$ ($d_c \\ll N_h \\cdot d_h$):\n$$ c_t^{KV} = W^{DKV} h_t \\quad \\text{where } W^{DKV} \\in \\mathbb{R}^{d_c \\times d_{\\text{model}}} $$\n\n#### Step 2: Decoupled Key Generation\nBecause Rotary Positional Embeddings (RoPE) are position-dependent and cannot be directly multiplied into static low-rank matrices, MLA decouples Keys into **content** and **rotary position** components:\n$$ k_{t, i}^C = W_i^{UK} c_t^{KV} \\in \\mathbb{R}^{d_h} \\quad \\text{(Content Key for head } i \\text{)} $$\n$$ k_t^R = \\text{RoPE}(W^{KR} h_t, t) \\in \\mathbb{R}^{d_R} \\quad \\text{(Decoupled Shared RoPE Key, } d_R \\ll d_h \\text{)} $$\n$$ k_{t, i} = \\begin{bmatrix} k_{t, i}^C \\\\ k_t^R \\end{bmatrix} \\in \\mathbb{R}^{d_h + d_R} $$\n\n#### Step 3: Low-Rank Query Projection & Decoupled RoPE Query\nQueries are similarly compressed and decoupled:\n$$ c_t^Q = W^{DQ} h_t \\in \\mathbb{R}^{d_c'} \\quad (d_c' \\text{ is query compression dimension}) $$\n$$ q_{t, i}^C = W_i^{UQ} c_t^Q \\in \\mathbb{R}^{d_h}, \\quad q_{t, i}^R = \\text{RoPE}(W_i^{QR} c_t^Q, t) \\in \\mathbb{R}^{d_R} $$\n$$ q_{t, i} = \\begin{bmatrix} q_{t, i}^C \\\\ q_{t, i}^R \\end{bmatrix} \\in \\mathbb{R}^{d_h + d_R} $$\n\n#### Step 4: Value Generation & Attention Computation\n$$ v_{t, i}^C = W_i^{UV} c_t^{KV} \\in \\mathbb{R}^{d_v} $$\n$$ A_{ij} = \\text{Softmax}\\left( \\frac{q_i^T k_j}{\\sqrt{d_h + d_R}} \\right) = \\text{Softmax}\\left( \\frac{(q_i^C)^T k_j^C + (q_i^R)^T k_j^R}{\\sqrt{d_h + d_R}} \\right) $$\n$$ u_{t, i} = \\sum_j A_{ij} v_{j, i}^C $$\n$$ o_t = W^O \\begin{bmatrix} u_{t, 1} \\\\ \\vdots \\\\ u_{t, N_h} \\end{bmatrix} $$\n\n### 2.3 Concrete KV Cache Memory Savings in Production\nIn DeepSeek-V3 ($d_c = 512, d_R = 64, N_h = 128, d_h = 128$):\n- **Standard MHA Cache per Token/Layer**: $2 \\times N_h \\times d_h \\times 2 \\text{ bytes} = 2 \\times 128 \\times 128 \\times 2 = \\mathbf{65,536 \\text{ bytes}}$\n- **Standard GQA ($N_{kv}=8$)**: $2 \\times 8 \\times 128 \\times 2 = \\mathbf{4,096 \\text{ bytes}}$\n- **MLA Cache per Token/Layer**: $(d_c + d_R) \\times 2 \\text{ bytes} = (512 + 64) \\times 2 = \\mathbf{1,152 \\text{ bytes}}$\n\n$$\\text{Memory Compression vs MHA} = \\frac{65536}{1152} \\approx \\mathbf{56.9\\times}, \\quad \\text{vs GQA} = \\frac{4096}{1152} \\approx \\mathbf{3.55\\times}$$\n\n---\n\n## 3. Rotary Position Embedding (RoPE) & YaRN Scaling\n\n### 3.1 Mathematical Derivation of RoPE (Su et al., 2021)\n\nGiven vector $x \\in \\mathbb{R}^d$ at sequence position $m$, RoPE partitions $x$ into $\\frac{d}{2}$ two-dimensional pairs $[x_{2i-1}, x_{2i}]$ and applies a 2D Givens rotation matrix:\n\n$$ R_{\\Theta, m}^{(i)} = \\begin{bmatrix} \\cos(m \\theta_i) & -\\sin(m \\theta_i) \\\\ \\sin(m \\theta_i) & \\cos(m \\theta_i) \\end{bmatrix} \\quad \\text{where } \\theta_i = \\Theta^{-2(i-1)/d}, \\quad \\Theta = 10000 \\text{ (or } 500000 \\text{)} $$\n\nIn complex notation, let $z_i = x_{2i-1} + i x_{2i} \\in \\mathbb{C}$:\n$$ R_{\\Theta, m}(z_i) = z_i \\cdot e^{i m \\theta_i} $$\n\n#### Inner Product Relative Position Preservation Proof:\nLet $q$ be at position $m$ and $k$ be at position $n$:\n$$ \\tilde{q}_m = q e^{i m \\theta}, \\quad \\tilde{k}_n = k e^{i n \\theta} $$\nThe inner product in the complex plane is given by $\\langle \\tilde{q}_m, \\tilde{k}_n \\rangle = \\text{Re}(\\tilde{q}_m \\tilde{k}_n^*)$ (where $*$ denotes the complex conjugate):\n$$ \\langle \\tilde{q}_m, \\tilde{k}_n \\rangle = \\text{Re}\\left( (q e^{i m \\theta}) (k e^{i n \\theta})^* \\right) = \\text{Re}\\left( q k^* e^{i m \\theta} e^{-i n \\theta} \\right) = \\text{Re}\\left( q k^* e^{i (m - n) \\theta} \\right) $$\n\n$$\\mathbf{\\langle R_{\\Theta, m} q, R_{\\Theta, n} k \\rangle = g(q, k, m - n)}$$\n\n**Conclusion**: The attention score between $q$ and $k$ depends **strictly on their relative distance $(m - n)$**, preserving translation invariance across arbitrary sequence lengths.\n\n---\n\n### 3.2 Long-Context RoPE Scaling: YaRN (Yet another RoPE extensioN)\n\nWhen extending context from $L_{\\text{train}} = 4\\text{k}$ to $L_{\\text{test}} = 128\\text{k}$, naive linear interpolation divides frequencies by $s = \\frac{L_{\\text{test}}}{L_{\\text{train}}} = 32$: $\\theta_i' = \\frac{\\theta_i}{s}$.  \n*The Flaw*: High-frequency components (small $i$, capturing local grammar) lose resolution, destroying the model's short-context capabilities.\n\n#### The YaRN Solution (Peng et al., 2023):\nPartitions frequency spectrum into three distinct regimes based on wavelength $\\lambda_i = \\frac{2\\pi}{\\theta_i}$:\n1. **High Frequencies ($\\lambda_i < r_{\\text{low}}$)**: No interpolation ($\\theta_i' = \\theta_i$). Preserves local token relationships.\n2. **Low Frequencies ($\\lambda_i > r_{\\text{high}}$)**: Full linear interpolation ($\\theta_i' = \\frac{\\theta_i}{s}$). Extrapolates long distances.\n3. **Mid Frequencies ($r_{\\text{low}} \\leq \\lambda_i \\leq r_{\\text{high}}$)**: Smooth ramp interpolation via blending factor $\\gamma_i = \\frac{\\lambda_i - r_{\\text{low}}}{r_{\\text{high}} - r_{\\text{low}}}$:\n   $$ \\theta_i' = (1 - \\gamma_i) \\theta_i + \\gamma_i \\frac{\\theta_i}{s} $$\n\n- **Temperature / Entropy Correction Factor ($\\sqrt{t}$)**:\n  Because longer contexts increase attention entropy ($H(A) \\propto \\log L$), YaRN scales the query-key dot product by temperature factor $t = 0.1 \\ln(s) + 1$:\n  $$ \\text{Attention} = \\text{Softmax}\\left( \\frac{Q K^T}{\\sqrt{t} \\sqrt{d_k}} \\right) V $$\n\n---\n\n## 4. Feed-Forward Networks (FFN): SwiGLU Mechanics\n\nStandard Transformer FFN (ReLU):\n$$ \\text{FFN}_{\\text{ReLU}}(x) = \\max(0, x W_1 + b_1) W_2 + b_2 $$\n\nModern LLMs (LLaMA-3, Mistral, Gemma) replace ReLU with **SwiGLU (Swish Gated Linear Unit)** (Shazeer, 2020):\n$$ \\text{Swish}_\\beta(z) = z \\cdot \\sigma(\\beta z) = \\frac{z}{1 + e^{-\\beta z}} \\quad (\\text{with } \\beta = 1 \\implies \\text{SiLU}) $$\n$$ \\text{SwiGLU}(x) = \\left( \\text{SiLU}(x W_{\\text{gate}}) \\odot x W_{\\text{up}} \\right) W_{\\text{down}} $$\n\n```\n                       \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n                       \u2502   Hidden Vector x    \u2502\n                       \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                                  \u2502\n                  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n                  \u25bc                               \u25bc\n     \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510     \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n     \u2502  Linear (W_gate) + SiLU \u2502     \u2502     Linear (W_up)       \u2502\n     \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518     \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                  \u2502                               \u2502\n                  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                                  \u25bc\n                        Element-wise Multiply \u2299\n                                  \u2502\n                                  \u25bc\n                     \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n                     \u2502    Linear (W_down)      \u2502\n                     \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n#### Parameter Dimension Matching:\n- In standard FFN: $W_1 \\in \\mathbb{R}^{d \\times 4d}, W_2 \\in \\mathbb{R}^{4d \\times d} \\implies 8 d^2 \\text{ parameters}$.\n- In SwiGLU: Three matrices ($W_{\\text{gate}}, W_{\\text{up}} \\in \\mathbb{R}^{d \\times d_{ff}}, W_{\\text{down}} \\in \\mathbb{R}^{d_{ff} \\times d}$).\n- To maintain exact parameter equivalence with standard $4d$ FFN:\n  $$ 3 \\cdot d \\cdot d_{ff} = 8 d^2 \\implies d_{ff} = \\frac{8}{3} d \\approx 2.667 d $$\n  *Example*: In LLaMA-3 8B ($d_{\\text{model}} = 4096$), $d_{ff} = 14336 = 3.5 d_{\\text{model}}$ (rounded to nearest multiple of 256 for GPU alignment).\n\n---\n\n## 5. Mixture of Experts (MoE) & DeepSeek-V3 Load Balancing\n\n### 5.1 MoE Routing Formulation\n\nAn MoE layer replaces the standard dense FFN with $N$ independent expert networks $\\{E_1, E_2, \\dots, E_N\\}$, routing each token to the Top-$K$ experts via a gating network $G(x)$:\n\n$$ y = \\sum_{i \\in \\text{Top}K} g_i(x) E_i(x) $$\n\n- **Standard Top-$K$ Softmax Gating**:\n  $$ H(x) = x W_g \\in \\mathbb{R}^N $$\n  $$ \\text{Top}K(H(x)) = \\text{Indices of } K \\text{ largest values in } H(x) $$\n  $$ g_i(x) = \\begin{cases} \\frac{\\exp(H(x)_i)}{\\sum_{j \\in \\text{Top}K} \\exp(H(x)_j)} & \\text{if } i \\in \\text{Top}K(H(x)) \\\\ 0 & \\text{otherwise} \\end{cases} $$\n\n---\n\n### 5.2 The Routing Collapse Problem & Auxiliary Losses\n\nWithout constraints, the gating network quickly suffers from **Expert Routing Collapse** \u2014 routing all tokens to 2 or 3 favorite experts while the remaining $N-K$ experts starve and receive zero gradient updates.\n\n#### Classical Solution: Auxiliary Load Balancing Loss (Switch Transformer / Mixtral):\n$$ \\mathcal{L}_{\\text{aux}} = \\alpha \\cdot N \\sum_{i=1}^N f_i P_i $$\nWhere:\n- $f_i = \\frac{1}{T} \\sum_{t=1}^T \\mathbb{I}(\\text{token } t \\text{ routed to expert } i)$ (fraction of tokens dispatched)\n- $P_i = \\frac{1}{T} \\sum_{t=1}^T g_i(x_t)$ (average routing probability)\n- $\\alpha \\approx 0.01$ (hyperparameter).\n\n*The Problem*: $\\mathcal{L}_{\\text{aux}}$ acts as a regularizer that penalizes routing specialization, degrading the overall model capability.\n\n---\n\n### 5.3 DeepSeek-V3 Auxiliary-Loss-Free Load Balancing\n\nDeepSeek-V3 introduces **bias-driven load balancing** without adding an auxiliary loss term to the objective:\n\n$$ \\text{Gating Score: } s_{i, t} = \\text{Softmax}(x_t W_g)_i + b_i $$\nWhere $b_i \\in \\mathbb{R}$ is a dynamic expert bias updated online during training:\n$$ b_i \\leftarrow b_i + \\gamma \\cdot \\left( \\frac{1}{N} - \\frac{\\text{Tokens Dispatched to Expert } i}{\\text{Total Tokens in Batch}} \\right) $$\n\n- If Expert $i$ is overloaded ($f_i > \\frac{1}{N}$), $b_i$ is decreased, shifting future tokens away.\n- If Expert $i$ is starved ($f_i < \\frac{1}{N}$), $b_i$ is increased, naturally pulling tokens in.\n- **Advantage**: Gradients directly optimize primary language modeling loss with zero interference from artificial auxiliary balance penalties.\n\n---\n\n## 6. PyTorch Implementation: Multi-Head Latent Attention (MLA)\n\n```python\nimport torch\nimport torch.nn as nn\nimport torch.nn.functional as F\nimport math\n\nclass MultiHeadLatentAttention(nn.Module):\n    \"\"\"\n    Multi-Head Latent Attention (MLA) as introduced in DeepSeek-V2 / DeepSeek-V3.\n    Features:\n    - Low-rank KV compression into latent vector c_t^{KV}\n    - Decoupled Rotary Positional Embeddings (RoPE)\n    - Low-rank Query compression\n    \"\"\"\n    def __init__(\n        self,\n        d_model: int = 2048,\n        num_heads: int = 16,\n        d_head: int = 128,\n        d_c_kv: int = 512,    # KV compression dimension\n        d_c_q: int = 512,     # Query compression dimension\n        d_rope: int = 64      # Decoupled RoPE dimension\n    ):\n        super().__init__()\n        self.d_model = d_model\n        self.num_heads = num_heads\n        self.d_head = d_head\n        self.d_c_kv = d_c_kv\n        self.d_c_q = d_c_q\n        self.d_rope = d_rope\n        self.scale = 1.0 / math.sqrt(d_head + d_rope)\n\n        # 1. Query Compression & Projections\n        self.w_dq = nn.Linear(d_model, d_c_q, bias=False)\n        self.w_uq = nn.Linear(d_c_q, num_heads * d_head, bias=False)\n        self.w_qr = nn.Linear(d_c_q, num_heads * d_rope, bias=False)\n\n        # 2. Key-Value Compression & Projections\n        self.w_dkv = nn.Linear(d_model, d_c_kv, bias=False)\n        self.w_uk = nn.Linear(d_c_kv, num_heads * d_head, bias=False)\n        self.w_uv = nn.Linear(d_c_kv, num_heads * d_head, bias=False)\n        self.w_kr = nn.Linear(d_model, d_rope, bias=False) # Shared RoPE key\n\n        # 3. Output Projection\n        self.w_out = nn.Linear(num_heads * d_head, d_model, bias=False)\n\n    def apply_rope(self, x: torch.Tensor, pos: torch.Tensor) -> torch.Tensor:\n        # Simple 2D rotary embedding for illustration\n        B, S, H, D = x.shape\n        half_d = D // 2\n        freqs = torch.exp(\n            -math.log(10000.0) * torch.arange(0, half_d, dtype=torch.float32, device=x.device) / half_d\n        )\n        angles = pos.unsqueeze(-1) * freqs.unsqueeze(0) # [S, half_d]\n        cos = torch.cos(angles).unsqueeze(0).unsqueeze(2) # [1, S, 1, half_d]\n        sin = torch.sin(angles).unsqueeze(0).unsqueeze(2) # [1, S, 1, half_d]\n        \n        x1, x2 = x[..., :half_d], x[..., half_d:]\n        rotated = torch.cat([x1 * cos - x2 * sin, x1 * sin + x2 * cos], dim=-1)\n        return rotated\n\n    def forward(self, x: torch.Tensor, kv_cache_latent=None, kv_cache_rope=None):\n        B, S, _ = x.shape\n        pos = torch.arange(S, device=x.device)\n\n        # --- Query Processing ---\n        c_q = self.w_dq(x) # [B, S, d_c_q]\n        q_c = self.w_uq(c_q).view(B, S, self.num_heads, self.d_head)\n        q_r = self.w_qr(c_q).view(B, S, self.num_heads, self.d_rope)\n        q_r = self.apply_rope(q_r, pos)\n        q = torch.cat([q_c, q_r], dim=-1) # [B, S, H, d_head + d_rope]\n\n        # --- KV Compression & Latent Generation ---\n        c_kv = self.w_dkv(x) # [B, S, d_c_kv] (This is what gets stored in the KV cache!)\n        k_r = self.w_kr(x).unsqueeze(2) # [B, S, 1, d_rope]\n        k_r = self.apply_rope(k_r, pos).expand(B, S, self.num_heads, self.d_rope)\n\n        # Uncompress K and V on-the-fly\n        k_c = self.w_uk(c_kv).view(B, S, self.num_heads, self.d_head)\n        v = self.w_uv(c_kv).view(B, S, self.num_heads, self.d_head)\n        k = torch.cat([k_c, k_r], dim=-1) # [B, S, H, d_head + d_rope]\n\n        # --- Attention Computation ---\n        # Permute for batch matrix multiply: [B, H, S_q, S_k]\n        q = q.transpose(1, 2)\n        k = k.transpose(1, 2)\n        v = v.transpose(1, 2)\n\n        scores = torch.matmul(q, k.transpose(-2, -1)) * self.scale\n\n        # Apply Causal Mask\n        mask = torch.triu(torch.full((S, S), float('-inf'), device=x.device), diagonal=1)\n        scores = scores + mask.unsqueeze(0).unsqueeze(1)\n\n        attn_weights = F.softmax(scores, dim=-1)\n        out = torch.matmul(attn_weights, v) # [B, H, S, d_head]\n\n        # Concatenate heads and project output\n        out = out.transpose(1, 2).contiguous().view(B, S, self.num_heads * self.d_head)\n        return self.w_out(out), c_kv, k_r\n\nif __name__ == \"__main__\":\n    B, S, D = 2, 64, 2048\n    x = torch.randn(B, S, D)\n    mla = MultiHeadLatentAttention(d_model=D, num_heads=16, d_head=128, d_c_kv=512, d_rope=64)\n    out, latent_kv, rope_k = mla(x)\n    assert out.shape == (B, S, D), \"MLA output shape mismatch!\"\n    assert latent_kv.shape == (B, S, 512), \"Latent KV shape mismatch!\"\n    print(\"Multi-Head Latent Attention (MLA) test passed successfully.\")\n```\n\n---\n\n## 7. Deep Interview Interrogation Ladder\n\n- **Level 1 (Concept)**: What is the primary operational difference between MHA, GQA, and MLA?\n- **Level 3 (Proof)**: Prove mathematically why the variance of Query-Key dot products equals $d_k$, and why Softmax temperature scaling $\\frac{1}{\\sqrt{d_k}}$ prevents vanishing gradients.\n- **Level 5 (Mechanics)**: Why does Rotary Position Embedding (RoPE) preserve translation invariance in the inner product? (Show the complex exponential proof).\n- **Level 7 (Architectural Sizing)**: Calculate the exact KV cache memory reduction when switching a 70B parameter model from GQA ($N_{kv}=8$) to MLA ($d_c=512, d_R=64$).\n- **Level 9 (MoE Dynamics)**: Explain why standard auxiliary load balancing losses degrade model capability in MoE training, and how DeepSeek-V3's dynamic expert bias term solves this without auxiliary losses.\n- **Level 10 (Principal Engineering)**: Walk through how you would optimize the kernel execution of Multi-Head Latent Attention (MLA) during decode. How does matrix associativity allow absorbing the up-projection matrix $W^{UK}$ into the Query vector before attending to the cached latent $c_t^{KV}$?\n", "html": "<h1>04_TRANSFORMERS_AND_LLMS \u2014 Mathematical &amp; Architectural Reference</h1>\n<blockquote>\n<p><strong>Audience</strong>: ML Engineers, LLM Systems Engineers, and AI Researchers preparing for senior/principal technical interviews.<br />\n<strong>Core Objective</strong>: Provide an exhaustive, mathematically rigorous masterclass on Transformer mechanics \u2014 covering Scaled Dot-Product Attention, Multi-Head Latent Attention (MLA), RoPE/YaRN mathematical proofs, SwiGLU gating, Mixture of Experts (MoE) load balancing, and long-context scaling.</p>\n</blockquote>\n<hr />\n<h2>1. The Core Attention Machinery</h2>\n<h3>1.1 Scaled Dot-Product Attention: Variance Preservation Derivation</h3>\n<p>Let <span class=\"katex-inline\">$Q \\in \\mathbb{R}^{B \\times S_q \\times d_k}$</span>, <span class=\"katex-inline\">$K \\in \\mathbb{R}^{B \\times S_{kv} \\times d_k}$</span>, and <span class=\"katex-inline\">$V \\in \\mathbb{R}^{B \\times S_{kv} \\times d_v}$</span> denote Query, Key, and Value tensors.</p>\n<div class=\"katex-display\">$$\\text{Attention}(Q, K, V) = \\text{Softmax}\\left( \\frac{Q K^T}{\\sqrt{d_k}} + M \\right) V$$</div>\n\n<p>Where <span class=\"katex-inline\">$M \\in \\mathbb{R}^{S_q \\times S_{kv}}$</span> is the causal attention mask:</p>\n<div class=\"katex-display\">$$M_{ij} = \\begin{cases} 0 &amp; \\text{if } i \\geq j \\\\ -\\infty &amp; \\text{if } i &lt; j \\end{cases}$$</div>\n\n<h4>Mathematical Proof: Why the <span class=\"katex-inline\">$\\frac{1}{\\sqrt{d_k}}$</span> Scaling Factor is Mandatory</h4>\n<p>Consider a single query vector <span class=\"katex-inline\">$q \\in \\mathbb{R}^{d_k}$</span> and key vector <span class=\"katex-inline\">$k \\in \\mathbb{R}^{d_k}$</span>. Assume components <span class=\"katex-inline\">$q_i, k_i$</span> are independent random variables with zero mean and unit variance:</p>\n<div class=\"katex-display\">$$\\mathbb{E}[q_i] = \\mathbb{E}[k_i] = 0, \\quad \\text{Var}(q_i) = \\text{Var}(k_i) = 1$$</div>\n\n<p>The dot product is <span class=\"katex-inline\">$S = q^T k = \\sum_{i=1}^{d_k} q_i k_i$</span>.<br />\n1. <strong>Expected Value</strong>:<br />\n   <div class=\"katex-display\">$$\\mathbb{E}[S] = \\mathbb{E}\\left[\\sum_{i=1}^{d_k} q_i k_i\\right] = \\sum_{i=1}^{d_k} \\mathbb{E}[q_i] \\mathbb{E}[k_i] = 0$$</div></p>\n<ol start=\"2\">\n<li><strong>Variance</strong>:<br />\n   <div class=\"katex-display\">$$\\text{Var}(S) = \\text{Var}\\left(\\sum_{i=1}^{d_k} q_i k_i\\right) = \\sum_{i=1}^{d_k} \\text{Var}(q_i k_i)$$</div></li>\n</ol>\n<p>Since <span class=\"katex-inline\">$q_i, k_i$</span> are independent:<br />\n   <div class=\"katex-display\">$$\\text{Var}(q_i k_i) = \\mathbb{E}[(q_i k_i)^2] - (\\mathbb{E}[q_i k_i])^2 = \\mathbb{E}[q_i^2]\\mathbb{E}[k_i^2] - 0 = \\text{Var}(q_i)\\text{Var}(k_i) = 1 \\cdot 1 = 1$$</div></p>\n<p>Therefore:<br />\n   <div class=\"katex-display\">$$\\mathbf{\\text{Var}(S) = \\sum_{i=1}^{d_k} 1 = d_k \\implies \\text{Std}(S) = \\sqrt{d_k}}$$</div>\n</p>\n<h4>The Failure Mode without Scaling:</h4>\n<p>For modern head dimensions <span class=\"katex-inline\">$d_k = 128$</span>, <span class=\"katex-inline\">$\\text{Std}(S) = \\sqrt{128} \\approx 11.31$</span>.<br />\nWhen logits have standard deviation <span class=\"katex-inline\">$\\sim 11.3$</span>, the Softmax function pushes outputs to extreme values (<span class=\"katex-inline\">$p_{\\max} \\approx 1, p_i \\approx 0$</span>).<br />\nRecall the Softmax Jacobian: <span class=\"katex-inline\">$\\frac{\\partial p_i}{\\partial z_j} = p_i(\\delta_{ij} - p_j)$</span>.<br />\nWhen <span class=\"katex-inline\">$p_i \\in \\{0, 1\\}$</span>, <span class=\"katex-inline\">$p_i(1 - p_i) \\to 0$</span>, causing <strong>vanishing gradients</strong> across the entire attention layer during backpropagation.<br />\nScaling by <span class=\"katex-inline\">$\\frac{1}{\\sqrt{d_k}}$</span> normalizes <span class=\"katex-inline\">$\\text{Var}\\left(\\frac{q^T k}{\\sqrt{d_k}}\\right) = 1$</span>, keeping gradients within the optimal non-saturating zone.</p>\n<hr />\n<h3>1.2 Attention Taxonomy: MHA, MQA, GQA, and MLA</h3>\n<pre><code>\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 MHA (Vaswani et al.)   \u2502  \u2502 MQA (Shazeer 2019)     \u2502  \u2502 GQA (Ainslie et al.)   \u2502  \u2502 MLA (DeepSeek-V2/V3)   \u2502\n\u2502 N_q = 64, N_kv = 64    \u2502  \u2502 N_q = 64, N_kv = 1     \u2502  \u2502 N_q = 64, N_kv = 8     \u2502  \u2502 Low-Rank Latent Vector \u2502\n\u2502 KV Cache: 100% (High)  \u2502  \u2502 KV Cache: 1.56% (Lossy)\u2502  \u2502 KV Cache: 12.5% (Ideal)\u2502  \u2502 KV Cache: ~10% (Exact) \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n</code></pre>\n<h4>Mathematical Comparison Table:</h4>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Architecture</th>\n<th style=\"text-align: left;\">Query Heads (<span class=\"katex-inline\">$N_q$</span>)</th>\n<th style=\"text-align: left;\">Key/Value Heads (<span class=\"katex-inline\">$N_{kv}$</span>)</th>\n<th style=\"text-align: left;\">KV Cache Memory per Token/Layer</th>\n<th style=\"text-align: left;\">Quality / Accuracy Retention</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>Multi-Head Attention (MHA)</strong></td>\n<td style=\"text-align: left;\"><span class=\"katex-inline\">$H$</span></td>\n<td style=\"text-align: left;\"><span class=\"katex-inline\">$H$</span></td>\n<td style=\"text-align: left;\"><span class=\"katex-inline\">$2 \\cdot H \\cdot d_k \\cdot 2 \\text{ bytes}$</span></td>\n<td style=\"text-align: left;\">100% (Baseline)</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Multi-Query Attention (MQA)</strong></td>\n<td style=\"text-align: left;\"><span class=\"katex-inline\">$H$</span></td>\n<td style=\"text-align: left;\"><span class=\"katex-inline\">$1$</span></td>\n<td style=\"text-align: left;\"><span class=\"katex-inline\">$2 \\cdot 1 \\cdot d_k \\cdot 2 \\text{ bytes}$</span></td>\n<td style=\"text-align: left;\">Noticeable quality degradation on complex retrieval</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Grouped-Query Attention (GQA)</strong></td>\n<td style=\"text-align: left;\"><span class=\"katex-inline\">$H$</span></td>\n<td style=\"text-align: left;\"><span class=\"katex-inline\">$G = \\frac{H}{\\text{group\\_size}}$</span></td>\n<td style=\"text-align: left;\"><span class=\"katex-inline\">$2 \\cdot G \\cdot d_k \\cdot 2 \\text{ bytes}$</span></td>\n<td style=\"text-align: left;\"><span class=\"katex-inline\">$\\sim 99\\%$</span> of MHA quality with <span class=\"katex-inline\">$\\frac{H}{G}\\times$</span> memory savings</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Multi-Head Latent Attention (MLA)</strong></td>\n<td style=\"text-align: left;\"><span class=\"katex-inline\">$H$</span></td>\n<td style=\"text-align: left;\">Compressed Latent <span class=\"katex-inline\">$d_c$</span></td>\n<td style=\"text-align: left;\"><span class=\"katex-inline\">$(d_c + d_R) \\cdot 2 \\text{ bytes}$</span></td>\n<td style=\"text-align: left;\">Matches or exceeds MHA quality with lower footprint</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>2. Multi-Head Latent Attention (MLA) \u2014 DeepSeek Architecture</h2>\n<h3>2.1 Theoretical Motivation</h3>\n<p>In standard GQA (e.g. LLaMA-3 70B with <span class=\"katex-inline\">$N_{kv}=8, d_k=128$</span>), the KV cache at 128k context still occupies hundreds of gigabytes across the cluster, severely bounding inference throughput. DeepSeek introduced <strong>Multi-Head Latent Attention (MLA)</strong> to compress Key and Value representations into a low-rank latent space while preserving full expressive power.</p>\n<h3>2.2 Mathematical Formulation of MLA</h3>\n<p>Let <span class=\"katex-inline\">$h_t \\in \\mathbb{R}^{d_{\\text{model}}}$</span> be the hidden state at token <span class=\"katex-inline\">$t$</span>.</p>\n<pre><code>Hidden State h_t (dim d_model)\n   \u2502\n   \u251c\u2500\u2500\u2500\u25ba Down-Projection: c_t^{KV} = W^{DKV} \u00b7 h_t   [Compressed KV Latent: dim d_c &lt;&lt; H \u00b7 d_h]\n   \u2502        \u2502\n   \u2502        \u251c\u2500\u2500\u25ba Up-Projection Keys:   k_{t, i}^C = W_i^{UK} \u00b7 c_t^{KV}\n   \u2502        \u2514\u2500\u2500\u25ba Up-Projection Values: v_{t, i}^C = W_i^{UV} \u00b7 c_t^{KV}\n   \u2502\n   \u2514\u2500\u2500\u2500\u25ba Decoupled RoPE Key:           k_t^R = RoPE(W^{KR} \u00b7 h_t)  [dim d_R]\n</code></pre>\n<h4>Step 1: Low-Rank KV Compression (For Cache Storage)</h4>\n<p>Instead of caching full high-dimensional <span class=\"katex-inline\">$K$</span> and <span class=\"katex-inline\">$V$</span> tensors, MLA projects <span class=\"katex-inline\">$h_t$</span> into a compressed latent vector <span class=\"katex-inline\">$c_t^{KV} \\in \\mathbb{R}^{d_c}$</span> (<span class=\"katex-inline\">$d_c \\ll N_h \\cdot d_h$</span>):</p>\n<div class=\"katex-display\">$$c_t^{KV} = W^{DKV} h_t \\quad \\text{where } W^{DKV} \\in \\mathbb{R}^{d_c \\times d_{\\text{model}}}$$</div>\n\n<h4>Step 2: Decoupled Key Generation</h4>\n<p>Because Rotary Positional Embeddings (RoPE) are position-dependent and cannot be directly multiplied into static low-rank matrices, MLA decouples Keys into <strong>content</strong> and <strong>rotary position</strong> components:</p>\n<div class=\"katex-display\">$$k_{t, i}^C = W_i^{UK} c_t^{KV} \\in \\mathbb{R}^{d_h} \\quad \\text{(Content Key for head } i \\text{)}$$</div>\n<div class=\"katex-display\">$$k_t^R = \\text{RoPE}(W^{KR} h_t, t) \\in \\mathbb{R}^{d_R} \\quad \\text{(Decoupled Shared RoPE Key, } d_R \\ll d_h \\text{)}$$</div>\n<div class=\"katex-display\">$$k_{t, i} = \\begin{bmatrix} k_{t, i}^C \\\\ k_t^R \\end{bmatrix} \\in \\mathbb{R}^{d_h + d_R}$$</div>\n\n<h4>Step 3: Low-Rank Query Projection &amp; Decoupled RoPE Query</h4>\n<p>Queries are similarly compressed and decoupled:</p>\n<div class=\"katex-display\">$$c_t^Q = W^{DQ} h_t \\in \\mathbb{R}^{d_c&#x27;} \\quad (d_c&#x27; \\text{ is query compression dimension})$$</div>\n<div class=\"katex-display\">$$q_{t, i}^C = W_i^{UQ} c_t^Q \\in \\mathbb{R}^{d_h}, \\quad q_{t, i}^R = \\text{RoPE}(W_i^{QR} c_t^Q, t) \\in \\mathbb{R}^{d_R}$$</div>\n<div class=\"katex-display\">$$q_{t, i} = \\begin{bmatrix} q_{t, i}^C \\\\ q_{t, i}^R \\end{bmatrix} \\in \\mathbb{R}^{d_h + d_R}$$</div>\n\n<h4>Step 4: Value Generation &amp; Attention Computation</h4>\n<div class=\"katex-display\">$$v_{t, i}^C = W_i^{UV} c_t^{KV} \\in \\mathbb{R}^{d_v}$$</div>\n<div class=\"katex-display\">$$A_{ij} = \\text{Softmax}\\left( \\frac{q_i^T k_j}{\\sqrt{d_h + d_R}} \\right) = \\text{Softmax}\\left( \\frac{(q_i^C)^T k_j^C + (q_i^R)^T k_j^R}{\\sqrt{d_h + d_R}} \\right)$$</div>\n<div class=\"katex-display\">$$u_{t, i} = \\sum_j A_{ij} v_{j, i}^C$$</div>\n<div class=\"katex-display\">$$o_t = W^O \\begin{bmatrix} u_{t, 1} \\\\ \\vdots \\\\ u_{t, N_h} \\end{bmatrix}$$</div>\n\n<h3>2.3 Concrete KV Cache Memory Savings in Production</h3>\n<p>In DeepSeek-V3 (<span class=\"katex-inline\">$d_c = 512, d_R = 64, N_h = 128, d_h = 128$</span>):<br />\n- <strong>Standard MHA Cache per Token/Layer</strong>: <span class=\"katex-inline\">$2 \\times N_h \\times d_h \\times 2 \\text{ bytes} = 2 \\times 128 \\times 128 \\times 2 = \\mathbf{65,536 \\text{ bytes}}$</span><br />\n- <strong>Standard GQA (<span class=\"katex-inline\">$N_{kv}=8$</span>)</strong>: <span class=\"katex-inline\">$2 \\times 8 \\times 128 \\times 2 = \\mathbf{4,096 \\text{ bytes}}$</span><br />\n- <strong>MLA Cache per Token/Layer</strong>: <span class=\"katex-inline\">$(d_c + d_R) \\times 2 \\text{ bytes} = (512 + 64) \\times 2 = \\mathbf{1,152 \\text{ bytes}}$</span></p>\n<div class=\"katex-display\">$$\\text{Memory Compression vs MHA} = \\frac{65536}{1152} \\approx \\mathbf{56.9\\times}, \\quad \\text{vs GQA} = \\frac{4096}{1152} \\approx \\mathbf{3.55\\times}$$</div>\n\n<hr />\n<h2>3. Rotary Position Embedding (RoPE) &amp; YaRN Scaling</h2>\n<h3>3.1 Mathematical Derivation of RoPE (Su et al., 2021)</h3>\n<p>Given vector <span class=\"katex-inline\">$x \\in \\mathbb{R}^d$</span> at sequence position <span class=\"katex-inline\">$m$</span>, RoPE partitions <span class=\"katex-inline\">$x$</span> into <span class=\"katex-inline\">$\\frac{d}{2}$</span> two-dimensional pairs <span class=\"katex-inline\">$[x_{2i-1}, x_{2i}]$</span> and applies a 2D Givens rotation matrix:</p>\n<div class=\"katex-display\">$$R_{\\Theta, m}^{(i)} = \\begin{bmatrix} \\cos(m \\theta_i) &amp; -\\sin(m \\theta_i) \\\\ \\sin(m \\theta_i) &amp; \\cos(m \\theta_i) \\end{bmatrix} \\quad \\text{where } \\theta_i = \\Theta^{-2(i-1)/d}, \\quad \\Theta = 10000 \\text{ (or } 500000 \\text{)}$$</div>\n\n<p>In complex notation, let <span class=\"katex-inline\">$z_i = x_{2i-1} + i x_{2i} \\in \\mathbb{C}$</span>:</p>\n<div class=\"katex-display\">$$R_{\\Theta, m}(z_i) = z_i \\cdot e^{i m \\theta_i}$$</div>\n\n<h4>Inner Product Relative Position Preservation Proof:</h4>\n<p>Let <span class=\"katex-inline\">$q$</span> be at position <span class=\"katex-inline\">$m$</span> and <span class=\"katex-inline\">$k$</span> be at position <span class=\"katex-inline\">$n$</span>:</p>\n<div class=\"katex-display\">$$\\tilde{q}_m = q e^{i m \\theta}, \\quad \\tilde{k}_n = k e^{i n \\theta}$$</div>\n<p>The inner product in the complex plane is given by <span class=\"katex-inline\">$\\langle \\tilde{q}_m, \\tilde{k}_n \\rangle = \\text{Re}(\\tilde{q}_m \\tilde{k}_n^*)$</span> (where <span class=\"katex-inline\">$*$</span> denotes the complex conjugate):</p>\n<div class=\"katex-display\">$$\\langle \\tilde{q}_m, \\tilde{k}_n \\rangle = \\text{Re}\\left( (q e^{i m \\theta}) (k e^{i n \\theta})^* \\right) = \\text{Re}\\left( q k^* e^{i m \\theta} e^{-i n \\theta} \\right) = \\text{Re}\\left( q k^* e^{i (m - n) \\theta} \\right)$$</div>\n\n<div class=\"katex-display\">$$\\mathbf{\\langle R_{\\Theta, m} q, R_{\\Theta, n} k \\rangle = g(q, k, m - n)}$$</div>\n\n<p><strong>Conclusion</strong>: The attention score between <span class=\"katex-inline\">$q$</span> and <span class=\"katex-inline\">$k$</span> depends <strong>strictly on their relative distance <span class=\"katex-inline\">$(m - n)$</span></strong>, preserving translation invariance across arbitrary sequence lengths.</p>\n<hr />\n<h3>3.2 Long-Context RoPE Scaling: YaRN (Yet another RoPE extensioN)</h3>\n<p>When extending context from <span class=\"katex-inline\">$L_{\\text{train}} = 4\\text{k}$</span> to <span class=\"katex-inline\">$L_{\\text{test}} = 128\\text{k}$</span>, naive linear interpolation divides frequencies by <span class=\"katex-inline\">$s = \\frac{L_{\\text{test}}}{L_{\\text{train}}} = 32$</span>: <span class=\"katex-inline\">$\\theta_i&#x27; = \\frac{\\theta_i}{s}$</span>.<br />\n<em>The Flaw</em>: High-frequency components (small <span class=\"katex-inline\">$i$</span>, capturing local grammar) lose resolution, destroying the model's short-context capabilities.</p>\n<h4>The YaRN Solution (Peng et al., 2023):</h4>\n<p>Partitions frequency spectrum into three distinct regimes based on wavelength <span class=\"katex-inline\">$\\lambda_i = \\frac{2\\pi}{\\theta_i}$</span>:<br />\n1. <strong>High Frequencies (<span class=\"katex-inline\">$\\lambda_i &lt; r_{\\text{low}}$</span>)</strong>: No interpolation (<span class=\"katex-inline\">$\\theta_i&#x27; = \\theta_i$</span>). Preserves local token relationships.<br />\n2. <strong>Low Frequencies (<span class=\"katex-inline\">$\\lambda_i &gt; r_{\\text{high}}$</span>)</strong>: Full linear interpolation (<span class=\"katex-inline\">$\\theta_i&#x27; = \\frac{\\theta_i}{s}$</span>). Extrapolates long distances.<br />\n3. <strong>Mid Frequencies (<span class=\"katex-inline\">$r_{\\text{low}} \\leq \\lambda_i \\leq r_{\\text{high}}$</span>)</strong>: Smooth ramp interpolation via blending factor <span class=\"katex-inline\">$\\gamma_i = \\frac{\\lambda_i - r_{\\text{low}}}{r_{\\text{high}} - r_{\\text{low}}}$</span>:<br />\n   <div class=\"katex-display\">$$\\theta_i&#x27; = (1 - \\gamma_i) \\theta_i + \\gamma_i \\frac{\\theta_i}{s}$$</div>\n</p>\n<ul>\n<li><strong>Temperature / Entropy Correction Factor (<span class=\"katex-inline\">$\\sqrt{t}$</span>)</strong>:<br />\n  Because longer contexts increase attention entropy (<span class=\"katex-inline\">$H(A) \\propto \\log L$</span>), YaRN scales the query-key dot product by temperature factor <span class=\"katex-inline\">$t = 0.1 \\ln(s) + 1$</span>:<br />\n  <div class=\"katex-display\">$$\\text{Attention} = \\text{Softmax}\\left( \\frac{Q K^T}{\\sqrt{t} \\sqrt{d_k}} \\right) V$$</div>\n</li>\n</ul>\n<hr />\n<h2>4. Feed-Forward Networks (FFN): SwiGLU Mechanics</h2>\n<p>Standard Transformer FFN (ReLU):</p>\n<div class=\"katex-display\">$$\\text{FFN}_{\\text{ReLU}}(x) = \\max(0, x W_1 + b_1) W_2 + b_2$$</div>\n\n<p>Modern LLMs (LLaMA-3, Mistral, Gemma) replace ReLU with <strong>SwiGLU (Swish Gated Linear Unit)</strong> (Shazeer, 2020):</p>\n<div class=\"katex-display\">$$\\text{Swish}_\\beta(z) = z \\cdot \\sigma(\\beta z) = \\frac{z}{1 + e^{-\\beta z}} \\quad (\\text{with } \\beta = 1 \\implies \\text{SiLU})$$</div>\n<div class=\"katex-display\">$$\\text{SwiGLU}(x) = \\left( \\text{SiLU}(x W_{\\text{gate}}) \\odot x W_{\\text{up}} \\right) W_{\\text{down}}$$</div>\n\n<pre><code>                       \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n                       \u2502   Hidden Vector x    \u2502\n                       \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                                  \u2502\n                  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n                  \u25bc                               \u25bc\n     \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510     \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n     \u2502  Linear (W_gate) + SiLU \u2502     \u2502     Linear (W_up)       \u2502\n     \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518     \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                  \u2502                               \u2502\n                  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                                  \u25bc\n                        Element-wise Multiply \u2299\n                                  \u2502\n                                  \u25bc\n                     \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n                     \u2502    Linear (W_down)      \u2502\n                     \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n</code></pre>\n<h4>Parameter Dimension Matching:</h4>\n<ul>\n<li>In standard FFN: <span class=\"katex-inline\">$W_1 \\in \\mathbb{R}^{d \\times 4d}, W_2 \\in \\mathbb{R}^{4d \\times d} \\implies 8 d^2 \\text{ parameters}$</span>.</li>\n<li>In SwiGLU: Three matrices (<span class=\"katex-inline\">$W_{\\text{gate}}, W_{\\text{up}} \\in \\mathbb{R}^{d \\times d_{ff}}, W_{\\text{down}} \\in \\mathbb{R}^{d_{ff} \\times d}$</span>).</li>\n<li>To maintain exact parameter equivalence with standard <span class=\"katex-inline\">$4d$</span> FFN:<br />\n  <div class=\"katex-display\">$$3 \\cdot d \\cdot d_{ff} = 8 d^2 \\implies d_{ff} = \\frac{8}{3} d \\approx 2.667 d$$</div></li>\n</ul>\n<p><em>Ex
