ot Cause</strong>: Unclipped gradients combined with FP16 underflow/overflow in the final layer.</li>\n</ol>\n<h3>2. Permanent Architectural Remediation:</h3>\n<ul>\n<li><strong>Immediate</strong>: Revert training to checkpoint at step 4,000. Switch training precision from FP16 to <strong>BF16</strong> (8-bit exponent matches FP32 dynamic range).</li>\n<li><strong>Long-Term</strong>: Implement strict data pipeline validation filtering out repetitive sequence anomalies, and enforce global gradient norm clipping (<code>clip_grad_norm_ = 1.0</code>).</li>\n</ul>\n<hr />\n<h2>Case Study 2: The Agent Infinite Tool-Calling Loop</h2>\n<ul>\n<li><strong>Symptom</strong>: Production alerts fire. An autonomous agent has been executing for 52 minutes on a single request, issuing 600 consecutive API calls and burning $1,200 in API tokens.</li>\n<li><strong>Trace Isolation</strong>: OpenTelemetry trace shows the agent called <code>get_calendar_events</code>, received an HTTP 401 Unauthorized error, apologized in its <code>&lt;think&gt;</code> scratchpad, and called <code>get_calendar_events</code> again 600 times.</li>\n<li><strong>Root Cause</strong>: The system relied on the non-deterministic LLM to decide when to stop retrying after an authorization failure, lacking a deterministic circuit breaker at the execution boundary.</li>\n<li><strong>Permanent Architectural Remediation</strong>:</li>\n<li>Implement a <strong>Deterministic Circuit Breaker</strong> at the tool gateway: cap identical consecutive tool errors to <span class=\"katex-inline\">$3$</span>.</li>\n<li>Upon 3 consecutive failures, inject a hard system interruption token into context and trigger a <strong>Compensation Transaction</strong> via the Durable Workflow Engine.</li>\n</ul>\n<hr />\n<h2>Case Study 3: The P99 TTFT Starvation Crisis</h2>\n<ul>\n<li><strong>Symptom</strong>: System-wide throughput (tokens/sec) is hitting targets, but P99 Time To First Token (TTFT) degrades to 18 seconds (users experience a frozen UI before generation begins).</li>\n<li><strong>Diagnosis</strong>: Telemetry shows average prompt length is 800 tokens, but P99 prompt length is 45,000 tokens (users uploading entire legal PDFs). In continuous batching, a 45k prefill monopolizes GPU Tensor Cores for several seconds, blocking the prefill queue of all concurrent requests.</li>\n<li><strong>Permanent Architectural Remediation</strong>:</li>\n<li>Implement <strong>Chunked Prefill</strong> (cap prefill execution chunks to 512 tokens per iteration, interleaving with decode steps).</li>\n<li>Deploy <strong>Disaggregated Prefill and Decode (PD Split)</strong> on dedicated nodes so prompt processing compute never starves decode workers.</li>\n</ul>\n<hr />\n<h2>Case Study 4: The 15% Offline Eval Gain vs. 5% Online Retention Drop</h2>\n<ul>\n<li><strong>Symptom</strong>: A newly aligned model scored <span class=\"katex-inline\">$15\\%$</span> higher on the offline LLM-as-a-Judge benchmark. After a 10% Canary deployment, user retention dropped by <span class=\"katex-inline\">$5\\%$</span>.</li>\n<li><strong>Diagnosis</strong>: </li>\n<li>The offline LLM judge suffered from <strong>Verbosity Bias</strong>: the new model generated <span class=\"katex-inline\">$3.2\\times$</span> longer answers. The judge rewarded the length, but real-world users found the responses bloated, slow, and unhelpful.</li>\n<li>Slower generations (<span class=\"katex-inline\">$3.2\\times$</span> tokens) increased user-perceived latency by <span class=\"katex-inline\">$250\\%$</span>.</li>\n<li><strong>Permanent Architectural Remediation</strong>:</li>\n<li>Re-align the model using <strong>Length-Penalized DPO</strong> (penalizing response length in the preference loss).</li>\n<li>Update the LLM-as-a-Judge benchmark to strictly penalize verbosity and evaluate pairwise rankings under length-normalized metrics.</li>\n</ul>\n<hr />\n<h2>Case Study 5: Mixture-of-Experts All-to-All Straggler Stalls</h2>\n<ul>\n<li><strong>Symptom</strong>: During 512-GPU pre-training of an MoE model, Model FLOPs Utilization (MFU) drops from 58% to 22%.</li>\n<li><strong>Diagnosis</strong>: <code>nsys</code> profiling reveals that GPUs are spending 45% of execution time blocked on <code>ncclAllToAll</code> collective barriers during expert token dispatch.</li>\n<li><strong>Root Cause</strong>: Gating network routing collapse \u2014 3 popular experts received <span class=\"katex-inline\">$80\\%$</span> of all tokens across the cluster, while other expert GPUs sat idle waiting for the overloaded GPUs to finish computation.</li>\n<li><strong>Permanent Architectural Remediation</strong>:</li>\n<li>Implement <strong>DeepSeek-V3 Auxiliary-Loss-Free Expert Biases</strong> (<span class=\"katex-inline\">$b_i \\leftarrow b_i + \\gamma(1/N - f_i)$</span>) to dynamically redirect token flow away from overloaded nodes.</li>\n<li>Enforce an <strong>Expert Capacity Factor (ECF = 1.2)</strong> to drop or route overflow tokens to default shared experts.</li>\n</ul>"}, {"id": "22_FINAL_SYNTHESIS_PLAYBOOKS", "file": "22_FINAL_SYNTHESIS_PLAYBOOKS.md", "title": "The 2-Hour Final Synthesis Playbooks & Formulas", "priority": "P0", "phase": "Phase 8: Synthesis & Interview Prep", "content": "# 22_FINAL_SYNTHESIS_PLAYBOOKS \u2014 The Ultimate 2-Hour Interview Sheet\n\n> **Audience**: ML Engineers, LLM Systems Engineers, and AI Researchers preparing for senior/principal technical interviews.  \n> **Core Objective**: The ultimate high-density formula sheet and operational playbooks for final revision before technical rounds.\n\n---\n\n## 1. The Core Mathematical Formula Sheet\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 1. Scaled Attention:      Attention(Q,K,V) = Softmax( QK^T / \u221ad_k + M ) V                   \u2502\n\u2502 2. Cross-Entropy Gradient: \u2202L / \u2202z_i = p_i - y_i                                            \u2502\n\u2502 3. AdamW Parameter Update: \u03b8_{t+1} = (1 - \u03b7\u03bb)\u03b8_t - (\u03b7 / (\u221av_hat_t + \u03b5)) m_hat_t            \u2502\n\u2502 4. LoRA Forward Pass:     h = W_0 x + (\u03b1 / r) B A x                                         \u2502\n\u2502 5. DPO Closed-Form Loss:  L_DPO = -E[ log \u03c3( \u03b2 log(\u03c0_\u03b8(y_w|x)/\u03c0_ref(y_w|x))               \u2502\n\u2502                                           - \u03b2 log(\u03c0_\u03b8(y_l|x)/\u03c0_ref(y_l|x)) ) ]              \u2502\n\u2502 6. GRPO Advantage:        A_i = (r_i - Mean({r})) / (Std({r}) + \u03b5)                          \u2502\n\u2502 7. KV Cache Footprint:    Memory_KV = 2 \u00b7 B \u00b7 S \u00b7 L \u00b7 N_kv \u00b7 d_h \u00b7 b_kv  [Bytes]            \u2502\n\u2502 8. Arithmetic Intensity:  AI = FLOPs / Memory_Bytes  [FLOPs/Byte]                            \u2502\n\u2502 9. Little's Law:          L = \u03bb W                                                           \u2502\n\u2502 10. Ring All-Reduce Comm: Data per Node = 2 ((N - 1) / N) M  [Bytes]                        \u2502\n\u2502 11. Workflow Reliability: P(Workflow) = [ 1 - (1 - p)^{R+1} ]^N                             \u2502\n\u2502 12. Population Drift PSI: PSI = \u2211 (Actual_i - Expected_i) \u00b7 ln(Actual_i / Expected_i)       \u2502\n\u2502 13. MFU Formula:          MFU = (Tokens_per_sec \u00b7 6P) / (N_gpus \u00b7 Peak_TFLOPs)              \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n---\n\n## 2. The 48-Hour Systems Optimization Playbook\n\nWhen asked how to optimize any failing or slow ML system:\n\n```\n[ Tier 1: The Data Lever (Highest ROI) ]\n- Decontaminate evaluation leakage (MinHash LSH).\n- Filter low-quality synthetic data; enforce format validation.\n        \u2502\n        \u25bc\n[ Tier 2: The Systems & Hardware Lever (Massive ROI) ]\n- FlashAttention-3 & FP8 GEMMs (SRAM tiling).\n- PagedAttention / RadixAttention prefix caching.\n- Continuous Batching with Chunked Prefill.\n- FSDP-2 / Megatron Tensor Parallelism.\n        \u2502\n        \u25bc\n[ Tier 3: The Architecture Lever (High ROI) ]\n- Multi-Head Latent Attention (MLA) for 5x KV cache reduction.\n- Speculative Decoding (EAGLE / Medusa).\n- GQA & DeepSeek MoE Auxiliary-Loss-Free load balancing.\n        \u2502\n        \u25bc\n[ Tier 4: The Algorithm & Custom Loss Lever (Highest Risk / Lowest ROI) ]\n- DPO vs GRPO vs SimPO.\n- Custom activation functions / architectures (Avoid unless doing pure research).\n```\n\n---\n\n## 3. The Cross-Stack Traversal Golden Rule\n\n> *\"A Senior / Principal ML Engineer must seamlessly trace a high-level product failure (e.g. 'The agent booked the wrong hotel') down through the Durable Workflow Engine, into the OpenTelemetry Trace, across the Inference Router, through the Paged KV Cache, into the Attention Matrix, back to the Post-Training Loss Formulation, down to corrupted data tokens in the synthetic pipeline.\"*\n\nIf you can demonstrate this end-to-end traversal from **Mathematics $\\longleftrightarrow$ GPU Bare Metal $\\longleftrightarrow$ Production Systems**, you will pass with distinction.\n", "html": "<h1>22_FINAL_SYNTHESIS_PLAYBOOKS \u2014 The Ultimate 2-Hour Interview Sheet</h1>\n<blockquote>\n<p><strong>Audience</strong>: ML Engineers, LLM Systems Engineers, and AI Researchers preparing for senior/principal technical interviews.<br />\n<strong>Core Objective</strong>: The ultimate high-density formula sheet and operational playbooks for final revision before technical rounds.</p>\n</blockquote>\n<hr />\n<h2>1. The Core Mathematical Formula Sheet</h2>\n<pre><code>\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 1. Scaled Attention:      Attention(Q,K,V) = Softmax( QK^T / \u221ad_k + M ) V                   \u2502\n\u2502 2. Cross-Entropy Gradient: \u2202L / \u2202z_i = p_i - y_i                                            \u2502\n\u2502 3. AdamW Parameter Update: \u03b8_{t+1} = (1 - \u03b7\u03bb)\u03b8_t - (\u03b7 / (\u221av_hat_t + \u03b5)) m_hat_t            \u2502\n\u2502 4. LoRA Forward Pass:     h = W_0 x + (\u03b1 / r) B A x                                         \u2502\n\u2502 5. DPO Closed-Form Loss:  L_DPO = -E[ log \u03c3( \u03b2 log(\u03c0_\u03b8(y_w|x)/\u03c0_ref(y_w|x))               \u2502\n\u2502                                           - \u03b2 log(\u03c0_\u03b8(y_l|x)/\u03c0_ref(y_l|x)) ) ]              \u2502\n\u2502 6. GRPO Advantage:        A_i = (r_i - Mean({r})) / (Std({r}) + \u03b5)                          \u2502\n\u2502 7. KV Cache Footprint:    Memory_KV = 2 \u00b7 B \u00b7 S \u00b7 L \u00b7 N_kv \u00b7 d_h \u00b7 b_kv  [Bytes]            \u2502\n\u2502 8. Arithmetic Intensity:  AI = FLOPs / Memory_Bytes  [FLOPs/Byte]                            \u2502\n\u2502 9. Little's Law:          L = \u03bb W                                                           \u2502\n\u2502 10. Ring All-Reduce Comm: Data per Node = 2 ((N - 1) / N) M  [Bytes]                        \u2502\n\u2502 11. Workflow Reliability: P(Workflow) = [ 1 - (1 - p)^{R+1} ]^N                             \u2502\n\u2502 12. Population Drift PSI: PSI = \u2211 (Actual_i - Expected_i) \u00b7 ln(Actual_i / Expected_i)       \u2502\n\u2502 13. MFU Formula:          MFU = (Tokens_per_sec \u00b7 6P) / (N_gpus \u00b7 Peak_TFLOPs)              \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n</code></pre>\n<hr />\n<h2>2. The 48-Hour Systems Optimization Playbook</h2>\n<p>When asked how to optimize any failing or slow ML system:</p>\n<pre><code>[ Tier 1: The Data Lever (Highest ROI) ]\n- Decontaminate evaluation leakage (MinHash LSH).\n- Filter low-quality synthetic data; enforce format validation.\n        \u2502\n        \u25bc\n[ Tier 2: The Systems &amp; Hardware Lever (Massive ROI) ]\n- FlashAttention-3 &amp; FP8 GEMMs (SRAM tiling).\n- PagedAttention / RadixAttention prefix caching.\n- Continuous Batching with Chunked Prefill.\n- FSDP-2 / Megatron Tensor Parallelism.\n        \u2502\n        \u25bc\n[ Tier 3: The Architecture Lever (High ROI) ]\n- Multi-Head Latent Attention (MLA) for 5x KV cache reduction.\n- Speculative Decoding (EAGLE / Medusa).\n- GQA &amp; DeepSeek MoE Auxiliary-Loss-Free load balancing.\n        \u2502\n        \u25bc\n[ Tier 4: The Algorithm &amp; Custom Loss Lever (Highest Risk / Lowest ROI) ]\n- DPO vs GRPO vs SimPO.\n- Custom activation functions / architectures (Avoid unless doing pure research).\n</code></pre>\n<hr />\n<h2>3. The Cross-Stack Traversal Golden Rule</h2>\n<blockquote>\n<p><em>\"A Senior / Principal ML Engineer must seamlessly trace a high-level product failure (e.g. 'The agent booked the wrong hotel') down through the Durable Workflow Engine, into the OpenTelemetry Trace, across the Inference Router, through the Paged KV Cache, into the Attention Matrix, back to the Post-Training Loss Formulation, down to corrupted data tokens in the synthetic pipeline.\"</em></p>\n</blockquote>\n<p>If you can demonstrate this end-to-end traversal from <strong>Mathematics <span class=\"katex-inline\">$\\longleftrightarrow$</span> GPU Bare Metal <span class=\"katex-inline\">$\\longleftrightarrow$</span> Production Systems</strong>, you will pass with distinction.</p>"}, {"id": "README", "file": "README.md", "title": "README & Master Curriculum", "priority": "P0", "phase": "Overview", "content": "# \ud83e\udde0 ML-Notes \u2014 Single Source of Knowledge (SSK)\n\n> **A comprehensive, mathematically intensive, and production-grade master reference for ML Engineers (LLM & Agentic Systems).**  \n> Bridging **Rigorous Mathematics $\\longleftrightarrow$ Algorithms $\\longleftrightarrow$ GPU Bare Metal $\\longleftrightarrow$ Production Distributed Systems**.\n\n\ud83c\udf10 **Live Web App (GitHub Pages)**: **[https://prajyotkore.github.io/ML-Engineer-Notes-LLM-and-Agentic-Systems/](https://prajyotkore.github.io/ML-Engineer-Notes-LLM-and-Agentic-Systems/)**  \n*Features instant search, KaTeX mathematical formula rendering, Prism.js code syntax highlighting, and interactive Mermaid architecture diagrams.*\n\n---\n\n## \ud83c\udfaf Purpose & Scope\n\nThis repository is an exhaustive, production-grade **Single Source of Knowledge (SSK)** built for engineers preparing for Senior, Staff, and Principal **ML Engineer (LLM & Agentic Systems)** technical interviews.\n\nThe core engineering standard this repo answers:\n\n> *\"Can this candidate take a frontier research concept, derive its mathematical formulations, map its operations to physical GPU memory hierarchies, scale its training and inference across distributed clusters, integrate it into a durable agentic system, and systematically debug latency, drift, and reliability failures in production?\"*\n\nEvery document follows the **10-Level Depth Framework**, progressing from first principles and step-by-step mathematical proofs through to bare-metal CUDA execution and production system design.\n\n---\n\n## \ud83d\udcd0 Complete Dependency Architecture\n\n```mermaid\nflowchart TD\n    %% Base Layer\n    Math[\"01: Mathematical Foundations (SVD, Info Theory, Optimization)\"] --> DL[\"02_03: Deep Learning (Backprop, RMSNorm, Loss Landscapes)\"]\n    DL --> LLM[\"04: Modern LLMs (Attention, RoPE, MLA, MoE)\"]\n    \n    %% Hardware & Performance Layer\n    GPU[\"08: GPU Architecture & FlashAttention-3\"] --> Inf[\"09: Inference Systems (PagedAttention, SGLang, PD Split)\"]\n    GPU --> TS[\"07: Training Systems (FSDP-2, 3D Parallelism)\"]\n    Net[\"18: Distributed Systems (Ring All-Reduce, RDMA)\"] --> TS\n    LLM --> Inf\n    LLM --> TS\n    \n    %% Training & Alignment Layer\n    Data[\"06: Data Engineering (MinHash LSH, Synthetic Flywheels)\"] --> PT[\"05: Post-Training (SFT, LoRA, DPO, GRPO)\"]\n    LLM --> PT\n    PT --> Eval[\"12: Evaluation (Z-Tests, ELO, SWE-bench)\"]\n    \n    %% Serving & Agent Layer\n    Inf --> Agent[\"10: Agentic Systems (ReAct, FSM JSON, MCP, Hybrid RAG)\"]\n    Agent --> Rel[\"11: Long-Running Workflows (Temporal, Sagas, Jitter)\"]\n    Rel --> Prod[\"13/14/15: Production MLOps, Tracing, Safety Guardrails\"]\n    \n    %% Synthesis Layer\n    Prod --> SysDes[\"16-22: System Design, Production Code & Playbooks\"]\n```\n\n---\n\n## \ud83d\udcca Priority Matrix\n\n| Priority | Category | Topics | Files |\n|:---:|:---|:---|:---|\n| **P0** | **Agentic ML Systems** | ReAct, Tool Routing, Context/Memory, MCP, FSM JSON | [10_AGENTIC_ML_SYSTEMS.md](./10_AGENTIC_ML_SYSTEMS.md) |\n| **P0** | **Long-Running Workflows** | Durable State, Temporal, Sagas, Idempotency, Retries | [11_LONG_RUNNING_WORKFLOW_RELIABILITY.md](./11_LONG_RUNNING_WORKFLOW_RELIABILITY.md) |\n| **P0** | **Post-Training & Reasoning** | SFT, LoRA, QLoRA, DPO, GRPO, Test-Time Compute | [05_POST_TRAINING.md](./05_POST_TRAINING.md) |\n| **P0** | **LLM & Inference** | PagedAttention, RadixAttention, PD Split, Chunked Prefill | [04_TRANSFORMERS_AND_LLMS.md](./04_TRANSFORMERS_AND_LLMS.md) \u00b7 [09_INFERENCE_SYSTEMS.md](./09_INFERENCE_SYSTEMS.md) |\n| **P0** | **GPU Architecture** | SMs, SRAM Tiling, FlashAttention-3, Roofline Model | [08_GPU_AND_PERFORMANCE.md](./08_GPU_AND_PERFORMANCE.md) |\n| **P0** | **Evaluation & Reliability** | Z-Tests, ELO Ratings, SWE-bench, LLM-as-judge | [12_EVALUATION.md](./12_EVALUATION.md) |\n| **P1** | **Mathematical Foundations** | SVD, Low-Rank, Information Theory, AdamW, Optimization | [01_MATHEMATICAL_FOUNDATIONS.md](./01_MATHEMATICAL_FOUNDATIONS.md) |\n| **P1** | **Training Systems** | FSDP-2, 3D Parallelism, Context Parallelism, Checkpointing | [07_TRAINING_SYSTEMS.md](./07_TRAINING_SYSTEMS.md) |\n| **P1** | **Data Engineering** | MinHash LSH, Model Collapse, Synthetic Curation | [06_DATA_AND_SYNTHETIC_DATA.md](./06_DATA_AND_SYNTHETIC_DATA.md) |\n| **P1** | **Distributed Systems** | Ring All-Reduce, GPUDirect RDMA, InfiniBand NDR | [18_DISTRIBUTED_SYSTEMS.md](./18_DISTRIBUTED_SYSTEMS.md) |\n| **P1** | **Observability** | Little's Law, MFU, OpenTelemetry Tracing | [14_OBSERVABILITY_AND_DEBUGGING.md] ith Full Jitter, Idempotency-Key gateways, Distributed Saga compensation</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><a href=\"./15_SAFETY_AND_ROBUSTNESS.md\">15_SAFETY_AND_ROBUSTNESS.md</a></td>\n<td style=\"text-align: left;\">Alignment Tax ROC curves, Direct &amp; Indirect Prompt Injection vectors, Firecracker microVM sandboxing, Least-privilege IAM</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h3>Phase 7 \u2014 Production Evaluation, Observability &amp; MLOps</h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">File</th>\n<th style=\"text-align: left;\">Description</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><a href=\"./12_EVALUATION.md\">12_EVALUATION.md</a></td>\n<td style=\"text-align: left;\">Two-Proportion Z-Tests, Sample sizing for MDE, Bradley-Terry ELO ratings (Chatbot Arena), LLM-as-a-Judge debiasing</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><a href=\"./13_PRODUCTION_ML.md\">13_PRODUCTION_ML.md</a></td>\n<td style=\"text-align: left;\">Population Stability Index (PSI) drift calculus, Canary/Shadow/Blue-Green deployments, Session pinning during rolling updates</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><a href=\"./14_OBSERVABILITY_AND_DEBUGGING.md\">14_OBSERVABILITY_AND_DEBUGGING.md</a></td>\n<td style=\"text-align: left;\">Little's Law (<span class=\"katex-inline\">$L=\\lambda W$</span>), <span class=\"katex-inline\">$M/M/k$</span> queue utilization walls, MFU calculations, OpenTelemetry distributed tracing schemas</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h3>Phase 8 \u2014 System Design, Production Code &amp; Interview Synthesis</h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">File</th>\n<th style=\"text-align: left;\">Description</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><a href=\"./16_SYSTEM_DESIGN.md\">16_SYSTEM_DESIGN.md</a></td>\n<td style=\"text-align: left;\">End-to-end whiteboard architecture blueprints with full back-of-the-envelope calculations (100k QPS Serving, Durable Agent Runtimes, RAG)</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><a href=\"./17_PYTHON_AND_CODING.md\">17_PYTHON_AND_CODING.md</a></td>\n<td style=\"text-align: left;\">Production-grade runnable PyTorch modules: Multi-Head Latent Attention (MLA), RoPE/YaRN, FSM JSON Logit Processor, Continuous Batcher</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><a href=\"./19_LEADERSHIP_AND_TECHNICAL_JUDGMENT.md\">19_LEADERSHIP_AND_TECHNICAL_JUDGMENT.md</a></td>\n<td style=\"text-align: left;\">Staff/Principal engineering trade-off matrices, incident leadership protocols, and architectural arbitration</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><a href=\"./20_INTERVIEW_QUESTION_BANK.md\">20_INTERVIEW_QUESTION_BANK.md</a></td>\n<td style=\"text-align: left;\">50+ graded questions from Level 1 (Concepts) to Level 10 (Principal Engineering) across all domains</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><a href=\"./21_CASE_STUDIES.md\">21_CASE_STUDIES.md</a></td>\n<td style=\"text-align: left;\">5 detailed real-world production incident Root Cause Analyses (Loss Spikes, Agent Loops, TTFT Starvation, MoE Stragglers)</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><a href=\"./22_FINAL_SYNTHESIS_PLAYBOOKS.md\">22_FINAL_SYNTHESIS_PLAYBOOKS.md</a></td>\n<td style=\"text-align: left;\">The Ultimate 2-Hour Formula Sheet, 48-Hour Systems Optimization Playbook, and Cross-Stack Traversal Golden Rule</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>\ud83e\udded Study Guide: Recommended Sequence</h2>\n<p><strong>Week 1 \u2014 Mathematical Foundations &amp; P0 Core Models</strong><br />\n1. <code>00_ROLE_ANALYSIS.md</code> \u2014 understand the competency map<br />\n2. <code>01_MATHEMATICAL_FOUNDATIONS.md</code> + <code>02_03_ML_AND_DL_FOUNDATIONS.md</code> \u2014 master linear algebra, calculus, AdamW, and backpropagation<br />\n3. <code>04_TRANSFORMERS_AND_LLMS.md</code> + <code>08_GPU_AND_PERFORMANCE.md</code> \u2014 master Attention, RoPE, MLA, and FlashAttention-3 SRAM tiling<br />\n4. <code>09_INFERENCE_SYSTEMS.md</code> \u2014 master PagedAttention, RadixAttention, Disaggregated PD split, and Speculative Decoding</p>\n<p><strong>Week 2 \u2014 Post-Training, Agentic Systems &amp; Distributed Infrastructure</strong><br />\n5. <code>05_POST_TRAINING.md</code> + <code>06_DATA_AND_SYNTHETIC_DATA.md</code> \u2014 master DPO derivation, GRPO reasoning models, and MinHash deduplication<br />\n6. <code>10_AGENTIC_ML_SYSTEMS.md</code> + <code>11_LONG_RUNNING_WORKFLOW_RELIABILITY.md</code> + <code>15_SAFETY_AND_ROBUSTNESS.md</code> \u2014 master FSM JSON decoding, Temporal durable workflows, and Firecracker sandboxes<br />\n7. <code>07_TRAINING_SYSTEMS.md</code> + <code>18_DISTRIBUTED_SYSTEMS.md</code> \u2014 master ZeRO-1/2/3, 3D Parallelism, and Ring All-Reduce</p>\n<p><strong>Week 3 \u2014 Production MLOps, System Design &amp; Interview Execution</strong><br />\n8. <code>12_EVALUATION.md</code> + <code>13_PRODUCTION_ML.md</code> + <code>14_OBSERVABILITY_AND_DEBUGGING.md</code> \u2014 master Z-tests, ELO, PSI drift, and Little's Law queueing<br />\n9. <code>16_SYSTEM_DESIGN.md</code> + <code>17_PYTHON_AND_CODING.md</code> \u2014 master whiteboard dimensioning and PyTorch coding<br />\n10. <code>19_LEADERSHIP_AND_TECHNICAL_JUDGMENT.md</code> + <code>20_INTERVIEW_QUESTION_BANK.md</code> + <code>21_CASE_STUDIES.md</code><br />\n11. <code>22_FINAL_SYNTHESIS_PLAYBOOKS.md</code> \u2014 final 2-hour formula review</p>\n<hr />\n<h2>\ud83c\udff7\ufe0f Key Technical Themes</h2>\n<p><code>Multi-Head Latent Attention (MLA)</code> \u00b7 <code>GRPO (DeepSeek-R1)</code> \u00b7 <code>Direct Preference Optimization (DPO)</code> \u00b7 <code>FlashAttention-3</code> \u00b7 <code>SRAM Tiling</code> \u00b7 <code>PagedAttention</code> \u00b7 <code>RadixAttention (SGLang)</code> \u00b7 <code>Disaggregated Prefill-Decode (PD Split)</code> \u00b7 <code>Chunked Prefill</code> \u00b7 <code>Speculative Decoding</code> \u00b7 <code>FSM Grammar Constrained Decoding</code> \u00b7 <code>Model Context Protocol (MCP)</code> \u00b7 <code>Durable Workflows (Temporal)</code> \u00b7 <code>Distributed Sagas</code> \u00b7 <code>ZeRO-3 (FSDP-2)</code> \u00b7 <code>Ring All-Reduce</code> \u00b7 <code>GPUDirect RDMA</code> \u00b7 <code>Little's Law</code> \u00b7 <code>Model FLOPs Utilization (MFU)</code> \u00b7 <code>Population Stability Index (PSI)</code> \u00b7 <code>SWE-bench</code></p>"}];

    let currentDocIndex = 0;

    // Check URL Hash on Load
    function getDocIndexFromHash() {
      const hash = window.location.hash.replace('#', '');
      if (!hash) return 0;
      const foundIdx = DOCS.findIndex(d => d.id === hash || d.file.replace('.md', '') === hash);
      return foundIdx !== -1 ? foundIdx : 0;
    }

    // Initialize Navigation List
    function initNav() {
      const navList = document.getElementById('navList');
      navList.innerHTML = '';

      let currentPhase = '';

      DOCS.forEach((doc, idx) => {
        if (doc.phase !== currentPhase) {
          currentPhase = doc.phase;
          const phaseHeader = document.createElement('li');
          phaseHeader.className = 'nav-phase-header';
          phaseHeader.textContent = currentPhase;
          navList.appendChild(phaseHeader);
        }

        const li = document.createElement('li');
        const a = document.createElement('a');
        a.className = `nav-item ${idx === currentDocIndex ? 'active' : ''}`;
        a.href = `#${doc.id}`;
        a.onclick = (e) => {
          e.preventDefault();
          window.location.hash = doc.id;
          loadDoc(idx);
        };

        const titleSpan = document.createElement('span');
        titleSpan.textContent = doc.file.replace('.md', '');

        const badge = document.createElement('span');
        badge.className = `priority-badge priority-${doc.priority.toLowerCase()}`;
        badge.textContent = doc.priority;

        a.appendChild(titleSpan);
        a.appendChild(badge);
        li.appendChild(a);
        navList.appendChild(li);
      });
    }

    // Search filter
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const items = document.querySelectorAll('.nav-item');
      items.forEach((item, idx) => {
        const doc = DOCS[idx];
        const match = doc.title.toLowerCase().includes(query) || 
                      doc.file.toLowerCase().includes(query) || 
                      doc.content.toLowerCase().includes(query);
        item.style.display = match ? 'flex' : 'none';
      });
    });

    function generateTOC() {
      const tocList = document.getElementById('tocList');
      tocList.innerHTML = '';
      const headers = document.querySelectorAll('#docContent h2, #docContent h3');
      
      headers.forEach((h, i) => {
        const id = `heading-${i}`;
        h.id = id;

        const li = document.createElement('li');
        li.className = 'toc-item';
        if (h.tagName === 'H3') li.style.paddingLeft = '18px';

        const a = document.createElement('a');
        a.className = 'toc-link';
        a.href = `#${id}`;
        a.textContent = h.textContent.replace(/^[0-9.]+\s*/, '');
        a.onclick = (e) => {
          e.preventDefault();
          h.scrollIntoView({ behavior: 'smooth' });
        };
        li.appendChild(a);
        tocList.appendChild(li);
      });
    }

    function loadDoc(idx) {
      currentDocIndex = idx;
      initNav();

      const doc = DOCS[idx];
      document.getElementById('breadcrumbPhase').textContent = doc.phase;
      document.getElementById('breadcrumbDoc').textContent = doc.file.replace('.md', '');

      const contentDiv = document.getElementById('docContent');
      // Direct insertion of pre-compiled HTML (fast & 100% reliable)
      contentDiv.innerHTML = doc.html;

      // Add Next / Previous navigation footer
      const prevDoc = idx > 0 ? DOCS[idx - 1] : null;
      const nextDoc = idx < DOCS.length - 1 ? DOCS[idx + 1] : null;
      
      let navFooterHtml = '<div class="doc-nav-footer">';
      if (prevDoc) {
        navFooterHtml += `<div class="doc-nav-btn" onclick="window.location.hash='${prevDoc.id}'; loadDoc(${idx - 1})"><span class="label">← Previous</span><span class="title">${prevDoc.file.replace('.md', '')}</span></div>`;
      } else {
        navFooterHtml += '<div></div>';
      }
      if (nextDoc) {
        navFooterHtml += `<div class="doc-nav-btn" onclick="window.location.hash='${nextDoc.id}'; loadDoc(${idx + 1})" style="text-align: right;"><span class="label">Next →</span><span class="title">${nextDoc.file.replace('.md', '')}</span></div>`;
      }
      navFooterHtml += '</div>';
      contentDiv.insertAdjacentHTML('beforeend', navFooterHtml);

      // Render KaTeX Math safely
      try {
        if (typeof renderMathInElement !== 'undefined') {
          renderMathInElement(contentDiv, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false }
            ],
            throwOnError: false
          });
        }
      } catch (err) {
        console.warn('KaTeX render error:', err);
      }

      // Syntax Highlight safely
      try {
        if (typeof Prism !== 'undefined') {
          Prism.highlightAllUnder(contentDiv);
        }
      } catch (err) {
        console.warn('Prism highlight error:', err);
      }

      // Render Mermaid safely
      try {
        if (typeof mermaid !== 'undefined') {
          mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose' });
          mermaid.run({ nodes: contentDiv.querySelectorAll('.mermaid') });
        }
      } catch (err) {
        console.warn('Mermaid render error:', err);
      }

      // Generate TOC
      generateTOC();

      // Scroll top
      document.querySelector('.main-viewport').scrollTop = 0;
    }

    // Hash change handler
    window.addEventListener('hashchange', () => {
      const idx = getDocIndexFromHash();
      if (idx !== currentDocIndex) {
        loadDoc(idx);
      }
    });

    // Initialize
    window.addEventListener('DOMContentLoaded', () => {
      const initialIdx = getDocIndexFromHash();
      loadDoc(initialIdx);
    });
  </script>
