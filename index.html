ample</em>: In LLaMA-3 8B (<span class=\"katex-inline\">$d_{\\text{model}} = 4096$</span>), <span class=\"katex-inline\">$d_{ff} = 14336 = 3.5 d_{\\text{model}}$</span> (rounded to nearest multiple of 256 for GPU alignment).</p>\n<hr />\n<h2>5. Mixture of Experts (MoE) &amp; DeepSeek-V3 Load Balancing</h2>\n<h3>5.1 MoE Routing Formulation</h3>\n<p>An MoE layer replaces the standard dense FFN with <span class=\"katex-inline\">$N$</span> independent expert networks <span class=\"katex-inline\">$\\{E_1, E_2, \\dots, E_N\\}$</span>, routing each token to the Top-<span class=\"katex-inline\">$K$</span> experts via a gating network <span class=\"katex-inline\">$G(x)$</span>:</p>\n<div class=\"katex-display\">$$y = \\sum_{i \\in \\text{Top}K} g_i(x) E_i(x)$$</div>\n\n<ul>\n<li><strong>Standard Top-<span class=\"katex-inline\">$K$</span> Softmax Gating</strong>:<br />\n  <div class=\"katex-display\">$$H(x) = x W_g \\in \\mathbb{R}^N$$</div></li>\n</ul>\n<div class=\"katex-display\">$$\\text{Top}K(H(x)) = \\text{Indices of } K \\text{ largest values in } H(x)$$</div>\n<div class=\"katex-display\">$$g_i(x) = \\begin{cases} \\frac{\\exp(H(x)_i)}{\\sum_{j \\in \\text{Top}K} \\exp(H(x)_j)} &amp; \\text{if } i \\in \\text{Top}K(H(x)) \\\\ 0 &amp; \\text{otherwise} \\end{cases}$$</div>\n\n<hr />\n<h3>5.2 The Routing Collapse Problem &amp; Auxiliary Losses</h3>\n<p>Without constraints, the gating network quickly suffers from <strong>Expert Routing Collapse</strong> \u2014 routing all tokens to 2 or 3 favorite experts while the remaining <span class=\"katex-inline\">$N-K$</span> experts starve and receive zero gradient updates.</p>\n<h4>Classical Solution: Auxiliary Load Balancing Loss (Switch Transformer / Mixtral):</h4>\n<div class=\"katex-display\">$$\\mathcal{L}_{\\text{aux}} = \\alpha \\cdot N \\sum_{i=1}^N f_i P_i$$</div>\n<p>Where:<br />\n- <span class=\"katex-inline\">$f_i = \\frac{1}{T} \\sum_{t=1}^T \\mathbb{I}(\\text{token } t \\text{ routed to expert } i)$</span> (fraction of tokens dispatched)<br />\n- <span class=\"katex-inline\">$P_i = \\frac{1}{T} \\sum_{t=1}^T g_i(x_t)$</span> (average routing probability)<br />\n- <span class=\"katex-inline\">$\\alpha \\approx 0.01$</span> (hyperparameter).</p>\n<p><em>The Problem</em>: <span class=\"katex-inline\">$\\mathcal{L}_{\\text{aux}}$</span> acts as a regularizer that penalizes routing specialization, degrading the overall model capability.</p>\n<hr />\n<h3>5.3 DeepSeek-V3 Auxiliary-Loss-Free Load Balancing</h3>\n<p>DeepSeek-V3 introduces <strong>bias-driven load balancing</strong> without adding an auxiliary loss term to the objective:</p>\n<div class=\"katex-display\">$$\\text{Gating Score: } s_{i, t} = \\text{Softmax}(x_t W_g)_i + b_i$$</div>\n<p>Where <span class=\"katex-inline\">$b_i \\in \\mathbb{R}$</span> is a dynamic expert bias updated online during training:</p>\n<div class=\"katex-display\">$$b_i \\leftarrow b_i + \\gamma \\cdot \\left( \\frac{1}{N} - \\frac{\\text{Tokens Dispatched to Expert } i}{\\text{Total Tokens in Batch}} \\right)$$</div>\n\n<ul>\n<li>If Expert <span class=\"katex-inline\">$i$</span> is overloaded (<span class=\"katex-inline\">$f_i &gt; \\frac{1}{N}$</span>), <span class=\"katex-inline\">$b_i$</span> is decreased, shifting future tokens away.</li>\n<li>If Expert <span class=\"katex-inline\">$i$</span> is starved (<span class=\"katex-inline\">$f_i &lt; \\frac{1}{N}$</span>), <span class=\"katex-inline\">$b_i$</span> is increased, naturally pulling tokens in.</li>\n<li><strong>Advantage</strong>: Gradients directly optimize primary language modeling loss with zero interference from artificial auxiliary balance penalties.</li>\n</ul>\n<hr />\n<h2>6. PyTorch Implementation: Multi-Head Latent Attention (MLA)</h2>\n<pre><code class=\"language-python\">import torch\nimport torch.nn as nn\nimport torch.nn.functional as F\nimport math\n\nclass MultiHeadLatentAttention(nn.Module):\n    &quot;&quot;&quot;\n    Multi-Head Latent Attention (MLA) as introduced in DeepSeek-V2 / DeepSeek-V3.\n    Features:\n    - Low-rank KV compression into latent vector c_t^{KV}\n    - Decoupled Rotary Positional Embeddings (RoPE)\n    - Low-rank Query compression\n    &quot;&quot;&quot;\n    def __init__(\n        self,\n        d_model: int = 2048,\n        num_heads: int = 16,\n        d_head: int = 128,\n        d_c_kv: int = 512,    # KV compression dimension\n        d_c_q: int = 512,     # Query compression dimension\n        d_rope: int = 64      # Decoupled RoPE dimension\n    ):\n        super().__init__()\n        self.d_model = d_model\n        self.num_heads = num_heads\n        self.d_head = d_head\n        self.d_c_kv = d_c_kv\n        self.d_c_q = d_c_q\n        self.d_rope = d_rope\n        self.scale = 1.0 / math.sqrt(d_head + d_rope)\n\n        # 1. Query Compression &amp; Projections\n        self.w_dq = nn.Linear(d_model, d_c_q, bias=False)\n        self.w_uq = nn.Linear(d_c_q, num_heads * d_head, bias=False)\n        self.w_qr = nn.Linear(d_c_q, num_heads * d_rope, bias=False)\n\n        # 2. Key-Value Compression &amp; Projections\n        self.w_dkv = nn.Linear(d_model, d_c_kv, bias=False)\n        self.w_uk = nn.Linear(d_c_kv, num_heads * d_head, bias=False)\n        self.w_uv = nn.Linear(d_c_kv, num_heads * d_head, bias=False)\n        self.w_kr = nn.Linear(d_model, d_rope, bias=False) # Shared RoPE key\n\n        # 3. Output Projection\n        self.w_out = nn.Linear(num_heads * d_head, d_model, bias=False)\n\n    def apply_rope(self, x: torch.Tensor, pos: torch.Tensor) -&gt; torch.Tensor:\n        # Simple 2D rotary embedding for illustration\n        B, S, H, D = x.shape\n        half_d = D // 2\n        freqs = torch.exp(\n            -math.log(10000.0) * torch.arange(0, half_d, dtype=torch.float32, device=x.device) / half_d\n        )\n        angles = pos.unsqueeze(-1) * freqs.unsqueeze(0) # [S, half_d]\n        cos = torch.cos(angles).unsqueeze(0).unsqueeze(2) # [1, S, 1, half_d]\n        sin = torch.sin(angles).unsqueeze(0).unsqueeze(2) # [1, S, 1, half_d]\n\n        x1, x2 = x[..., :half_d], x[..., half_d:]\n        rotated = torch.cat([x1 * cos - x2 * sin, x1 * sin + x2 * cos], dim=-1)\n        return rotated\n\n    def forward(self, x: torch.Tensor, kv_cache_latent=None, kv_cache_rope=None):\n        B, S, _ = x.shape\n        pos = torch.arange(S, device=x.device)\n\n        # --- Query Processing ---\n        c_q = self.w_dq(x) # [B, S, d_c_q]\n        q_c = self.w_uq(c_q).view(B, S, self.num_heads, self.d_head)\n        q_r = self.w_qr(c_q).view(B, S, self.num_heads, self.d_rope)\n        q_r = self.apply_rope(q_r, pos)\n        q = torch.cat([q_c, q_r], dim=-1) # [B, S, H, d_head + d_rope]\n\n        # --- KV Compression &amp; Latent Generation ---\n        c_kv = self.w_dkv(x) # [B, S, d_c_kv] (This is what gets stored in the KV cache!)\n        k_r = self.w_kr(x).unsqueeze(2) # [B, S, 1, d_rope]\n        k_r = self.apply_rope(k_r, pos).expand(B, S, self.num_heads, self.d_rope)\n\n        # Uncompress K and V on-the-fly\n        k_c = self.w_uk(c_kv).view(B, S, self.num_heads, self.d_head)\n        v = self.w_uv(c_kv).view(B, S, self.num_heads, self.d_head)\n        k = torch.cat([k_c, k_r], dim=-1) # [B, S, H, d_head + d_rope]\n\n        # --- Attention Computation ---\n        # Permute for batch matrix multiply: [B, H, S_q, S_k]\n        q = q.transpose(1, 2)\n        k = k.transpose(1, 2)\n        v = v.transpose(1, 2)\n\n        scores = torch.matmul(q, k.transpose(-2, -1)) * self.scale\n\n        # Apply Causal Mask\n        mask = torch.triu(torch.full((S, S), float('-inf'), device=x.device), diagonal=1)\n        scores = scores + mask.unsqueeze(0).unsqueeze(1)\n\n        attn_weights = F.softmax(scores, dim=-1)\n        out = torch.matmul(attn_weights, v) # [B, H, S, d_head]\n\n        # Concatenate heads and project output\n        out = out.transpose(1, 2).contiguous().view(B, S, self.num_heads * self.d_head)\n        return self.w_out(out), c_kv, k_r\n\nif __name__ == &quot;__main__&quot;:\n    B, S, D = 2, 64, 2048\n    x = torch.randn(B, S, D)\n    mla = MultiHeadLatentAttention(d_model=D, num_heads=16, d_head=128, d_c_kv=512, d_rope=64)\n    out, latent_kv, rope_k = mla(x)\n    assert out.shape == (B, S, D), &quot;MLA output shape mismatch!&quot;\n    assert latent_kv.shape == (B, S, 512), &quot;Latent KV shape mismatch!&quot;\n    print(&quot;Multi-Head Latent Attention (MLA) test passed successfully.&quot;)\n</code></pre>\n<hr />\n<h2>7. Deep Interview Interrogation Ladder</h2>\n<ul>\n<li><strong>Level 1 (Concept)</strong>: What is the primary operational difference between MHA, GQA, and MLA?</li>\n<li><strong>Level 3 (Proof)</strong>: Prove mathematically why the variance of Query-Key dot products equals <span class=\"katex-inline\">$d_k$</span>, and why Softmax temperature scaling <span class=\"katex-inline\">$\\frac{1}{\\sqrt{d_k}}$</span> prevents vanishing gradients.</li>\n<li><strong>Level 5 (Mechanics)</strong>: Why does Rotary Position Embedding (RoPE) preserve translation invariance in the inner product? (Show the complex exponential proof).</li>\n<li><strong>Level 7 (Architectural Sizing)</strong>: Calculate the exact KV cache memory reduction when switching a 70B parameter model from GQA (<span class=\"katex-inline\">$N_{kv}=8$</span>) to MLA (<span class=\"katex-inline\">$d_c=512, d_R=64$</span>).</li>\n<li><strong>Level 9 (MoE Dynamics)</strong>: Explain why standard auxiliary load balancing losses degrade model capability in MoE training, and how DeepSeek-V3's dynamic expert bias term solves this without auxiliary losses.</li>\n<li><strong>Level 10 (Principal Engineering)</strong>: Walk through how you would optimize the kernel execution of Multi-Head Latent Attention (MLA) during decode. How does matrix associativity allow absorbing the up-projection matrix <span class=\"katex-inline\">$W^{UK}$</span> into the Query vector before attending to the cached latent <span class=\"katex-inline\">$c_t^{KV}$</span>?</li>\n</ul>"}, {"id": "05_POST_TRAINING", "file": "05_POST_TRAINING.md", "title": "Post-Training & Alignment (LoRA, DPO, GRPO)", "priority": "P0", "phase": "Phase 3: Alignment & Reasoning", "content": "# 05_POST_TRAINING \u2014 Mathematical & Mechanistic Reference\n\n> **Audience**: ML Engineers, LLM Systems Engineers, and AI Researchers preparing for senior/principal technical interviews.  \n> **Core Objective**: Provide an exhaustive mathematical and algorithmic breakdown of Post-Training \u2014 spanning SFT, LoRA/QLoRA, the step-by-step derivation of Direct Preference Optimization (DPO), and Group Relative Policy Optimization (GRPO) for reasoning models (DeepSeek-R1 style).\n\n---\n\n## 1. Supervised Fine-Tuning (SFT) Mathematics\n\nGiven a dataset of instruction-response pairs $\\mathcal{D}_{\\text{SFT}} = \\{(x^{(i)}, y^{(i)})\\}_{i=1}^N$, where $x$ is the prompt tokens $(x_1, \\dots, x_{S_p})$ and $y$ is the response tokens $(y_1, \\dots, y_{S_r})$.\n\n### 1.1 The Masked Cross-Entropy Objective\nWe only compute gradients over the **response tokens** $y$, masking out the prompt tokens $x$ from the loss calculation:\n\n$$ \\mathcal{L}_{\\text{SFT}}(\\theta) = -\\frac{1}{N} \\sum_{i=1}^N \\sum_{t=1}^{S_r^{(i)}} \\log P_\\theta\\left(y_t^{(i)} \\mid x^{(i)}, y_{<t}^{(i)}\\right) $$\n\n```\nPrompt Tokens (x_1, x_2, x_3)           Response Tokens (y_1, y_2, y_3, <EOS>)\n[ Loss Mask = 0, Gradient = 0 ]        [ Loss Mask = 1, Gradient = (p_t - target) ]\n```\n\n*Why Masking Prompt Tokens is Mandatory*: If prompt tokens are included in the loss, the model allocates substantial capacity to predicting user syntax, grammar, and prompt templates rather than mastering instruction-following and tool formatting.\n\n---\n\n## 2. Parameter-Efficient Fine-Tuning: LoRA, QLoRA, and DoRA\n\n### 2.1 Low-Rank Adaptation (LoRA)\n\nLet $W_0 \\in \\mathbb{R}^{d_{\\text{out}} \\times d_{\\text{in}}}$ be a frozen pre-trained weight matrix.  \nLoRA decomposes the weight update $\\Delta W$ into the product of two low-rank matrices:\n\n$$ W = W_0 + \\Delta W = W_0 + \\frac{\\alpha}{r} B A $$\n\nWhere:\n- $A \\in \\mathbb{R}^{r \\times d_{\\text{in}}}$ is initialized from Gaussian distribution $\\mathcal{N}\\left(0, \\sigma^2 = \\frac{1}{r}\\right)$.\n- $B \\in \\mathbb{R}^{d_{\\text{out}} \\times r}$ is initialized to strictly **zero**: $B = 0$.\n- $r \\ll \\min(d_{\\text{in}}, d_{\\text{out}})$ is the intrinsic rank (typically $r \\in [8, 64]$).\n- $\\alpha$ is a constant scaling hyperparameter (typically $\\alpha = 2r \\implies \\text{scaling} = 2$).\n\n```\n                Input Vector x (dim d_in)\n                    \u2502\n            \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n            \u25bc               \u25bc\n     Frozen W_0        Matrix A (dim r x d_in)\n     (d_out x d_in)         \u2502\n            \u2502          Matrix B (dim d_out x r) [Init = 0]\n            \u2502               \u2502\n            \u2502          Scale (\u03b1 / r)\n            \u2502               \u2502\n            \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                    \u25bc\n           Output h = W_0 x + (\u03b1/r) B A x\n```\n\n#### Why $B = 0$ Initialization is Mandatory:\nAt step $t=0$:\n$$ \\Delta W = \\frac{\\alpha}{r} (0) A = 0 \\implies W = W_0 $$\nThis guarantees that training begins exactly from the pre-trained model's output without introducing catastrophic initial perturbation.\n\n#### Gradient Derivations for LoRA Parameters:\nLet the incoming gradient from the downstream loss be $G = \\frac{\\partial \\mathcal{L}}{\\partial h} \\in \\mathbb{R}^{B \\times d_{\\text{out}}}$, and input activation be $X \\in \\mathbb{R}^{B \\times d_{\\text{in}}}$.  \nThe forward pass is $h = X W_0^T + \\frac{\\alpha}{r} X A^T B^T$.\n\n$$ \\frac{\\partial \\mathcal{L}}{\\partial B} = \\frac{\\alpha}{r} G^T (X A^T) \\in \\mathbb{R}^{d_{\\text{out}} \\times r} $$\n$$ \\frac{\\partial \\mathcal{L}}{\\partial A} = \\frac{\\alpha}{r} (G B)^T X \\in \\mathbb{R}^{r \\times d_{\\text{in}}} $$\n$$ \\frac{\\partial \\mathcal{L}}{\\partial X} = G W_0 + \\frac{\\alpha}{r} G B A \\in \\mathbb{R}^{B \\times d_{\\text{in}}} $$\n\n*Zero Inference Overhead*: Before deployment, compute $W_{\\text{merged}} = W_0 + \\frac{\\alpha}{r} B A$. Inference latency is identical to the base model.\n\n---\n\n### 2.2 QLoRA: NormalFloat4 (NF4) & Double Quantization (Dettmers et al., 2023)\n\nQLoRA enables fine-tuning a 70B parameter model on a single 80GB GPU by quantizing base weights $W_0$ to 4-bit NormalFloat while training 16-bit LoRA adapters.\n\n1. **NormalFloat4 (NF4) Quantile Construction**:\n   Weights of pre-trained models follow a normal distribution $W_0 \\sim \\mathcal{N}(0, \\sigma^2)$.  \n   NF4 constructs 16 discrete quantization bins $q_i \\in [-1, 1]$ ($i \\in \\{0, \\dots, 15\\}$) such that each bin contains an **equal probability mass**:\n   $$ q_i = \\frac{1}{2} \\left( Q_X\\left(\\frac{i}{2^k}\\right) + Q_X\\left(\\frac{i+1}{2^k}\\right) \\right) $$\n   where $Q_X(\\cdot)$ is the quantile function (inverse CDF) of the standard normal distribution $\\mathcal{N}(0, 1)$.\n\n2. **Double Quantization (DQ)**:\n   Quantization divides weights into blocks of size 64 with a 32-bit FP32 quantization scale $c_1$.  \n   $c_1$ adds $\\frac{32}{64} = 0.5 \\text{ bits/param}$ of overhead.  \n   Double Quantization quantizes the scales $c_1$ themselves into 8-bit integers with a second block size of 256 ($c_2$ in FP32):\n   $$ \\text{Scale Memory Overhead} = \\frac{8}{64} + \\frac{32}{64 \\times 256} = 0.125 + 0.00195 = \\mathbf{0.127 \\text{ bits/parameter}} $$\n   Saves $\\sim 0.373$ bits per parameter ($\\sim 3.2\\text{ GB}$ on a 70B model).\n\n---\n\n## 3. Preference Alignment: Direct Preference Optimization (DPO)\n\n### 3.1 The Bradley-Terry Preference Model\n\nGiven prompt $x$ and two candidate responses: winning response $y_w$ and losing response $y_l$ ($y_w \\succ y_l$).  \nThe Bradley-Terry (BT) model posits that human preference is governed by an underlying latent reward function $r^*(x, y)$:\n\n$$ P(y_w \\succ y_l \\mid x) = \\sigma\\left(r^*(x, y_w) - r^*(x, y_l)\\right) = \\frac{1}{1 + e^{-(r^*(x, y_w) - r^*(x, y_l))}} $$\n\n---\n\n### 3.2 Classical RLHF Objective Formulation\n\nIn standard PPO-based RLHF, we optimize the policy $\\pi_\\theta$ to maximize expected reward while penalizing divergence from the reference policy $\\pi_{\\text{ref}}$ (preventing reward hacking):\n\n$$ \\max_{\\pi_\\theta} \\mathbb{E}_{x \\sim \\mathcal{D}, y \\sim \\pi_\\theta}\\left[ r(x, y) \\right] - \\beta \\mathbb{D}_{\\text{KL}}\\left( \\pi_\\theta(y \\mid x) \\parallel \\pi_{\\text{ref}}(y \\mid x) \\right) $$\n\nExpanding the KL divergence:\n$$ \\max_{\\pi_\\theta} \\mathbb{E}_{x \\sim \\mathcal{D}} \\left[ \\sum_y \\pi_\\theta(y \\mid x) r(x, y) - \\beta \\sum_y \\pi_\\theta(y \\mid x) \\log \\frac{\\pi_\\theta(y \\mid x)}{\\pi_{\\text{ref}}(y \\mid x)} \\right] $$\n$$ = \\max_{\\pi_\\theta} \\mathbb{E}_{x \\sim \\mathcal{D}} \\left[ \\beta \\sum_y \\pi_\\theta(y \\mid x) \\left( \\frac{1}{\\beta} r(x, y) - \\log \\frac{\\pi_\\theta(y \\mid x)}{\\pi_{\\text{ref}}(y \\mid x)} \\right) \\right] $$\n\n---\n\n### 3.3 The Step-by-Step DPO Derivation (Rafailov et al., 2023)\n\n#### Step 1: Solving the Optimal Policy in Closed Form\nLet $Z(x) = \\sum_y \\pi_{\\text{ref}}(y \\mid x) \\exp\\left(\\frac{1}{\\beta} r(x, y)\\right)$ be the partition function.  \nWe can rewrite the objective inside the expectation as:\n$$ -\\beta \\sum_y \\pi_\\theta(y \\mid x) \\log \\frac{\\pi_\\theta(y \\mid x)}{\\frac{1}{Z(x)} \\pi_{\\text{ref}}(y \\mid x) \\exp\\left(\\frac{1}{\\beta} r(x, y)\\right)} + \\beta \\log Z(x) $$\n$$ = -\\beta \\mathbb{D}_{\\text{KL}}\\left( \\pi_\\theta(y \\mid x) \\;\\parallel\\; \\pi^*(y \\mid x) \\right) + \\beta \\log Z(x) $$\n\nWhere the optimal policy distribution $\\pi^*$ is:\n$$ \\pi^*(y \\mid x) = \\frac{1}{Z(x)} \\pi_{\\text{ref}}(y \\mid x) \\exp\\left(\\frac{1}{\\beta} r(x, y)\\right) $$\n\nBecause KL divergence is non-negative ($\\mathbb{D}_{\\text{KL}} \\geq 0$) and minimized to $0$ if and only if $\\pi_\\theta = \\pi^*$, the theoretical optimal policy is:\n$$ \\mathbf{\\pi_\\theta^*(y \\mid x) = \\frac{1}{Z(x)} \\pi_{\\text{ref}}(y \\mid x) \\exp\\left(\\frac{1}{\\beta} r(x, y)\\right)} $$\n\n#### Step 2: Re-parameterizing the Reward Function\nTaking the natural logarithm on both sides:\n$$ \\log \\pi_\\theta^*(y \\mid x) = \\log \\pi_{\\text{ref}}(y \\mid x) + \\frac{1}{\\beta} r(x, y) - \\log Z(x) $$\nRearranging to isolate the exact reward function $r(x, y)$:\n$$ \\mathbf{r(x, y) = \\beta \\log \\frac{\\pi_\\theta^*(y \\mid x)}{\\pi_{\\text{ref}}(y \\mid x)} + \\beta \\log Z(x)} $$\n\n#### Step 3: Substituting into the Bradley-Terry Preference Likelihood\nSubstitute the re-parameterized reward $r(x, y)$ into the Bradley-Terry formula $P(y_w \\succ y_l \\mid x) = \\sigma(r(x, y_w) - r(x, y_l))$:\n$$ r(x, y_w) - r(x, y_l) = \\left[ \\beta \\log \\frac{\\pi_\\theta(y_w \\mid x)}{\\pi_{\\text{ref}}(y_w \\mid x)} + \\beta \\log Z(x) \\right] - \\left[ \\beta \\log \\frac{\\pi_\\theta(y_l \\mid x)}{\\pi_{\\text{ref}}(y_l \\mid x)} + \\beta \\log Z(x) \\right] $$\n\n$$\\mathbf{r(x, y_w) - r(x, y_l) = \\beta \\log \\frac{\\pi_\\theta(y_w \\mid x)}{\\pi_{\\text{ref}}(y_w \\mid x)} - \\beta \\log \\frac{\\pi_\\theta(y_l \\mid x)}{\\pi_{\\text{ref}}(y_l \\mid x)}}$$\n\n**Notice that the partition function $Z(x)$ completely cancels out!**\n\n#### Step 4: The Closed-Form DPO Loss Function\nMinimizing the Negative Log-Likelihood of preferences yields the DPO loss:\n\n$$ \\mathbf{\\mathcal{L}_{\\text{DPO}}(\\theta; \\pi_{\\text{ref}}) = -\\mathbb{E}_{(x, y_w, y_l) \\sim \\mathcal{D}} \\left[ \\log \\sigma \\left( \\beta \\log \\frac{\\pi_\\theta(y_w \\mid x)}{\\pi_{\\text{ref}}(y_w \\mid x)} - \\beta \\log \\frac{\\pi_\\theta(y_l \\mid x)}{\\pi_{\\text{ref}}(y_l \\mid x)} \\right) \\right]} $$\n\n*Why DPO Revolutionized Alignment*: Completely eliminates the need to train a separate Reward Model, eliminates Actor-Critic networks, eliminates PPO hyperparameter instability, and requires $2\\times$ less GPU VRAM.\n\n---\n\n### 3.4 Analytical Gradient of the DPO Loss\n\nLet $u = \\beta \\log \\frac{\\pi_\\theta(y_w \\mid x)}{\\pi_{\\text{ref}}(y_w \\mid x)} - \\beta \\log \\frac{\\pi_\\theta(y_l \\mid x)}{\\pi_{\\text{ref}}(y_l \\mid x)}$.  \nSince $\\frac{d}{du} [-\\log \\sigma(u)] = -(1 - \\sigma(u)) = -\\sigma(-u)$:\n\n$$ \\nabla_\\theta \\mathcal{L}_{\\text{DPO}} = -\\beta \\cdot \\underbrace{\\sigma\\left( \\hat{r}_\\theta(x, y_l) - \\hat{r}_\\theta(x, y_w) \\right)}_{\\text{Implicit Error Weight } w(x, y_w, y_l)} \\left[ \\underbrace{\\nabla_\\theta \\log \\pi_\\theta(y_w \\mid x)}_{\\text{Increase likelihood of } y_w} - \\underbrace{\\nabla_\\theta \\log \\pi_\\theta(y_l \\mid x)}_{\\text{Decrease likelihood of } y_l} \\right] $$\n\n#### Gradient Mechanics:\n- When the model currently prefers the wrong answer ($\\hat{r}_\\theta(y_l) > \\hat{r}_\\theta(y_w)$), the error weight $\\sigma(\\hat{r}_\\theta(y_l) - \\hat{r}_\\theta(y_w)) \\to 1$, applying the maximum gradient update.\n- When the model already strongly prefers the winning response ($\\hat{r}_\\theta(y_w) \\gg \\hat{r}_\\theta(y_l)$), the gradient scales to $0$, avoiding unnecessary updates.\n\n---\n\n## 4. Reasoning Models & Reinforcement Learning: GRPO (DeepSeek-R1)\n\n### 4.1 Group Relative Policy Optimization (GRPO)\n\nTraditional PPO trains an **Actor Model** $\\pi_\\theta$ and a **Critic Model** $V_\\phi$. For a 70B model, the Critic model requires an additional 70B parameters in GPU VRAM and complex Value function fitting.  \nDeepSeek introduced **GRPO (Group Relative Policy Optimization)**, which eliminates the Critic network entirely.\n\n```\nPrompt x \u2500\u2500\u2500\u2500\u2500\u2500\u25ba Generate Group of G Outputs: {y_1, y_2, ..., y_G}\n                     \u2502\n                     \u25bc\n         Evaluate Rule-Based Rewards: {r_1, r_2, ..., r_G}\n         (e.g., Math Correctness = 1.0, Formatting = 0.5)\n                     \u2502\n                     \u25bc\n         Compute Group-Normalized Advantages:\n         A_i = (r_i - Mean({r})) / Std({r})\n                     \u2502\n                     \u25bc\n         Update Policy \u03c0_\u03b8 with Clipped Surrogate Loss + KL Regularization\n```\n\n### 4.2 Mathematical Formulation of GRPO\n\nFor each prompt $x$, the model samples a group of $G$ candidate outputs $\\{y_1, y_2, \\dots, y_G\\} \\sim \\pi_{\\theta_{\\text{old}}}(y \\mid x)$.\n\n#### 1. Group Advantage Normalization:\nInstead of using a learned baseline $V(s)$, GRPO computes advantages relative to the group:\n$$ A_i = \\frac{r_i - \\text{mean}(\\{r_1, r_2, \\dots, r_G\\})}{\\text{std}(\\{r_1, r_2, \\dots, r_G\\}) + \\epsilon} $$\n\n#### 2. The GRPO Objective Function:\n$$ \\mathcal{J}_{\\text{GRPO}}(\\theta) = \\mathbb{E}_{x \\sim \\mathcal{D}, \\{y_i\\}_{i=1}^G \\sim \\pi_{\\theta_{\\text{old}}}} \\left[ \\frac{1}{G} \\sum_{i=1}^G \\left( \\min\\left( \\frac{\\pi_\\theta(y_i \\mid x)}{\\pi_{\\theta_{\\text{old}}}(y_i \\mid x)} A_i, \\; \\text{clip}\\left(\\frac{\\pi_\\theta(y_i \\mid x)}{\\pi_{\\theta_{\\text{old}}}(y_i \\mid x)}, 1-\\epsilon, 1+\\epsilon\\right) A_i \\right) - \\beta \\mathbb{D}_{\\text{KL}}\\left(\\pi_\\theta \\parallel \\pi_{\\text{ref}}\\right) \\right) \\right] $$\n\nWhere the unbiased KL divergence estimator is:\n$$ \\mathbb{D}_{\\text{KL}}\\left(\\pi_\\theta \\parallel \\pi_{\\text{ref}}\\right) = \\frac{\\pi_{\\text{ref}}(y_i \\mid x)}{\\pi_\\theta(y_i \\mid x)} - \\log \\frac{\\pi_{\\text{ref}}(y_i \\mid x)}{\\pi_\\theta(y_i \\mid x)} - 1 $$\n\n### 4.3 Rule-Based Verifiable Rewards vs. Learned Reward Models\n\nIn reasoning tasks (Math, Code, Tool Use), using neural Reward Models causes **Reward Hacking** (the model learns to game the reward model's semantic vulnerabilities).  \nGRPO uses deterministic **Rule-Based Verifiers**:\n1. **Accuracy Reward**: Executes the generated Python code in a sandbox or parses final answer tags `<answer>...</answer>` against ground-truth LaTeX ($r_{\\text{acc}} \\in \\{0, 1\\}$).\n2. **Format Reward**: Enforces that reasoning occurs strictly inside `<think>...</think>` tags ($r_{\\text{format}} \\in \\{0, 1\\}$).\n\n---\n\n## 5. PyTorch Implementation: DPO and GRPO Loss Functions\n\n```python\nimport torch\nimport torch.nn as nn\nimport torch.nn.functional as F\n\nclass DPOLoss(nn.Module):\n    \"\"\"\n    Direct Preference Optimization (DPO) Loss Module.\n    \"\"\"\n    def __init__(self, beta: float = 0.1):\n        super().__init__()\n        self.beta = beta\n\n    def forward(\n        self,\n        policy_chosen_logps: torch.Tensor,   # [Batch]\n        policy_rejected_logps: torch.Tensor, # [Batch]\n        reference_chosen_logps: torch.Tensor,# [Batch]\n        reference_rejected_logps: torch.Tensor# [Batch]\n    ) -> torch.Tensor:\n        # Compute log-ratio differences: log(\u03c0_\u03b8(y|x) / \u03c0_ref(y|x))\n        pi_logratios = policy_chosen_logps - policy_rejected_logps\n        ref_logratios = reference_chosen_logps - reference_rejected_logps\n        \n        logits = pi_logratios - ref_logratios\n        loss = -F.logsigmoid(self.beta * logits)\n        return loss.mean()\n\nclass GRPOLoss(nn.Module):\n    \"\"\"\n    Group Relative Policy Optimization (GRPO) Loss Module.\n    \"\"\"\n    def __init__(self, clip_eps: float = 0.2, beta: float = 0.04):\n        super().__init__()\n        self.clip_eps = clip_eps\n        self.beta = beta\n\n    def forward(\n        self,\n        logp_theta: torch.Tensor,      # [Group_Size, Seq_Len]\n        logp_old: torch.Tensor,        # [Group_Size, Seq_Len]\n        logp_ref: torch.Tensor,        # [Group_Size, Seq_Len]\n        rewards: torch.Tensor          # [Group_Size]\n    ) -> torch.Tensor:\n        # 1. Compute Group Normalized Advantage: (r - mean) / std\n        mean_r = rewards.mean()\n        std_r = rewards.std() + 1e-8\n        advantages = ((rewards - mean_r) / std_r).unsqueeze(-1) # [Group_Size, 1]\n\n        # 2. Probability Ratio: \u03c0_\u03b8 / \u03c0_old\n        ratios = torch.exp(logp_theta - logp_old)\n\n        # 3. Clipped Surrogate Objective\n        surr1 = ratios * advantages\n        surr2 = torch.clamp(ratios, 1.0 - self.clip_eps, 1.0 + self.clip_eps) * advantages\n        policy_loss = -torch.min(surr1, surr2).mean()\n\n        # 4. KL Divergence Penalty: D_KL(\u03c0_\u03b8 || \u03c0_ref)\n        kl = torch.exp(logp_ref - logp_theta) - (logp_ref - logp_theta) - 1.0\n        kl_loss = self.beta * kl.mean()\n\n        return policy_loss + kl_loss\n\nif __name__ == \"__main__\":\n    B = 4\n    dpo = DPOLoss(beta=0.1)\n    p_w, p_l = torch.tensor([-2.1, -1.5, -3.0, -0.8]), torch.tensor([-4.5, -3.2, -4.1, -2.9])\n    r_w, r_l = torch.tensor([-2.0, -1.6, -3.1, -0.9]), torch.tensor([-3.8, -3.0, -3.5, -2.5])\n    loss = dpo(p_w, p_l, r_w, r_l)\n    print(f\"DPO Loss computation verified: {loss.item():.4f}\")\n```\n\n---\n\n## 6. Deep Interview Interrogation Ladder\n\n- **Level 1 (Concept)**: What is the primary difference between SFT and Preference Optimization?\n- **Level 3 (Derivation)**: Write out the Bradley-Terry preference model and explain why the partition function $Z(x)$ cancels out in DPO.\n- **Level 5 (Mechanics)**: Why is matrix $B$ initialized to zero in LoRA, and what happens mathematically if both $A$ and $B$ are initialized with Gaussian noise?\n- **Level 7 (RL for Reasoning)**: Explain how GRPO estimates advantage without a Critic network, and why rule-based verifiers prevent reward hacking in math/code reasoning.\n- **Level 9 (Deep Systems)**: In QLoRA, why does NormalFloat4 (NF4) achieve better quantization fidelity than standard uniform 4-bit integer quantization (INT4)?\n- **Level 10 (Principal Engineering)**: You need to align a 70B agent for tool-use and long-running workflows. When would you choose DPO vs. GRPO vs. Rejection-Sampling SFT, and how do you prevent mode collapse during iterative post-training?\n", "html": "<h1>05_POST_TRAINING \u2014 Mathematical &amp; Mechanistic Reference</h1>\n<blockquote>\n<p><strong>Audience</strong>: ML Engineers, LLM Systems Engineers, and AI Researchers preparing for senior/principal technical interviews.<br />\n<strong>Core Objective</strong>: Provide an exhaustive mathematical and algorithmic breakdown of Post-Training \u2014 spanning SFT, LoRA/QLoRA, the step-by-step derivation of Direct Preference Optimization (DPO), and Group Relative Policy Optimization (GRPO) for reasoning models (DeepSeek-R1 style).</p>\n</blockquote>\n<hr />\n<h2>1. Supervised Fine-Tuning (SFT) Mathematics</h2>\n<p>Given a dataset of instruction-response pairs <span class=\"katex-inline\">$\\mathcal{D}_{\\text{SFT}} = \\{(x^{(i)}, y^{(i)})\\}_{i=1}^N$</span>, where <span class=\"katex-inline\">$x$</span> is the prompt tokens <span class=\"katex-inline\">$(x_1, \\dots, x_{S_p})$</span> and <span class=\"katex-inline\">$y$</span> is the response tokens <span class=\"katex-inline\">$(y_1, \\dots, y_{S_r})$</span>.</p>\n<h3>1.1 The Masked Cross-Entropy Objective</h3>\n<p>We only compute gradients over the <strong>response tokens</strong> <span class=\"katex-inline\">$y$</span>, masking out the prompt tokens <span class=\"katex-inline\">$x$</span> from the loss calculation:</p>\n<div class=\"katex-display\">$$\\mathcal{L}_{\\text{SFT}}(\\theta) = -\\frac{1}{N} \\sum_{i=1}^N \\sum_{t=1}^{S_r^{(i)}} \\log P_\\theta\\left(y_t^{(i)} \\mid x^{(i)}, y_{&lt;t}^{(i)}\\right)$$</div>\n\n<pre><code>Prompt Tokens (x_1, x_2, x_3)           Response Tokens (y_1, y_2, y_3, &lt;EOS&gt;)\n[ Loss Mask = 0, Gradient = 0 ]        [ Loss Mask = 1, Gradient = (p_t - target) ]\n</code></pre>\n<p><em>Why Masking Prompt Tokens is Mandatory</em>: If prompt tokens are included in the loss, the model allocates substantial capacity to predicting user syntax, grammar, and prompt templates rather than mastering instruction-following and tool formatting.</p>\n<hr />\n<h2>2. Parameter-Efficient Fine-Tuning: LoRA, QLoRA, and DoRA</h2>\n<h3>2.1 Low-Rank Adaptation (LoRA)</h3>\n<p>Let <span class=\"katex-inline\">$W_0 \\in \\mathbb{R}^{d_{\\text{out}} \\times d_{\\text{in}}}$</span> be a frozen pre-trained weight matrix.<br />\nLoRA decomposes the weight update <span class=\"katex-inline\">$\\Delta W$</span> into the product of two low-rank matrices:</p>\n<div class=\"katex-display\">$$W = W_0 + \\Delta W = W_0 + \\frac{\\alpha}{r} B A$$</div>\n\n<p>Where:<br />\n- <span class=\"katex-inline\">$A \\in \\mathbb{R}^{r \\times d_{\\text{in}}}$</span> is initialized from Gaussian distribution <span class=\"katex-inline\">$\\mathcal{N}\\left(0, \\sigma^2 = \\frac{1}{r}\\right)$</span>.<br />\n- <span class=\"katex-inline\">$B \\in \\mathbb{R}^{d_{\\text{out}} \\times r}$</span> is initialized to strictly <strong>zero</strong>: <span class=\"katex-inline\">$B = 0$</span>.<br />\n- <span class=\"katex-inline\">$r \\ll \\min(d_{\\text{in}}, d_{\\text{out}})$</span> is the intrinsic rank (typically <span class=\"katex-inline\">$r \\in [8, 64]$</span>).<br />\n- <span class=\"katex-inline\">$\\alpha$</span> is a constant scaling hyperparameter (typically <span class=\"katex-inline\">$\\alpha = 2r \\implies \\text{scaling} = 2$</span>).</p>\n<pre><code>                Input Vector x (dim d_in)\n                    \u2502\n            \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n            \u25bc               \u25bc\n     Frozen W_0        Matrix A (dim r x d_in)\n     (d_out x d_in)         \u2502\n            \u2502          Matrix B (dim d_out x r) [Init = 0]\n            \u2502               \u2502\n            \u2502          Scale (\u03b1 / r)\n            \u2502               \u2502\n            \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                    \u25bc\n           Output h = W_0 x + (\u03b1/r) B A x\n</code></pre>\n<h4>Why <span class=\"katex-inline\">$B = 0$</span> Initialization is Mandatory:</h4>\n<p>At step <span class=\"katex-inline\">$t=0$</span>:</p>\n<div class=\"katex-display\">$$\\Delta W = \\frac{\\alpha}{r} (0) A = 0 \\implies W = W_0$$</div>\n<p>This guarantees that training begins exactly from the pre-trained model's output without introducing catastrophic initial perturbation.</p>\n<h4>Gradient Derivations for LoRA Parameters:</h4>\n<p>Let the incoming gradient from the downstream loss be <span class=\"katex-inline\">$G = \\frac{\\partial \\mathcal{L}}{\\partial h} \\in \\mathbb{R}^{B \\times d_{\\text{out}}}$</span>, and input activation be <span class=\"katex-inline\">$X \\in \\mathbb{R}^{B \\times d_{\\text{in}}}$</span>.<br />\nThe forward pass is <span class=\"katex-inline\">$h = X W_0^T + \\frac{\\alpha}{r} X A^T B^T$</span>.</p>\n<div class=\"katex-display\">$$\\frac{\\partial \\mathcal{L}}{\\partial B} = \\frac{\\alpha}{r} G^T (X A^T) \\in \\mathbb{R}^{d_{\\text{out}} \\times r}$$</div>\n<div class=\"katex-display\">$$\\frac{\\partial \\mathcal{L}}{\\partial A} = \\frac{\\alpha}{r} (G B)^T X \\in \\mathbb{R}^{r \\times d_{\\text{in}}}$$</div>\n<div class=\"katex-display\">$$\\frac{\\partial \\mathcal{L}}{\\partial X} = G W_0 + \\frac{\\alpha}{r} G B A \\in \\mathbb{R}^{B \\times d_{\\text{in}}}$$</div>\n\n<p><em>Zero Inference Overhead</em>: Before deployment, compute <span class=\"katex-inline\">$W_{\\text{merged}} = W_0 + \\frac{\\alpha}{r} B A$</span>. Inference latency is identical to the base model.</p>\n<hr />\n<h3>2.2 QLoRA: NormalFloat4 (NF4) &amp; Double Quantization (Dettmers et al., 2023)</h3>\n<p>QLoRA enables fine-tuning a 70B parameter model on a single 80GB GPU by quantizing base weights <span class=\"katex-inline\">$W_0$</span> to 4-bit NormalFloat while training 16-bit LoRA adapters.</p>\n<ol>\n<li><strong>NormalFloat4 (NF4) Quantile Construction</strong>:<br />\n   Weights of pre-trained models follow a normal distribution <span class=\"katex-inline\">$W_0 \\sim \\mathcal{N}(0, \\sigma^2)$</span>.<br />\n   NF4 constructs 16 discrete quantization bins <span class=\"katex-inline\">$q_i \\in [-1, 1]$</span> (<span class=\"katex-inline\">$i \\in \\{0, \\dots, 15\\}$</span>) such that each bin contains an <strong>equal probability mass</strong>:<br />\n   <div class=\"katex-display\">$$q_i = \\frac{1}{2} \\left( Q_X\\left(\\frac{i}{2^k}\\right) + Q_X\\left(\\frac{i+1}{2^k}\\right) \\right)$$</div></li>\n</ol>\n<p>where <span class=\"katex-inline\">$Q_X(\\cdot)$</span> is the quantile function (inverse CDF) of the standard normal distribution <span class=\"katex-inline\">$\\mathcal{N}(0, 1)$</span>.</p>\n<ol start=\"2\">\n<li><strong>Double Quantization (DQ)</strong>:<br />\n   Quantization divides weights into blocks of size 64 with a 32-bit FP32 quantization scale <span class=\"katex-inline\">$c_1$</span>.<br />\n   <span class=\"katex-inline\">$c_1$</span></li>\n</ol>\n<p>adds  of overhead.<br />\n   Double Quantization quantizes the scales <span class=\"katex-inline\">$c_1$</span> themselves into 8-bit integers with a second block size of 256 (<span class=\"katex-inline\">$c_2$</span> in FP32):<br />\n   <div class=\"katex-display\">$$\\text{Scale Memory Overhead} = \\frac{8}{64} + \\frac{32}{64 \\times 256} = 0.125 + 0.00195 = \\mathbf{0.127 \\text{ bits/parameter}}$$</div></p>\n<p>Saves <span class=\"katex-inline\">$\\sim 0.373$</span> bits per parameter (<span class=\"katex-inline\">$\\sim 3.2\\text{ GB}$</span> on a 70B model).</p>\n<hr />\n<h2>3. Preference Alignment: Direct Preference Optimization (DPO)</h2>\n<h3>3.1 The Bradley-Terry Preference Model</h3>\n<p>Given prompt <span class=\"katex-inline\">$x$</span> and two candidate responses: winning response <span class=\"katex-inline\">$y_w$</span> and losing response <span class=\"katex-inline\">$y_l$</span> (<span class=\"katex-inline\">$y_w \\succ y_l$</span>).<br />\nThe Bradley-Terry (BT) model posits that human preference is governed by an underlying latent reward function <span class=\"katex-inline\">$r^*(x, y)$</span>:</p>\n<div class=\"katex-display\">$$P(y_w \\succ y_l \\mid x) = \\sigma\\left(r^*(x, y_w) - r^*(x, y_l)\\right) = \\frac{1}{1 + e^{-(r^*(x, y_w) - r^*(x, y_l))}}$$</div>\n\n<hr />\n<h3>3.2 Classical RLHF Objective Formulation</h3>\n<p>In standard PPO-based RLHF, we optimize the policy <span class=\"katex-inline\">$\\pi_\\theta$</span> to maximize expected reward while penalizing divergence from the reference policy <span class=\"katex-inline\">$\\pi_{\\text{ref}}$</span> (preventing reward hacking):</p>\n<div class=\"katex-display\">$$\\max_{\\pi_\\theta} \\mathbb{E}_{x \\sim \\mathcal{D}, y \\sim \\pi_\\theta}\\left[ r(x, y) \\right] - \\beta \\mathbb{D}_{\\text{KL}}\\left( \\pi_\\theta(y \\mid x) \\parallel \\pi_{\\text{ref}}(y \\mid x) \\right)$$</div>\n\n<p>Expanding the KL divergence:</p>\n<div class=\"katex-display\">$$\\max_{\\pi_\\theta} \\mathbb{E}_{x \\sim \\mathcal{D}} \\left[ \\sum_y \\pi_\\theta(y \\mid x) r(x, y) - \\beta \\sum_y \\pi_\\theta(y \\mid x) \\log \\frac{\\pi_\\theta(y \\mid x)}{\\pi_{\\text{ref}}(y \\mid x)} \\right]$$</div>\n<div class=\"katex-display\">$$= \\max_{\\pi_\\theta} \\mathbb{E}_{x \\sim \\mathcal{D}} \\left[ \\beta \\sum_y \\pi_\\theta(y \\mid x) \\left( \\frac{1}{\\beta} r(x, y) - \\log \\frac{\\pi_\\theta(y \\mid x)}{\\pi_{\\text{ref}}(y \\mid x)} \\right) \\right]$$</div>\n\n<hr />\n<h3>3.3 The Step-by-Step DPO Derivation (Rafailov et al., 2023)</h3>\n<h4>Step 1: Solving the Optimal Policy in Closed Form</h4>\n<p>Let <span class=\"katex-inline\">$Z(x) = \\sum_y \\pi_{\\text{ref}}(y \\mid x) \\exp\\left(\\frac{1}{\\beta} r(x, y)\\right)$</span> be the partition function.<br />\nWe can rewrite the objective inside the expectation as:</p>\n<div class=\"katex-display\">$$-\\beta \\sum_y \\pi_\\theta(y \\mid x) \\log \\frac{\\pi_\\theta(y \\mid x)}{\\frac{1}{Z(x)} \\pi_{\\text{ref}}(y \\mid x) \\exp\\left(\\frac{1}{\\beta} r(x, y)\\right)} + \\beta \\log Z(x)$$</div>\n<div class=\"katex-display\">$$= -\\beta \\mathbb{D}_{\\text{KL}}\\left( \\pi_\\theta(y \\mid x) \\;\\parallel\\; \\pi^*(y \\mid x) \\right) + \\beta \\log Z(x)$$</div>\n\n<p>Where the optimal policy distribution <span class=\"katex-inline\">$\\pi^*$</span> is:</p>\n<div class=\"katex-display\">$$\\pi^*(y \\mid x) = \\frac{1}{Z(x)} \\pi_{\\text{ref}}(y \\mid x) \\exp\\left(\\frac{1}{\\beta} r(x, y)\\right)$$</div>\n\n<p>Because KL divergence is non-negative (<span class=\"katex-inline\">$\\mathbb{D}_{\\text{KL}} \\geq 0$</span>) and minimized to <span class=\"katex-inline\">$0$</span> if and only if <span class=\"katex-inline\">$\\pi_\\theta = \\pi^*$</span>, the theoretical optimal policy is:</p>\n<div class=\"katex-display\">$$\\mathbf{\\pi_\\theta^*(y \\mid x) = \\frac{1}{Z(x)} \\pi_{\\text{ref}}(y \\mid x) \\exp\\left(\\frac{1}{\\beta} r(x, y)\\right)}$$</div>\n\n<h4>Step 2: Re-parameterizing the Reward Function</h4>\n<p>Taking the natural logarithm on both sides:</p>\n<div class=\"katex-display\">$$\\log \\pi_\\theta^*(y \\mid x) = \\log \\pi_{\\text{ref}}(y \\mid x) + \\frac{1}{\\beta} r(x, y) - \\log Z(x)$$</div>\n<p>Rearranging to isolate the exact reward function <span class=\"katex-inline\">$r(x, y)$</span>:</p>\n<div class=\"katex-display\">$$\\mathbf{r(x, y) = \\beta \\log \\frac{\\pi_\\theta^*(y \\mid x)}{\\pi_{\\text{ref}}(y \\mid x)} + \\beta \\log Z(x)}$$</div>\n\n<h4>Step 3: Substituting into the Bradley-Terry Preference Likelihood</h4>\n<p>Substitute the re-parameterized reward <span class=\"katex-inline\">$r(x, y)$</span> into the Bradley-Terry formula <span class=\"katex-inline\">$P(y_w \\succ y_l \\mid x) = \\sigma(r(x, y_w) - r(x, y_l))$</span>:</p>\n<div class=\"katex-display\">$$r(x, y_w) - r(x, y_l) = \\left[ \\beta \\log \\frac{\\pi_\\theta(y_w \\mid x)}{\\pi_{\\text{ref}}(y_w \\mid x)} + \\beta \\log Z(x) \\right] - \\left[ \\beta \\log \\frac{\\pi_\\theta(y_l \\mid x)}{\\pi_{\\text{ref}}(y_l \\mid x)} + \\beta \\log Z(x) \\right]$$</div>\n\n<div class=\"katex-display\">$$\\mathbf{r(x, y_w) - r(x, y_l) = \\beta \\log \\frac{\\pi_\\theta(y_w \\mid x)}{\\pi_{\\text{ref}}(y_w \\mid x)} - \\beta \\log \\frac{\\pi_\\theta(y_l \\mid x)}{\\pi_{\\text{ref}}(y_l \\mid x)}}$$</div>\n\n<p><strong>Notice that the partition function <span class=\"katex-inline\">$Z(x)$</span> completely cancels out!</strong></p>\n<h4>Step 4: The Closed-Form DPO Loss Function</h4>\n<p>Minimizing the Negative Log-Likelihood of preferences yields the DPO loss:</p>\n<div class=\"katex-display\">$$\\mathbf{\\mathcal{L}_{\\text{DPO}}(\\theta; \\pi_{\\text{ref}}) = -\\mathbb{E}_{(x, y_w, y_l) \\sim \\mathcal{D}} \\left[ \\log \\sigma \\left( \\beta \\log \\frac{\\pi_\\theta(y_w \\mid x)}{\\pi_{\\text{ref}}(y_w \\mid x)} - \\beta \\log \\frac{\\pi_\\theta(y_l \\mid x)}{\\pi_{\\text{ref}}(y_l \\mid x)} \\right) \\right]}$$</div>\n\n<p><em>Why DPO Revolutionized Alignment</em>: Completely eliminates the need to train a separate Reward Model, eliminates Actor-Critic networks, eliminates PPO hyperparameter instability, and requires <span class=\"katex-inline\">$2\\times$</span> less GPU VRAM.</p>\n<hr />\n<h3>3.4 Analytical Gradient of the DPO Loss</h3>\n<p>Let <span class=\"katex-inline\">$u = \\beta \\log \\frac{\\pi_\\theta(y_w \\mid x)}{\\pi_{\\text{ref}}(y_w \\mid x)} - \\beta \\log \\frac{\\pi_\\theta(y_l \\mid x)}{\\pi_{\\text{ref}}(y_l \\mid x)}$</span>.<br />\nSince <span class=\"katex-inline\">$\\frac{d}{du} [-\\log \\sigma(u)] = -(1 - \\sigma(u)) = -\\sigma(-u)$</span>:</p>\n<div class=\"katex-display\">$$\\nabla_\\theta \\mathcal{L}_{\\text{DPO}} = -\\beta \\cdot \\underbrace{\\sigma\\left( \\hat{r}_\\theta(x, y_l) - \\hat{r}_\\theta(x, y_w) \\right)}_{\\text{Implicit Error Weight } w(x, y_w, y_l)} \\left[ \\underbrace{\\nabla_\\theta \\log \\pi_\\theta(y_w \\mid x)}_{\\text{Increase likelihood of } y_w} - \\underbrace{\\nabla_\\theta \\log \\pi_\\theta(y_l \\mid x)}_{\\text{Decrease likelihood of } y_l} \\right]$$</div>\n\n<h4>Gradient Mechanics:</h4>\n<ul>\n<li>When the model currently prefers the wrong answer (<span class=\"katex-inline\">$\\hat{r}_\\theta(y_l) &gt; \\hat{r}_\\theta(y_w)$</span>), the error weight <span class=\"katex-inline\">$\\sigma(\\hat{r}_\\theta(y_l) - \\hat{r}_\\theta(y_w)) \\to 1$</span>, applying the maximum gradient update.</li>\n<li>When the model already strongly prefers the winning response (<span class=\"katex-inline\">$\\hat{r}_\\theta(y_w) \\gg \\hat{r}_\\theta(y_l)$</span>), the gradient scales to <span class=\"katex-inline\">$0$</span>, avoiding unnecessary updates.</li>\n</ul>\n<hr />\n<h2>4. Reasoning Models &amp; Reinforcement Learning: GRPO (DeepSeek-R1)</h2>\n<h3>4.1 Group Relative Policy Optimization (GRPO)</h3>\n<p>Traditional PPO trains an <strong>Actor Model</strong> <span class=\"katex-inline\">$\\pi_\\theta$</span> and a <strong>Critic Model</strong> <span class=\"katex-inline\">$V_\\phi$</span>. For a 70B model, the Critic model requires an additional 70B parameters in GPU VRAM and complex Value function fitting.<br />\nDeepSeek introduced <strong>GRPO (Group Relative Policy Optimization)</strong>, which eliminates the Critic network entirely.</p>\n<pre><code>Prompt x \u2500\u2500\u2500\u2500\u2500\u2500\u25ba Generate Group of G Outputs: {y_1, y_2, ..., y_G}\n                     \u2502\n                     \u25bc\n         Evaluate Rule-Based Rewards: {r_1, r_2, ..., r_G}\n         (e.g., Math Correctness = 1.0, Formatting = 0.5)\n                     \u2502\n                     \u25bc\n         Compute Group-Normalized Advantages:\n         A_i = (r_i - Mean({r})) / Std({r})\n                     \u2502\n                     \u25bc\n         Update Policy \u03c0_\u03b8 with Clipped Surrogate Loss + KL Regularization\n</code></pre>\n<h3>4.2 Mathematical Formulation of GRPO</h3>\n<p>For each prompt <span class=\"katex-inline\">$x$</span>, the model samples a group of <span class=\"katex-inline\">$G$</span> candidate outputs <span class=\"katex-inline\">$\\{y_1, y_2, \\dots, y_G\\} \\sim \\pi_{\\theta_{\\text{old}}}(y \\mid x)$</span>.</p>\n<h4>1. Group Advantage Normalization:</h4>\n<p>Instead of using a learned baseline <span class=\"katex-inline\">$V(s)$</span>, GRPO computes advantages relative to the group:</p>\n<div class=\"katex-display\">$$A_i = \\frac{r_i - \\text{mean}(\\{r_1, r_2, \\dots, r_G\\})}{\\text{std}(\\{r_1, r_2, \\dots, r_G\\}) + \\epsilon}$$</div>\n\n<h4>2. The GRPO Objective Function:</h4>\n<div class=\"katex-display\">$$\\mathcal{J}_{\\text{GRPO}}(\\theta) = \\mathbb{E}_{x \\sim \\mathcal{D}, \\{y_i\\}_{i=1}^G \\sim \\pi_{\\theta_{\\text{old}}}} \\left[ \\frac{1}{G} \\sum_{i=1}^G \\left( \\min\\left( \\frac{\\pi_\\theta(y_i \\mid x)}{\\pi_{\\theta_{\\text{old}}}(y_i \\mid x)} A_i, \\; \\text{clip}\\left(\\frac{\\pi_\\theta(y_i \\mid x)}{\\pi_{\\theta_{\\text{old}}}(y_i \\mid x)}, 1-\\epsilon, 1+\\epsilon\\right) A_i \\right) - \\beta \\mathbb{D}_{\\text{KL}}\\left(\\pi_\\theta \\parallel \\pi_{\\text{ref}}\\right) \\right) \\right]$$</div>\n\n<p>Where the unbiased KL divergence estimator is:</p>\n<div class=\"katex-display\">$$\\mathbb{D}_{\\text{KL}}\\left(\\pi_\\theta \\parallel \\pi_{\\text{ref}}\\right) = \\frac{\\pi_{\\text{ref}}(y_i \\mid x)}{\\pi_\\theta(y_i \\mid x)} - \\log \\frac{\\pi_{\\text{ref}}(y_i \\mid x)}{\\pi_\\theta(y_i \\mid x)} - 1$$</div>\n\n<h3>4.3 Rule-Based Verifiable Rewards vs. Learned Reward Models</h3>\n<p>In reasoning tasks (Math, Code, Tool Use), using neural Reward Models causes <strong>Reward Hacking</strong> (the model learns to game the reward model's semantic vulnerabilities).<br />\nGRPO uses deterministic <strong>Rule-Based Verifiers</strong>:<br />\n1. <strong>Accuracy Reward</strong>: Executes the generated Python code in a sandbox or parses final answer tags <code>&lt;answer&gt;...&lt;/answer&gt;</code> against ground-truth LaTeX (<span class=\"katex-inline\">$r_{\\text{acc}} \\in \\{0, 1\\}$</span>).<br />\n2. <strong>Format Reward</strong>: Enforces that reasoning occurs strictly inside <code>&lt;think&gt;...&lt;/think&gt;</code> tags (<span class=\"katex-inline\">$r_{\\text{format}} \\in \\{0, 1\\}$</span>).</p>\n<hr />\n<h2>5. PyTorch Implementation: DPO and GRPO Loss Functions</h2>\n<pre><code class=\"language-python\">import torch\nimport torch.nn as nn\nimport torch.nn.functional as F\n\nclass DPOLoss(nn.Module):\n    &quot;&quot;&quot;\n    Direct Preference Optimization (DPO) Loss Module.\n    &quot;&quot;&quot;\n    def __init__(self, beta: float = 0.1):\n        super().__init__()\n        self.beta = beta\n\n    def forward(\n        self,\n        policy_chosen_logps: torch.Tensor,   # [Batch]\n        policy_rejected_logps: torch.Tensor, # [Batch]\n        reference_chosen_logps: torch.Tensor,# [Batch]\n        reference_rejected_logps: torch.Tensor# [Batch]\n    ) -&gt; torch.Tensor:\n        # Compute log-ratio differences: log(\u03c0_\u03b8(y|x) / \u03c0_ref(y|x))\n        pi_logratios = policy_chosen_logps - policy_rejected_logps\n        ref_logratios = reference_chosen_logps - reference_rejected_logps\n\n        logits = pi_logratios - ref_logratios\n        loss = -F.logsigmoid(self.beta * logits)\n        return loss.mean()\n\nclass GRPOLoss(nn.Module):\n    &quot;&quot;&quot;\n    Group Relative Policy Optimization (GRPO) Loss Module.\n    &quot;&quot;&quot;\n    def __init__(self, clip_eps: float = 0.2, beta: float = 0.04):\n        super().__init__()\n        self.clip_eps = clip_eps\n        self.beta = beta\n\n    def forward(\n        self,\n        logp_theta: torch.Tensor,      # [Group_Size, Seq_Len]\n        logp_old: torch.Tensor,        # [Group_Size, Seq_Len]\n        logp_ref: torch.Tensor,        # [Group_Size, Seq_Len]\n        rewards: torch.Tensor          # [Group_Size]\n    ) -&gt; torch.Tensor:\n        # 1. Compute Group Normalized Advantage: (r - mean) / std\n        mean_r = rewards.mean()\n        std_r = rewards.std() + 1e-8\n        advantages = ((rewards - mean_r) / std_r).unsqueeze(-1) # [Group_Size, 1]\n\n        # 2. Probability Ratio: \u03c0_\u03b8 / \u03c0_old\n        ratios = torch.exp(logp_theta - logp_old)\n\n        # 3. Clipped Surrogate Objective\n        surr1 = ratios * advantages\n        surr2 = torch.clamp(ratios, 1.0 - self.clip_eps, 1.0 + self.clip_eps) * advantages\n        policy_loss = -torch.min(surr1, surr2).mean()\n\n        # 4. KL Divergence Penalty: D_KL(\u03c0_\u03b8 || \u03c0_ref)\n        kl = torch.exp(logp_ref - logp_theta) - (logp_ref - logp_theta) - 1.0\n        kl_loss = self.beta * kl.mean()\n\n        return policy_loss + kl_loss\n\nif __name__ == &quot;__main__&quot;:\n    B = 4\n    dpo = DPOLoss(beta=0.1)\n    p_w, p_l = torch.tensor([-2.1, -1.5, -3.0, -0.8]), torch.tensor([-4.5, -3.2, -4.1, -2.9])\n    r_w, r_l = torch.tensor([-2.0, -1.6, -3.1, -0.9]), torch.tensor([-3.8, -3.0, -3.5, -2.5])\n    loss = dpo(p_w, p_l, r_w, r_l)\n    print(f&quot;DPO Loss computation verified: {loss.item():.4f}&quot;)\n</code></pre>\n<hr />\n<h2>6. Deep Interview Interrogation Ladder</h2>\n<ul>\n<li><strong>Level 1 (Concept)</strong>: What is the primary difference between SFT and Preference Optimization?</li>\n<li><strong>Level 3 (Derivation)</strong>: Write out the Bradley-Terry preference model and explain why the partition function <span class=\"katex-inline\">$Z(x)$</span> cancels out in DPO.</li>\n<li><strong>Level 5 (Mechanics)</strong>: Why is matrix <span class=\"katex-inline\">$B$</span> initialized to zero in LoRA, and what happens mathematically if both <span class=\"katex-inline\">$A$</span> and <span class=\"katex-inline\">$B$</span> are initialized with Gaussian noise?</li>\n<li><strong>Level 7 (RL for Reasoning)</strong>: Explain how GRPO estimates advantage without a Critic network, and why rule-based verifiers prevent reward hacking in math/code reasoning.</li>\n<li><strong>Level 9 (Deep Systems)</strong>: In QLoRA, why does NormalFloat4 (NF4) achieve better quantization fidelity than standard uniform 4-bit integer quantization (INT4)?</li>\n<li><strong>Level 10 (Principal Engineering)</strong>: You need to align a 70B agent for tool-use and long-running workflows. When would you choose DPO vs. GRPO vs. Rejection-Sampling SFT, and how do you prevent mode collapse during iterative post-training?</li>\n</ul>\n<span class=\"katex-inline\">$\\frac{32}{64} = 0.5 \\text{ bits/param}$</span>"}, {"id": "06_DATA_AND_SYNTHETIC_DATA", "file": "06_DATA_AND_SYNTHETIC_DATA.md", "title": "Data Engineering & Synthetic Flywheels (MinHash LSH)", "priority": "P1", "phase": "Phase 3: Alignment & Reasoning", "content": "# 06_DATA_AND_SYNTHETIC_DATA \u2014 Mathematical & Mechanistic Reference\n\n> **Audience**: ML Engineers, LLM Systems Engineers, and AI Researchers preparing for senior/principal technical interviews.  \n> **Core Objective**: Provide an exhaustive mathematical and algorithmic reference on data engineering for LLMs \u2014 covering MinHash LSH deduplication proofs, Model Collapse dynamics, decontamination metrics, synthetic data generation pipelines, and closed-loop production flywheels.\n\n---\n\n## 1. Deduplication Mathematics: MinHash & Locality Sensitive Hashing (LSH)\n\nComparing all pairs in a dataset of $N = 10^8$ documents requires $\\binom{N}{2} = \\frac{N(N-1)}{2} \\approx 5 \\times 10^{15}$ comparisons, which is computationally intractable ($O(N^2)$). MinHash with LSH reduces this to **$O(N)$ linear time**.\n\n### 1.1 Jaccard Similarity on $k$-Shingles\nLet document $D$ be represented as a set of $k$-shingles (character or token $k$-grams) $S(D)$.  \nThe Jaccard Similarity between documents $A$ and $B$ is:\n\n$$ J(A, B) = \\frac{|S(A) \\cap S(B)|}{|S(A) \\cup S(B)|} \\in [0, 1] $$\n\n---\n\n### 1.2 The MinHash Theorem\n\nLet $\\pi$ be a random permutation of the universal vocabulary of shingles $\\mathcal{U}$.  \nDefine the MinHash function $h_\\pi(S) = \\min_{s \\in S} \\pi(s)$.\n\n#### Theorem:\n$$ \\mathbb{P}\\left[ h_\\pi(S(A)) = h_\\pi(S(B)) \\right] = J(A, B) $$\n\n#### Step-by-Step Proof:\nLet the universe of shingles $\\mathcal{U}$ be partitioned into three disjoint sets:\n1. $X$: Shingles present in both $A$ and $B$ ($S(A) \\cap S(B)$). $|X| = |S(A) \\cap S(B)|$.\n2. $Y$: Shingles present in $A$ but not $B$ ($S(A) \\setminus S(B)$).\n3. $Z$: Shingles present in $B$ but not $A$ ($S(B) \\setminus S(A)$).\n4. Shingles in neither $A$ nor $B$ do not affect $h_\\pi(S(A) \\cup S(B))$.\n\nThe union size is $|S(A) \\cup S(B)| = |X| + |Y| + |Z|$.  \nUnder a uniform random permutation $\\pi$, every element in $S(A) \\cup S(B)$ has an equal probability of being mapped to the minimum value.  \nThe event $h_\\pi(S(A)) = h_\\pi(S(B))$ occurs if and only if the minimum element in $S(A) \\cup S(B)$ falls into region $X$ (the intersection):\n$$ \\mathbb{P}\\left[ h_\\pi(S(A)) = h_\\pi(S(B)) \\right] = \\frac{|X|}{|X| + |Y| + |Z|} = \\frac{|S(A) \\cap S(B)|}{|S(A) \\cup S(B)|} = J(A, B) $$\n\n*Implication*: By computing $K$ independent MinHash functions $[h_1(A), \\dots, h_K(A)]$, the empirical fraction of matching hash values is an **unbiased estimator** of $J(A, B)$.\n\n---\n\n### 1.3 Locality Sensitive Hashing (LSH) S-Curve Analysis\n\nTo avoid all-to-all hash signature comparisons, we divide the $K$ hash values into $b$ bands of $r$ rows ($K = b \\cdot r$).\n\n```\nDocument Signature (K = b \u00b7 r hashes)\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510 \u2500\u2500\u2500 Band 1 (r hashes) \u2500\u2500\u2500\u25ba Hash to Bucket (exact match required)\n\u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524 \u2500\u2500\u2500 Band 2 (r hashes) \u2500\u2500\u2500\u25ba Hash to Bucket\n\u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524 \u2500\u2500\u2500 ...\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518 \u2500\u2500\u2500 Band b (r hashes) \u2500\u2500\u2500\u25ba Hash to Bucket\n```\n\nTwo documents $A$ and $B$ with Jaccard similarity $s = J(A, B)$ become candidate duplicates if they match in **at least one band**:\n1. Probability of all $r$ hashes matching in a single band: $s^r$\n2. Probability of not matching in a single band: $1 - s^r$\n3. Probability of not matching in all $b$ bands: $(1 - s^r)^b$\n4. Probability of matching in at least one band (Candidate Pair):\n   $$ \\mathbf{P(\\text{Candidate Pair}) = 1 - (1 - s^r)^b} $$\n\n```\n   P(Candidate)\n   1.0 \u253c               \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n       \u2502              /\n   0.5 \u253c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253c\u2500 (Threshold s*)\n       \u2502            /\n   0.0 \u253c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n       \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25ba Jaccard Similarity s\n                    s* = (1/b)^(1/r)\n```\n\n- **The Characteristic Threshold $s^*$**:\n  $$ 1 - (1 - (s^*)^r)^b = 0.5 \\implies (1 - (s^*)^r)^b = 0.5 \\implies s^* \\approx \\left(\\frac{1}{b}\\right)^{1/r} $$\n  *Example*: Setting $b = 20$ bands and $r = 5$ rows ($K = 100$ hashes) yields $s^* = (1/20)^{1/5} \\approx 0.549$. Pairs with similarity $> 0.7$ have $> 98\\%$ probability of collision, while pairs with $< 0.3$ similarity have $< 0.1\\%$ collision rate.\n\n---\n\n## 2. Model Collapse: The Information-Theoretic Hazard\n\n### 2.1 Mathematical Formulation of Model Collapse (Shumailov et al., 2024)\n\nConsider a recursive data flywheel where generation $n+1$ is trained exclusively on synthetic outputs produced by generation $n$:\n$$ P_{n+1}(x) = \\arg\\min_Q \\mathbb{D}_{\\text{KL}}\\left( \\hat{P}_n(x) \\parallel Q(x) \\right) $$\n\nLet the true data distribution be a Gaussian $P_0(x) = \\mathcal{N}(\\mu_0, \\sigma_0^2)$.  \nAt each generation $n$, the model samples a finite dataset $\\mathcal{D}_n = \\{x_1, \\dots, x_{M_n}\\} \\sim P_n(x)$ and fits parameters $\\mu_{n+1}, \\sigma_{n+1}^2$.\n\n#### Mean and Variance Dynamics:\n1. **Mean Drift**:\n   $$ \\mu_{n+1} = \\frac{1}{M_n} \\sum_{i=1}^{M_n} x_i \\implies \\mathbb{E}[\\mu_{n+1}] = \\mu_0, \\quad \\text{Var}(\\mu_n) = \\sigma_0^2 \\sum_{k=0}^{n-1} \\frac{1}{M_k} $$\n   As generations progress ($n \\to \\infty$), the variance of the estimated mean grows linearly with generation count: $\\text{Var}(\\mu_n) \\to \\infty$. The model drifts far away from the true distribution mean.\n\n2. **Variance Shrinkage & Tail Loss**:\n   $$ \\mathbb{E}[\\sigma_{n+1}^2] = \\sigma_n^2 \\left( 1 - \\frac{1}{M_n} \\right) = \\sigma_0^2 \\prod_{k=0}^n \\left( 1 - \\frac{1}{M_k} \\right) $$\n   As $n \\to \\infty$:\n   $$ \\lim_{n \\to \\infty} \\sigma_n^2 = 0 $$\n\n$$\\mathbf{\\lim_{n \\to \\infty} P_n(x) = \\delta(x - \\mu_\\infty)}$$\n\n**Conclusion**: The model distribution collapses to a **Dirac delta function (point mass)**. The model loses all linguistic and conceptual diversity, repeating only the most generic, high-probability tokens.\n\n---\n\n### 2.2 Mitigation: Anchored Synthetic Flywheels\nTo prevent model collapse:\n1. **Human Anchor**: Mix synthetic data with a fixed minimum fraction ($\\geq 20\\%$) of pristine human data.\n2. **Rejection Sampling / Verifiers**: Filter synthetic generation using deterministic code execution sandboxes or high-precision unit tests rather than raw unconditional generations.\n\n---\n\n## 3. Benchmark Decontamination Mathematics\n\nIf evaluation benchmark questions leak into the pre-training or fine-tuning corpus, evaluation benchmarks measure **memorization** rather than generalization.\n\n### 3.1 $N$-Gram Bloom Filter Decontamination\n\nGiven test benchmark documents $\\mathcal{D}_{\\text{eval}}$, extract all 13-token shingles $\\mathcal{S}_{\\text{eval}}$.  \nConstruct a **Bloom Filter** of $m$ bits and $k$ independent hash functions:\n$$ k = \\frac{m}{|S_{\\text{eval}}|} \\ln 2 $$\nThe theoretical False Positive Rate is:\n$$ p_{\\text{FP}} = \\left( 1 - e^{-k |S_{\\text{eval}}| / m} \\right)^k $$\n\nA training document $D_{\\text{train}}$ is flagged and removed if:\n$$ \\frac{|\\{s \\in S(D_{\\text{train}}) : s \\in \\text{BloomFilter}(\\mathcal{S}_{\\text{eval}})\\}|}{|S(D_{\\text{train}})|} > \\tau_{\\text{overlap}} \\quad (\\tau_{\\text{overlap}} = 0.05) $$\n\n---\n\n## 4. PyTorch & Python Implementation: MinHash LSH and Bloom Filter\n\n```python\nimport hashlib\nimport numpy as np\n\nclass MinHashLSH:\n    \"\"\"\n    MinHash with Locality Sensitive Hashing for document deduplication.\n    \"\"\"\n    def __init__(self, num_hashes: int = 100, num_bands: int = 20):\n        assert num_hashes % num_bands == 0\n        self.num_hashes = num_hashes\n        self.num_bands = num_bands\n        self.rows_per_band = num_hashes // num_bands\n        \n        # Random hash coefficients: (a * x + b) % prime\n        np.random.seed(42)\n        self.a = np.random.randint(1, 2**31 - 1, size=num_hashes, dtype=np.int64)\n        self.b = np.random.randint(0, 2**31 - 1, size=num_hashes, dtype=np.int64)\n        self.prime = 2147483647 # 2^31 - 1 (Mersenne prime)\n\n    def _get_shingle_hashes(self, text: str, k: int = 5) -> np.ndarray:\n        words = text.lower().split()\n        shingles = [\" \".join(words[i:i+k]) for i in range(max(1, len(words) - k + 1))]\n        hashes = np.array([int(hashlib.md5(s.encode('utf-8')).hexdigest()[:8], 16) for s in shingles], dtype=np.int64)\n        return hashes\n\n    def compute_minhash(self, text: str) -> np.ndarray:\n        shingle_hashes = self._get_shingle_hashes(text)\n        if len(shingle_hashes) == 0:\n            return np.zeros(self.num_hashes, dtype=np.int64)\n        \n        # Matrix multiply: (num_hashes, len(shingles))\n        all_hashes = (np.outer(self.a, shingle_hashes) + self.b[:, None]) % self.prime\n        return np.min(all_hashes, axis=1)\n\n    def get_band_buckets(self, signature: np.ndarray) -> list:\n        buckets = []\n        for i in range(self.num_bands):\n            start = i * self.rows_per_band\n            end = start + self.rows_per_band\n            band_slice = signature[start:end]\n            band_hash = hash(tuple(band_slice))\n            buckets.append((i, band_hash))\n        return buckets\n\nif __name__ == \"__main__\":\n    lsh = MinHashLSH(num_hashes=100, num_bands=20)\n    doc1 = \"The Transformer attention mechanism uses scaled dot product attention for language modeling.\"\n    doc2 = \"The Transformer attention mechanism uses scaled dot product attention for sequence modeling.\"\n    doc3 = \"Convolutional neural networks apply kernel filters over spatial image grids for computer vision.\"\n    \n    sig1 = lsh.compute_minhash(doc1)\n    sig2 = lsh.compute_minhash(doc2)\n    sig3 = lsh.compute_minhash(doc3)\n    \n    jaccard_1_2 = np.mean(sig1 == sig2)\n    jaccard_1_3 = np.mean(sig1 == sig3)\n    \n    print(f\"Estimated Jaccard(Doc1, Doc2): {jaccard_1_2:.2f} (Near Duplicate)\")\n    print(f\"Estimated Jaccard(Doc1, Doc3): {jaccard_1_3:.2f} (Dissimilar)\")\n```\n\n---\n\n## 5. Deep Interview Interrogation Ladder\n\n- **Level 1 (Concept)**: What is the Jaccard similarity between two sets of text shingles?\n- **Level 3 (Proof)**: Prove mathematically why the probability of two documents having identical MinHash values equals their exact Jaccard similarity.\n- **Level 5 (LSH Derivation)**: Derive the characteristic S-curve threshold $s^* = (1/b)^{1/r}$ in Locality Sensitive Hashing.\n- **Level 7 (Model Collapse)**: Explain mathematically why recursive training on synthetic data causes the variance of the learned distribution to converge to zero.\n- **Level 9 (Decontamination)**: Design a petabyte-scale deduplication and benchmark decontamination pipeline using PySpark, MinHash LSH, and Bloom Filters for a 15-trillion token pre-training run.\n- **Level 10 (Principal Engineering)**: You observe that after 3 iterations of fine-tuning an agent on its own tool-use trajectories, the model's tool error recovery rate drops from 85% to 20%. Diagnose the mathematical root cause and architect a closed-loop data flywheel that fixes it.\n", "html": "<h1>06_DATA_AND_SYNTHETIC_DATA \u2014 Mathematical &amp; Mechanistic Reference</h1>\n<blockquote>\n<p><strong>Audience</strong>: ML Engineers, LLM Systems Engineers, and AI Researchers preparing for senior/principal technical interviews.<br />\n<strong>Core Objective</strong>: Provide an exhaustive mathematical and algorithmic reference on data engineering for LLMs \u2014 covering MinHash LSH deduplication proofs, Model Collapse dynamics, decontamination metrics, synthetic data generation pipelines, and closed-loop production flywheels.</p>\n</blockquote>\n<hr />\n<h2>1. Deduplication Mathematics: MinHash &amp; Locality Sensitive Hashing (LSH)</h2>\n<p>Comparing all pairs in a dataset of <span class=\"katex-inline\">$N = 10^8$</span> documents requires <span class=\"katex-inline\">$\\binom{N}{2} = \\frac{N(N-1)}{2} \\approx 5 \\times 10^{15}$</span> comparisons, which is computationally intractable (<span class=\"katex-inline\">$O(N^2)$</span>). MinHash with LSH reduces this to <strong><span class=\"katex-inline\">$O(N)$</span> linear time</strong>.</p>\n<h3>1.1 Jaccard Similarity on <span class=\"katex-inline\">$k$</span>-Shingles</h3>\n<p>Let document <span class=\"katex-inline\">$D$</span> be represented as a set of <span class=\"katex-inline\">$k$</span>-shingles (character or token <span class=\"katex-inline\">$k$</span>-grams) <span class=\"katex-inline\">$S(D)$</span>.<br />\nThe Jaccard Similarity between documents <span class=\"katex-inline\">$A$</span> and <span class=\"katex-inline\">$B$</span> is:</p>\n<div class=\"katex-display\">$$J(A, B) = \\frac{|S(A) \\cap S(B)|}{|S(A) \\cup S(B)|} \\in [0, 1]$$</div>\n\n<hr />\n<h3>1.2 The MinHash Theorem</h3>\n<p>Let <span class=\"katex-inline\">$\\pi$</span> be a random permutation of the universal vocabulary of shingles <span class=\"katex-inline\">$\\mathcal{U}$</span>.<br />\nDefine the MinHash function <span class=\"katex-inline\">$h_\\pi(S) = \\min_{s \\in S} \\pi(s)$</span>.</p>\n<h4>Theorem:</h4>\n<div class=\"katex-display\">$$\\mathbb{P}\\left[ h_\\pi(S(A)) = h_\\pi(S(B)) \\right] = J(A, B)$$</div>\n\n<h4>Step-by-Step Proof:</h4>\n<p>Let the universe of shingles <span class=\"katex-inline\">$\\mathcal{U}$</span> be partitioned into three disjoint sets:<br />\n1. <span class=\"katex-inline\">$X$</span>: Shingles present in both <span class=\"katex-inline\">$A$</span> and <span class=\"katex-inline\">$B$</span> (<span class=\"katex-inline\">$S(A) \\cap S(B)$</span>). <span class=\"katex-inline\">$|X| = |S(A) \\cap S(B)|$</span>.<br />\n2. <span class=\"katex-inline\">$Y$</span>: Shingles present in <span class=\"katex-inline\">$A$</span> but not <span class=\"katex-inline\">$B$</span> (<span class=\"katex-inline\">$S(A) \\setminus S(B)$</span>).<br />\n3. <span class=\"katex-inline\">$Z$</span>: Shingles present in <span class=\"katex-inline\">$B$</span> but not <span class=\"katex-inline\">$A$</span> (<span class=\"katex-inline\">$S(B) \\setminus S(A)$</span>).<br />\n4. Shingles in neither <span class=\"katex-inline\">$A$</span> nor <span class=\"katex-inline\">$B$</span> do not affect <span class=\"katex-inline\">$h_\\pi(S(A) \\cup S(B))$</span>.</p>\n<p>The union size is <span class=\"katex-inline\">$|S(A) \\cup S(B)| = |X| + |Y| + |Z|$</span>.<br />\nUnder a uniform random permutation <span class=\"katex-inline\">$\\pi$</span>, every element in <span class=\"katex-inline\">$S(A) \\cup S(B)$</span> has an equal probability of being mapped to the minimum value.<br />\nThe event <span class=\"katex-inline\">$h_\\pi(S(A)) = h_\\pi(S(B))$</span> occurs if and only if the minimum element in <span class=\"katex-inline\">$S(A) \\cup S(B)$</span> falls into region <span class=\"katex-inline\">$X$</span> (the intersection):</p>\n<div class=\"katex-display\">$$\\mathbb{P}\\left[ h_\\pi(S(A)) = h_\\pi(S(B)) \\right] = \\frac{|X|}{|X| + |Y| + |Z|} = \\frac{|S(A) \\cap S(B)|}{|S(A) \\cup S(B)|} = J(A, B)$$</div>\n\n<p><em>Implication</em>: By computing <span class=\"katex-inline\">$K$</span> independent MinHash functions <span class=\"katex-inline\">$[h_1(A), \\dots, h_K(A)]$</span>, the empirical fraction of matching hash values is an <strong>unbiased estimator</strong> of <span class=\"katex-inline\">$J(A, B)$</span>.</p>\n<hr />\n<h3>1.3 Locality Sensitive Hashing (LSH) S-Curve Analysis</h3>\n<p>To avoid all-to-all hash signature comparisons, we divide the <span class=\"katex-inline\">$K$</span> hash values into <span class=\"katex-inline\">$b$</span> bands of <span class=\"katex-inline\">$r$</span> rows (<span class=\"katex-inline\">$K = b \\cdot r$</span>).</p>\n<pre><code>Document Signature (K = b \u00b7 r hashes)\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510 \u2500\u2500\u2500 Band 1 (r hashes) \u2500\u2500\u2500\u25ba Hash to Bucket (exact match required)\n\u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524 \u2500\u2500\u2500 Band 2 (r hashes) \u2500\u2500\u2500\u25ba Hash to Bucket\n\u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524 \u2500\u2500\u2500 ...\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518 \u2500\u2500\u2500 Band b (r hashes) \u2500\u2500\u2500\u25ba Hash to Bucket\n</code></pre>\n<p>Two documents <span class=\"katex-inline\">$A$</span> and <span class=\"katex-inline\">$B$</span> with Jaccard similarity <span class=\"katex-inline\">$s = J(A, B)$</span> become candidate duplicates if they match in <strong>at least one band</strong>:<br />\n1. Probability of all <span class=\"katex-inline\">$r$</span> hashes matching in a single band: <span class=\"katex-inline\">$s^r$</span><br />\n2. Probability of not matching in a single band: <span class=\"katex-inline\">$1 - s^r$</span><br />\n3. Probability of not matching in all <span class=\"katex-inline\">$b$</span> bands: <span class=\"katex-inline\">$(1 - s^r)^b$</span><br />\n4. Probability of matching in at least one band (Candidate Pair):<br />\n   <div class=\"katex-display\">$$\\mathbf{P(\\text{Candidate Pair}) = 1 - (1 - s^r)^b}$$</div>\n</p>\n<pre><code>   P(Candidate)\n   1.0 \u253c               \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n       \u2502              /\n   0.5 \u253c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253c\u2500 (Threshold s*)\n       \u2502            /\n   0.0 \u253c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n       \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25ba Jaccard Similarity s\n                    s* = (1/b)^(1/r)\n</code></pre>\n<ul>\n<li><strong>The Characteristic Threshold <span class=\"katex-inline\">$s^*$</span></strong>:<br />\n  <div class=\"katex-display\">$$1 - (1 - (s^*)^r)^b = 0.5 \\implies (1 - (s^*)^r)^b = 0.5 \\implies s^* \\approx \\left(\\frac{1}{b}\\right)^{1/r}$$</div></li>\n</ul>\n<p><em>Example</em>: Setting <span class=\"katex-inline\">$b = 20$</span> bands and <span class=\"katex-inline\">$r = 5$</span> rows (<span class=\"katex-inline\">$K = 100$</span> hashes) yields <span class=\"katex-inline\">$s^* = (1/20)^{1/5} \\approx 0.549$</span>. Pairs with similarity <span class=\"katex-inline\">$&gt; 0.7$</span> have <span class=\"katex-inline\">$&gt; 98\\%$</span> probability of collision, while pairs with <span class=\"katex-inline\">$&lt; 0.3$</span> similarity have <span class=\"katex-inline\">$&lt; 0.1\\%$</span> collision rate.</p>\n<hr />\n<h2>2. Model Collapse: The Information-Theoretic Hazard</h2>\n<h3>2.1 Mathematical Formulation of Model Collapse (Shumailov et al., 2024)</h3>\n<p>Consider a recursive data flywheel where generation <span class=\"katex-inline\">$n+1$</span> is trained exclusively on synthetic outputs produced by generation <span class=\"katex-inline\">$n$</span>:</p>\n<div class=\"katex-display\">$$P_{n+1}(x) = \\arg\\min_Q \\mathbb{D}_{\\text{KL}}\\left( \\hat{P}_n(x) \\parallel Q(x) \\right)$$</div>\n\n<p>Let the true data distribution be a Gaussian <span class=\"katex-inline\">$P_0(x) = \\mathcal{N}(\\mu_0, \\sigma_0^2)$</span>.<br />\nAt each generation <span class=\"katex-inline\">$n$</span>, the model samples a finite dataset <span class=\"katex-inline\">$\\mathcal{D}_n = \\{x_1, \\dots, x_{M_n}\\} \\sim P_n(x)$</span> and fits parameters <span class=\"katex-inline\">$\\mu_{n+1}, \\sigma_{n+1}^2$</span>.</p>\n<h4>Mean and Variance Dynamics:</h4>\n<ol>\n<li><strong>Mean Drift</strong>:<br />\n   <div class=\"katex-display\">$$\\mu_{n+1} = \\frac{1}{M_n} \\sum_{i=1}^{M_n} x_i \\implies \\mathbb{E}[\\mu_{n+1}] = \\mu_0, \\quad \\text{Var}(\\mu_n) = \\sigma_0^2 \\sum_{k=0}^{n-1} \\frac{1}{M_k}$$</div></li>\n</ol>\n<p>As generations progress (<span class=\"katex-inline\">$n \\to \\infty$</span>), the variance of the estimated mean grows linearly with generation count: <span class=\"katex-inline\">$\\text{Var}(\\mu_n) \\to \\infty$</span>. The model drifts far away from the true distribution mean.</p>\n<ol start=\"2\">\n<li><strong>Variance Shrinkage &amp; Tail Loss</strong>:<br />\n   <div class=\"katex-display\">$$\\mathbb{E}[\\sigma_{n+1}^2] = \\sigma_n^2 \\left( 1 - \\frac{1}{M_n} \\right) = \\sigma_0^2 \\prod_{k=0}^n \\left( 1 - \\frac{1}{M_k} \\right)$$</div></li>\n</ol>\n<p>As <span class=\"katex-inline\">$n \\to \\infty$</span>:<br />\n   <div class=\"katex-display\">$$\\lim_{n \\to \\infty} \\sigma_n^2 = 0$$</div>\n</p>\n<div class=\"katex-display\">$$\\mathbf{\\lim_{n \\to \\infty} P_n(x) = \\delta(x - \\mu_\\infty)}$$</div>\n\n<p><strong>Conclusion</strong>: The model distribution collapses to a <strong>Dirac delta function (point mass)</strong>. The model loses all linguistic and conceptual diversity, repeating only the most generic, high-probability tokens.</p>\n<hr />\n<h3>2.2 Mitigation: Anchored Synthetic Flywheels</h3>\n<p>To prevent model collapse:<br />\n1. <strong>Human Anchor</strong>: Mix synthetic data with a fixed minimum fraction (<span class=\"katex-inline\">$\\geq 20\\%$</span>) of pristine human data.<br />\n2. <strong>Rejection Sampling / Verifiers</strong>: Filter synthetic generation using deterministic code execution sandboxes or high-precision unit tests rather than raw unconditional generations.</p>\n<hr />\n<h2>3. Benchmark Decontamination Mathematics</h2>\n<p>If evaluation benchmark questions leak into the pre-training or fine-tuning corpus, evaluation benchmarks measure <strong>memorization</strong> rather than generalization.</p>\n<h3>3.1 <span class=\"katex-inline\">$N$</span>-Gram Bloom Filter Decontamination</h3>\n<p>Given test benchmark documents <span class=\"katex-inline\">$\\mathcal{D}_{\\text{eval}}$</span>, extract all 13-token shingles <span class=\"katex-inline\">$\\mathcal{S}_{\\text{eval}}$</span>.<br />\nConstruct a <strong>Bloom Filter</strong> of <span class=\"katex-inline\">$m$</span> bits and <span class=\"katex-inline\">$k$</span> independent hash functions:</p>\n<div class=\"katex-display\">$$k = \\frac{m}{|S_{\\text{eval}}|} \\ln 2$$</div>\n<p>The theoretical False Positive Rate is:</p>\n<div class=\"katex-display\">$$p_{\\text{FP}} = \\left( 1 - e^{-k |S_{\\text{eval}}| / m} \\right)^k$$</div>\n\n<p>A training document <span class=\"katex-inline\">$D_{\\text{train}}$</span> is flagged and removed if:</p>\n<div class=\"katex-display\">$$\\frac{|\\{s \\in S(D_{\\text{train}}) : s \\in \\text{BloomFilter}(\\mathcal{S}_{\\text{eval}})\\}|}{|S(D_{\\text{train}})|} &gt; \\tau_{\\text{overlap}} \\quad (\\tau_{\\text{overlap}} = 0.05)$$</div>\n\n<hr />\n<h2>4. PyTorch &amp; Python Implementation: MinHash LSH and Bloom Filter</h2>\n<pre><code class=\"language-python\">import hashlib\nimport numpy as np\n\nclass MinHashLSH:\n    &quot;&quot;&quot;\n    MinHash with Locality Sensitive Hashing for document deduplication.\n    &quot;&quot;&quot;\n    def __init__(self, num_hashes: int = 100, num_bands: int = 20):\n        assert num_hashes % num_bands == 0\n        self.num_hashes = num_hashes\n        self.num_bands = num_bands\n        self.rows_per_band = num_hashes // num_bands\n\n        # Random hash coefficients: (a * x + b) % prime\n        np.random.seed(42)\n        self.a = np.random.randint(1, 2**31 - 1, size=num_hashes, dtype=np.int64)\n        self.b = np.random.randint(0, 2**31 - 1, size=num_hashes, dtype=np.int64)\n        self.prime = 2147483647 # 2^31 - 1 (Mersenne prime)\n\n    def _get_shingle_hashes(self, text: str, k: int = 5) -&gt; np.ndarray:\n        words = text.lower().split()\n        shingles = [&quot; &quot;.join(words[i:i+k]) for i in range(max(1, len(words) - k + 1))]\n        hashes = np.array([int(hashlib.md5(s.encode('utf-8')).hexdigest()[:8], 16) for s in shingles], dtype=np.int64)\n        return hashes\n\n    def compute_minhash(self, text: str) -&gt; np.ndarray:\n        shingle_hashes = self._get_shingle_hashes(text)\n        if len(shingle_hashes) == 0:\n            return np.zeros(self.num_hashes, dtype=np.int64)\n\n        # Matrix multiply: (num_hashes, len(shingles))\n        all_hashes = (np.outer(self.a, shingle_hashes) + self.b[:, None]) % self.prime\n        return np.min(all_hashes, axis=1)\n\n    def get_band_buckets(self, signature: np.ndarray) -&gt; list:\n        buckets = []\n        for i in range(self.num_bands):\n            start = i * self.rows_per_band\n            end = start + self.rows_per_band\n            band_slice = signature[start:end]\n            band_hash = hash(tuple(band_slice))\n            buckets.append((i, band_hash))\n        return buckets\n\nif __name__ == &quot;__main__&quot;:\n    lsh = MinHashLSH(num_hashes=100, num_bands=20)\n    doc1 = &quot;The Transformer attention mechanism uses scaled dot product attention for language modeling.&quot;\n    doc2 = &quot;The Transformer attention mechanism uses scaled dot product attention for sequence modeling.&quot;\n    doc3 = &quot;Convolutional neural networks apply kernel filters over spatial image grids for computer vision.&quot;\n\n    sig1 = lsh.compute_minhash(doc1)\n    sig2 = lsh.compute_minhash(doc2)\n    sig3 = lsh.compute_minhash(doc3)\n\n    jaccard_1_2 = np.mean(sig1 == sig2)\n    jaccard_1_3 = np.mean(sig1 == sig3)\n\n    print(f&quot;Estimated Jaccard(Doc1, Doc2): {jaccard_1_2:.2f} (Near Duplicate)&quot;)\n    print(f&quot;Estimated Jaccard(Doc1, Doc3): {jaccard_1_3:.2f} (Dissimilar)&quot;)\n</code></pre>\n<hr />\n<h2>5. Deep Interview Interrogation Ladder</h2>\n<ul>\n<li><strong>Level 1 (Concept)</strong>: What is the Jaccard similarity between two sets of text shingles?</li>\n<li><strong>Level 3 (Proof)</strong>: Prove mathematically why the probability of two documents having identical MinHash values equals their exact Jaccard similarity.</li>\n<li><strong>Level 5 (LSH Derivation)</strong>: Derive the characteristic S-curve threshold <span class=\"katex-inline\">$s^* = (1/b)^{1/r}$</span> in Locality Sensitive Hashing.</li>\n<li><strong>Level 7 (Model Collapse)</strong>: Explain mathematically why recursive training on synthetic data causes the variance of the learned distribution to converge to zero.</li>\n<li><strong>Level 9 (Decontamination)</strong>: Design a petabyte-scale deduplication and benchmark decontamination pipeline using PySpark, MinHash LSH, and Bloom Filters for a 15-trillion token pre-training run.</li>\n<li><strong>Level 10 (Principal Engineering)</strong>: You observe that after 3 iterations of fine-tuning an agent on its own tool-use trajectories, the model's tool error recovery rate drops from 85% to 20%. Diagnose the mathematical root cause and architect a closed-loop data flywheel that fixes it.</li>\n</ul>"}, {"id": "08_GPU_AND_PERFORMANCE", "file": "08_GPU_AND_PERFORMANCE.md", "title": "GPU Architecture & FlashAttention-1/2/3", "priority": "P0", "phase": "Phase 4: Hardware & Inference", "content": "# 08_GPU_AND_PERFORMANCE \u2014 Mathematical & Bare-Metal Hardware Reference\n\n> **Audience**: ML Engineers, LLM Systems Engineers, and AI Researchers preparing for senior/principal technical interviews.  \n> **Core Objective**: Provide an exhaustive mathematical and microarchitectural bridge from physical NVIDIA GPU hardware (H100/A100) to PyTorch kernel execution \u2014 covering the Roofline model, SRAM tiling proofs in FlashAttention-1/2/3, Tensor Core MMA instructions, and memory bandwidth optimization.\n\n---\n\n## 1. NVIDIA GPU Architecture & Memory Hierarchy\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                          NVIDIA H100 GPU (Hopper)                           \u2502\n\u2502  132 Streaming Multiprocessors (SMs) | 80GB HBM3 (3.35 TB/s Bandwidth)       \u2502\n\u2502  Peak FP16 Tensor Core Compute: 989 TFLOPs (Dense) / 1,978 TFLOPs (Sparse
