)   \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                                      \u2502\n              \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n              \u25bc                                               \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510                   \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502     SM 0 (Streaming MP)   \u2502                   \u2502    SM 131 (Streaming MP)  \u2502\n\u2502 \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510 \u2502                   \u2502 \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510 \u2502\n\u2502 \u2502 256KB Register File   \u2502 \u2502                   \u2502 \u2502 256KB Register File   \u2502 \u2502\n\u2502 \u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524 \u2502                   \u2502 \u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524 \u2502\n\u2502 \u2502 228KB Shared Mem/SRAM \u2502 \u2502                   \u2502 \u2502 228KB Shared Mem/SRAM \u2502 \u2502\n\u2502 \u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524 \u2502                   \u2502 \u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524 \u2502\n\u2502 \u2502 4x 4th Gen Tensor Core\u2502 \u2502                   \u2502 \u2502 4x 4th Gen Tensor Core\u2502 \u2502\n\u2502 \u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524 \u2502                   \u2502 \u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524 \u2502\n\u2502 \u2502 4x Warp Schedulers    \u2502 \u2502                   \u2502 \u2502 4x Warp Schedulers    \u2502 \u2502\n\u2502 \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518 \u2502                   \u2502 \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518 \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518                   \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n              \u2502                                               \u2502\n              \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                                      \u25bc\n                  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n                  \u2502          50MB L2 Cache                \u2502\n                  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                                      \u25bc\n                  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n                  \u2502       80GB HBM3 Memory (3.35 TB/s)    \u2502\n                  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n### 1.1 Memory Hierarchy Latency & Bandwidth (NVIDIA H100 SXM5)\n\n| Memory Level | Location | Capacity | Latency | Bandwidth |\n| :--- | :--- | :--- | :--- | :--- |\n| **Registers** | On-Chip per SM | 256 KB per SM ($\\sim 33 \\text{ MB}$ total) | $\\sim 1$ cycle ($0.5 \\text{ ns}$) | $\\sim 30 \\text{ TB/s}$ aggregate |\n| **Shared Memory (SRAM)** | On-Chip per SM | Up to 228 KB per SM ($\\sim 30 \\text{ MB}$ total) | $\\sim 15-30$ cycles ($10 \\text{ ns}$) | $\\sim 15 \\text{ TB/s}$ aggregate |\n| **L2 Cache** | On-Chip global | 50 MB | $\\sim 100-200$ cycles ($50 \\text{ ns}$) | $\\sim 5.5 \\text{ TB/s}$ |\n| **High Bandwidth Memory (HBM3)** | Off-Chip package | 80 GB | $\\sim 400-800$ cycles ($200 \\text{ ns}$) | **3.35 TB/s** |\n| **Host RAM via PCIe Gen5 / NVLink** | Off-Board CPU | 512 GB - 2 TB | $\\sim 5,000$ cycles ($2 \\text{ }\\mu\\text{s}$) | $128 \\text{ GB/s (PCIe)} / 900 \\text{ GB/s (NVLink)}$ |\n\n*The Golden Rule of GPU Programming*: Reading from HBM is **$200\\times$ slower** than reading from Shared Memory (SRAM). Every unnecessary round-trip to HBM stalls the Streaming Multiprocessors.\n\n---\n\n## 2. The Roofline Model & Arithmetic Intensity\n\nThe **Roofline Model** determines whether a kernel is bounded by memory bandwidth or compute throughput.\n\n### 2.1 Arithmetic Intensity (AI)\n$$ \\text{Arithmetic Intensity (AI)} = \\frac{\\text{Total Floating Point Operations (FLOPs)}}{\\text{Total Memory Transferred from HBM (Bytes)}} \\quad \\left[ \\frac{\\text{FLOPs}}{\\text{Byte}} \\right] $$\n\n- **Attainable Performance ($P$)**:\n  $$ P = \\min\\left( P_{\\text{peak}}, \\; \\text{AI} \\times B_{\\text{peak}} \\right) \\quad [\\text{TFLOPs/s}] $$\n  Where:\n  - $P_{\\text{peak}}$ is the theoretical peak compute capacity (e.g. $989 \\text{ TFLOPs}$ for H100 FP16).\n  - $B_{\\text{peak}}$ is the peak memory bandwidth (e.g. $3.35 \\text{ TB/s}$ for H100 HBM3).\n\n- **The Critical Ridge Point ($I^*$)**:\n  $$ I^* = \\frac{P_{\\text{peak}}}{B_{\\text{peak}}} = \\frac{989 \\times 10^{12} \\text{ FLOPs/s}}{3.35 \\times 10^{12} \\text{ Bytes/s}} \\approx \\mathbf{295.2 \\text{ FLOPs/Byte}} $$\n\n```\n  Attainable Performance (TFLOPs/s)\n  989 \u253c                                     \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 (Compute Bound Peak)\n      \u2502                                    /\n      \u2502                                   /\n      \u2502                                  /\n      \u2502   Memory Bound Region           /\n      \u2502   Slope = Memory Bandwidth     /\n      \u2502                               /\n    0 \u253c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25ba Arithmetic Intensity (FLOPs/Byte)\n                                  I* = 295.2 FLOPs/Byte (Ridge Point)\n```\n\n### 2.2 Operational Regimes in Large Language Models:\n1. **Memory-Bound Regime ($\\text{AI} < I^* = 295$)**:\n   - **Autoregressive Decoding (Batch Size 1)**: For a 70B parameter model in FP16 ($140\\text{ GB}$ weights), generating 1 token requires loading $140\\text{ GB}$ to perform $2 \\times 70\\times 10^9 = 140\\text{ GFLOPs}$.  \n     $\\text{AI} = \\frac{140 \\times 10^9 \\text{ FLOPs}}{140 \\times 10^9 \\text{ Bytes}} = \\mathbf{1.0 \\text{ FLOP/Byte}} \\ll 295.2$.  \n     *Hardware Utilization*: The H100 achieves only $\\frac{1 \\times 3.35 \\text{ TB/s}}{989 \\text{ TFLOPs}} \\approx \\mathbf{0.34\\%}$ of its peak compute capacity!\n   - **Element-wise Kernels**: LayerNorm, RMSNorm, GeLU, Softmax, Residual addition ($\\text{AI} \\approx 0.25 - 2 \\text{ FLOPs/Byte}$).\n2. **Compute-Bound Regime ($\\text{AI} \\geq I^* = 295$)**:\n   - **Prefill Phase (Large Prompts)**: Processing a prompt of sequence length $S = 4096$ with batch size $B=8$.  \n     Matrix Multiply $X W$: $\\text{FLOPs} = 2 \\cdot B \\cdot S \\cdot d_{\\text{in}} \\cdot d_{\\text{out}}$.  \n     Memory read: $d_{\\text{in}} \\cdot d_{\\text{out}} \\times 2\\text{ bytes}$.  \n     $\\text{AI} = \\frac{2 \\cdot B \\cdot S \\cdot d^2}{2 \\cdot d^2} = B \\cdot S = 8 \\times 4096 = \\mathbf{32,768 \\text{ FLOPs/Byte}} \\gg 295.2$.  \n     *Hardware Utilization*: Tensor Cores operate at near 100% capacity ($> 80\\%$ MFU).\n\n---\n\n## 3. FlashAttention Mechanics: Mathematical SRAM Tiling\n\n### 3.1 The Standard Attention Memory Wall\nStandard PyTorch Attention computes:\n$$ S = Q K^T \\in \\mathbb{R}^{N \\times N}, \\quad P = \\text{Softmax}(S) \\in \\mathbb{R}^{N \\times N}, \\quad O = P V \\in \\mathbb{R}^{N \\times d} $$\n- **HBM Round-Trips**: Writes intermediate $N \\times N$ matrices $S$ and $P$ to off-chip HBM, then reads them back to compute $P V$.\n- **HBM Memory Access Complexity**: $O(N d + N^2)$ bytes transferred. For sequence length $N = 64\\text{k}$, $N^2 = 4.096 \\times 10^9$ elements ($8.2\\text{ GB}$ of VRAM per attention head just for attention scores!).\n\n---\n\n### 3.2 Online Softmax Normalization (Milakov & Gimelshtein / Rabe & Staats)\n\nTo compute attention in small SRAM blocks without materializing the $N \\times N$ matrix in HBM, we must maintain running softmax normalizers across split chunks.\n\nLet a vector $x \\in \\mathbb{R}^N$ be split into two blocks $x^{(1)}, x^{(2)} \\in \\mathbb{R}^{N/2}$.  \nLet local maximums and normalizers be:\n$$ m^{(1)} = \\max_i x_i^{(1)}, \\quad l^{(1)} = \\sum_i e^{x_i^{(1)} - m^{(1)}} $$\n$$ m^{(2)} = \\max_i x_i^{(2)}, \\quad l^{(2)} = \\sum_i e^{x_i^{(2)} - m^{(2)}} $$\n\nThe global maximum and combined normalizer are:\n$$ m = \\max(m^{(1)}, m^{(2)}) $$\n$$ l = e^{m^{(1)} - m} l^{(1)} + e^{m^{(2)} - m} l^{(2)} $$\n\n#### Incremental Output Aggregation Update Formula:\nLet $O^{(1)} = \\sum_j \\frac{e^{x_j^{(1)} - m^{(1)}}}{l^{(1)}} V_j^{(1)}$. When combining with block 2:\n\n$$ \\mathbf{O = \\frac{l^{(1)} e^{m^{(1)} - m}}{l} O^{(1)} + \\frac{e^{m^{(2)} - m}}{l} \\left( \\sum_j e^{x_j^{(2)} - m^{(2)}} V_j^{(2)} \\right)} $$\n\n---\n\n### 3.3 FlashAttention Tiling Algorithm & IO Complexity Proof\n\n```\nHigh Bandwidth Memory (HBM)\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502  Q (N x d)        K (N x d)        V (N x d)           \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                        \u2502 Block Tiling (Load B_r, B_c into SRAM)\n                        \u25bc\nStreaming Multiprocessor SRAM (Fast On-Chip Memory: ~228KB)\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502  Q_i (B_r x d)   x   K_j^T (d x B_c)  \u2500\u2500\u25ba S_ij (B_r x B_c)\u2502\n\u2502  Online Softmax Accumulation in Registers               \u2502\n\u2502  O_i = Rescale(O_prev) + P_ij \u00b7 V_j                    \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                        \u2502 Write final output block directly to HBM\n                        \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502  O (N x d) in HBM (Zero N x N Intermediate Matrices!)  \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\nLet SRAM capacity be $M$ bytes. Block sizes are chosen such that $B_c, B_r \\approx \\Theta\\left(\\frac{M}{d}\\right)$.\n- **Outer Loop**: Iterate over blocks of $K, V$ of size $B_c \\times d$ (loaded into SRAM once).\n- **Inner Loop**: Iterate over blocks of $Q$ of size $B_r \\times d$, update local output $O_i$ in registers, and write back only the final $N \\times d$ output to HBM.\n\n#### IO Complexity Proof (Dao et al., 2022):\n- Standard Attention Memory IO: $\\Theta(N d + N^2)$ accesses to HBM.\n- FlashAttention Memory IO: $\\Theta\\left(\\frac{N^2 d^2}{M}\\right)$ accesses to HBM.\n- For typical SRAM size $M \\approx 100\\text{KB}$ and $d = 128$: FlashAttention requires **$10\\times$ to $20\\times$ fewer HBM accesses**, achieving a **$3\\times - 5\\times$ end-to-end wall-clock speedup**.\n\n---\n\n### 3.4 FlashAttention-3 Innovations (Hopper H100 Architecture)\n\n1. **Warp Specialization**: Divides SM warps into **Producer Warps** (loading data from HBM to Shared Memory via asynchronous TMA instructions) and **Consumer Warps** (executing Tensor Core MMA instructions without waiting on memory barriers).\n2. **Ping-Pong Buffering**: Overlaps GEMM computation of block $k$ with asynchronous memory copy of block $k+1$.\n3. **FP8 Tensor Core GEMMs**: Leverages FP8 low-precision arithmetic with block quantization, doubling theoretical peak compute to $1.98 \\text{ PFLOPs/s}$.\n\n---\n\n## 4. CUDA Execution Mechanics: Warps, Divergence & Bank Conflicts\n\n### 4.1 Warps and SIMT Execution\nOn NVIDIA GPUs, threads are grouped into **Warps of 32 threads**. All 32 threads in a warp execute the exact same instruction at the same clock cycle in a Single Instruction, Multiple Threads (SIMT) fashion.\n\n- **Warp Divergence Penalty**:\n  ```cuda\n  if (threadIdx.x % 2 == 0) {\n      // Path A (16 threads active, 16 threads masked/idle)\n  } else {\n      // Path B (16 threads active, 16 threads masked/idle)\n  }\n  ```\n  *Cost*: Total execution time = $\\text{Time}(\\text{Path A}) + \\text{Time}(\\text{Path B})$. Effective compute throughput drops by $50\\%$.\n\n---\n\n### 4.2 Shared Memory Bank Conflicts\n\nShared memory (SRAM) is organized into **32 independent banks** (each 4 bytes wide).  \nSuccessive 32-bit words are assigned to successive banks: $\\text{Bank Index} = (\\text{Byte Address} / 4) \\pmod{32}$.\n\n```\nBank 0    Bank 1    Bank 2   ...  Bank 31\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510 \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510 \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510     \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 Word 0\u2502 \u2502 Word 1\u2502 \u2502 Word 2\u2502 ... \u2502Word 31\u2502  <-- Threads 0..31 access words 0..31 (0 conflicts: 1 cycle)\n\u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524 \u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524 \u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524     \u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502Word 32\u2502 \u2502Word 33\u2502 \u2502Word 34\u2502 ... \u2502Word 63\u2502  <-- Threads 0..31 access words 0, 2, 4.. (2-way conflict: 2 cycles)\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518 \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518 \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518     \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n- **Conflict-Free Access**: All 32 threads in a warp access distinct banks in parallel (serviced in 1 cycle).\n- **$k$-Way Bank Conflict**: If $k$ threads in the same warp request distinct addresses belonging to the *same bank*, the requests are serialized, taking **$k$ clock cycles**.\n- **Padding Solution**: Pad 2D shared memory arrays (e.g. `__shared__ float smem[32][33]` instead of `[32][32]`) to skew row strides and eliminate bank collisions.\n\n---\n\n## 5. Python / Triton Implementation: Online Softmax Attention Block\n\n```python\nimport torch\nimport math\n\ndef online_softmax_reference(Q: torch.Tensor, K: torch.Tensor, V: torch.Tensor, block_size: int = 16) -> torch.Tensor:\n    \"\"\"\n    Step-by-step Python simulation of FlashAttention's Online Softmax Tiling.\n    Q, K, V: [Seq_Len, d_head]\n    \"\"\"\n    S, D = Q.shape\n    scale = 1.0 / math.sqrt(D)\n    O = torch.zeros_like(Q)\n    \n    # Running statistics per row\n    running_max = torch.full((S,), float('-inf'), device=Q.device)\n    running_sum = torch.zeros(S, device=Q.device)\n\n    # Outer loop: Iterate over K, V blocks (simulating loading into SRAM)\n    for j_start in range(0, S, block_size):\n        j_end = min(j_start + block_size, S)\n        K_j = K[j_start:j_end] # [B_c, D]\n        V_j = V[j_start:j_end] # [B_c, D]\n\n        # Inner loop: Iterate over Q blocks\n        for i_start in range(0, S, block_size):\n            i_end = min(i_start + block_size, S)\n            Q_i = Q[i_start:i_end] # [B_r, D]\n\n            # Compute block dot products: [B_r, B_c]\n            S_ij = torch.matmul(Q_i, K_j.t()) * scale\n            \n            # Causal mask for the block\n            for r in range(i_start, i_end):\n                for c in range(j_start, j_end):\n                    if c > r:\n                        S_ij[r - i_start, c - j_start] = float('-inf')\n\n            # Local block maximum & exponential sums\n            block_max, _ = torch.max(S_ij, dim=-1)\n            new_max = torch.maximum(running_max[i_start:i_end], block_max)\n            \n            # Rescaling factors\n            alpha = torch.exp(running_max[i_start:i_end] - new_max)\n            P_ij = torch.exp(S_ij - new_max.unsqueeze(-1))\n            P_ij = torch.nan_to_num(P_ij, nan=0.0)\n            \n            # Update running normalizer\n            new_sum = running_sum[i_start:i_end] * alpha + P_ij.sum(dim=-1)\n\n            # Incremental output update\n            O_prev = O[i_start:i_end]\n            O_block = torch.matmul(P_ij, V_j)\n            \n            # Rescale previous output and accumulate\n            O[i_start:i_end] = (O_prev * (running_sum[i_start:i_end] * alpha).unsqueeze(-1) + O_block) / (new_sum.unsqueeze(-1) + 1e-8)\n            \n            running_max[i_start:i_end] = new_max\n            running_sum[i_start:i_end] = new_sum\n\n    return O\n\nif __name__ == \"__main__\":\n    S, D = 64, 32\n    q, k, v = torch.randn(S, D), torch.randn(S, D), torch.randn(S, D)\n    out_online = online_softmax_reference(q, k, v, block_size=16)\n    \n    # Standard Attention Baseline\n    scores = torch.matmul(q, k.t()) / math.sqrt(D)\n    mask = torch.triu(torch.full((S, S), float('-inf')), diagonal=1)\n    weights = torch.softmax(scores + mask, dim=-1)\n    weights = torch.nan_to_num(weights, nan=0.0)\n    out_standard = torch.matmul(weights, v)\n    \n    assert torch.allclose(out_online, out_standard, atol=1e-4), \"Online softmax mismatch with standard attention!\"\n    print(\"Online Softmax mathematical tiling verified successfully.\")\n```\n\n---\n\n## 6. Deep Interview Interrogation Ladder\n\n- **Level 1 (Concept)**: What is the primary difference between memory-bound and compute-bound operations?\n- **Level 3 (Roofline)**: Calculate the arithmetic intensity of autoregressive token generation for a 70B parameter model at batch size 1, and explain why GPU compute utilization is $< 1\\%$.\n- **Level 5 (Hardware)**: What is a Shared Memory Bank Conflict, and how does array padding resolve it?\n- **Level 7 (Derivation)**: Derive the incremental output update formula in FlashAttention's online softmax algorithm when combining two disjoint blocks.\n- **Level 9 (Microarchitecture)**: Explain how FlashAttention-3 leverages TMA (Tensor Memory Accelerator) and Warp Specialization on NVIDIA Hopper GPUs to achieve asynchronous memory-compute overlap.\n- **Level 10 (Principal Engineering)**: You are tasked with optimizing a custom mixture-of-experts model on an 8xH100 node. All-to-All communication between GPUs is stalling SM execution. Walk through how you would trace the bottleneck using NVIDIA Nsight Systems (`nsys`) and re-architect the dispatch kernel to overlap computation with NVLink transfers.\n", "html": "<h1>08_GPU_AND_PERFORMANCE \u2014 Mathematical &amp; Bare-Metal Hardware Reference</h1>\n<blockquote>\n<p><strong>Audience</strong>: ML Engineers, LLM Systems Engineers, and AI Researchers preparing for senior/principal technical interviews.<br />\n<strong>Core Objective</strong>: Provide an exhaustive mathematical and microarchitectural bridge from physical NVIDIA GPU hardware (H100/A100) to PyTorch kernel execution \u2014 covering the Roofline model, SRAM tiling proofs in FlashAttention-1/2/3, Tensor Core MMA instructions, and memory bandwidth optimization.</p>\n</blockquote>\n<hr />\n<h2>1. NVIDIA GPU Architecture &amp; Memory Hierarchy</h2>\n<pre><code>\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                          NVIDIA H100 GPU (Hopper)                           \u2502\n\u2502  132 Streaming Multiprocessors (SMs) | 80GB HBM3 (3.35 TB/s Bandwidth)       \u2502\n\u2502  Peak FP16 Tensor Core Compute: 989 TFLOPs (Dense) / 1,978 TFLOPs (Sparse)   \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                                      \u2502\n              \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n              \u25bc                                               \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510                   \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502     SM 0 (Streaming MP)   \u2502                   \u2502    SM 131 (Streaming MP)  \u2502\n\u2502 \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510 \u2502                   \u2502 \u250c\u2500\u2500\u2500\u2500\u25 514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518                   \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n              \u2502                                               \u2502\n              \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                                      \u25bc\n                  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n                  \u2502          50MB L2 Cache                \u2502\n                  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                                      \u25bc\n                  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n                  \u2502       80GB HBM3 Memory (3.35 TB/s)    \u2502\n                  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n</code></pre>\n<h3>1.1 Memory Hierarchy Latency &amp; Bandwidth (NVIDIA H100 SXM5)</h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">Memory Level</th>\n<th style=\"text-align: left;\">Location</th>\n<th style=\"text-align: left;\">Capacity</th>\n<th style=\"text-align: left;\">Latency</th>\n<th style=\"text-align: left;\">Bandwidth</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>Registers</strong></td>\n<td style=\"text-align: left;\">On-Chip per SM</td>\n<td style=\"text-align: left;\">256 KB per SM (<span class=\"katex-inline\">$\\sim 33 \\text{ MB}$</span> total)</td>\n<td style=\"text-align: left;\"><span class=\"katex-inline\">$\\sim 1$</span> cycle (<span class=\"katex-inline\">$0.5 \\text{ ns}$</span>)</td>\n<td style=\"text-align: left;\"><span class=\"katex-inline\">$\\sim 30 \\text{ TB/s}$</span> aggregate</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Shared Memory (SRAM)</strong></td>\n<td style=\"text-align: left;\">On-Chip per SM</td>\n<td style=\"text-align: left;\">Up to 228 KB per SM (<span class=\"katex-inline\">$\\sim 30 \\text{ MB}$</span> total)</td>\n<td style=\"text-align: left;\"><span class=\"katex-inline\">$\\sim 15-30$</span> cycles (<span class=\"katex-inline\">$10 \\text{ ns}$</span>)</td>\n<td style=\"text-align: left;\"><span class=\"katex-inline\">$\\sim 15 \\text{ TB/s}$</span> aggregate</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>L2 Cache</strong></td>\n<td style=\"text-align: left;\">On-Chip global</td>\n<td style=\"text-align: left;\">50 MB</td>\n<td style=\"text-align: left;\"><span class=\"katex-inline\">$\\sim 100-200$</span> cycles (<span class=\"katex-inline\">$50 \\text{ ns}$</span>)</td>\n<td style=\"text-align: left;\"><span class=\"katex-inline\">$\\sim 5.5 \\text{ TB/s}$</span></td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>High Bandwidth Memory (HBM3)</strong></td>\n<td style=\"text-align: left;\">Off-Chip package</td>\n<td style=\"text-align: left;\">80 GB</td>\n<td style=\"text-align: left;\"><span class=\"katex-inline\">$\\sim 400-800$</span> cycles (<span class=\"katex-inline\">$200 \\text{ ns}$</span>)</td>\n<td style=\"text-align: left;\"><strong>3.35 TB/s</strong></td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Host RAM via PCIe Gen5 / NVLink</strong></td>\n<td style=\"text-align: left;\">Off-Board CPU</td>\n<td style=\"text-align: left;\">512 GB - 2 TB</td>\n<td style=\"text-align: left;\"><span class=\"katex-inline\">$\\sim 5,000$</span> cycles (<span class=\"katex-inline\">$2 \\text{ }\\mu\\text{s}$</span>)</td>\n<td style=\"text-align: left;\"><span class=\"katex-inline\">$128 \\text{ GB/s (PCIe)} / 900 \\text{ GB/s (NVLink)}$</span></td>\n</tr>\n</tbody>\n</table>\n<p><em>The Golden Rule of GPU Programming</em>: Reading from HBM is <strong><span class=\"katex-inline\">$200\\times$</span> slower</strong> than reading from Shared Memory (SRAM). Every unnecessary round-trip to HBM stalls the Streaming Multiprocessors.</p>\n<hr />\n<h2>2. The Roofline Model &amp; Arithmetic Intensity</h2>\n<p>The <strong>Roofline Model</strong> determines whether a kernel is bounded by memory bandwidth or compute throughput.</p>\n<h3>2.1 Arithmetic Intensity (AI)</h3>\n<div class=\"katex-display\">$$\\text{Arithmetic Intensity (AI)} = \\frac{\\text{Total Floating Point Operations (FLOPs)}}{\\text{Total Memory Transferred from HBM (Bytes)}} \\quad \\left[ \\frac{\\text{FLOPs}}{\\text{Byte}} \\right]$$</div>\n\n<ul>\n<li><strong>Attainable Performance (<span class=\"katex-inline\">$P$</span>)</strong>:<br />\n  <div class=\"katex-display\">$$P = \\min\\left( P_{\\text{peak}}, \\; \\text{AI} \\times B_{\\text{peak}} \\right) \\quad [\\text{TFLOPs/s}]$$</div></li>\n</ul>\n<p>Where:<br />\n  - <span class=\"katex-inline\">$P_{\\text{peak}}$</span> is the theoretical peak compute capacity (e.g. <span class=\"katex-inline\">$989 \\text{ TFLOPs}$</span> for H100 FP16).<br />\n  - <span class=\"katex-inline\">$B_{\\text{peak}}$</span> is the peak memory bandwidth (e.g. <span class=\"katex-inline\">$3.35 \\text{ TB/s}$</span> for H100 HBM3).</p>\n<ul>\n<li><strong>The Critical Ridge Point (<span class=\"katex-inline\">$I^*$</span>)</strong>:<br />\n  <div class=\"katex-display\">$$I^* = \\frac{P_{\\text{peak}}}{B_{\\text{peak}}} = \\frac{989 \\times 10^{12} \\text{ FLOPs/s}}{3.35 \\times 10^{12} \\text{ Bytes/s}} \\approx \\mathbf{295.2 \\text{ FLOPs/Byte}}$$</div>\n</li>\n</ul>\n<pre><code>  Attainable Performance (TFLOPs/s)\n  989 \u253c                                     \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 (Compute Bound Peak)\n      \u2502                                    /\n      \u2502                                   /\n      \u2502                                  /\n      \u2502   Memory Bound Region           /\n      \u2502   Slope = Memory Bandwidth     /\n      \u2502                               /\n    0 \u253c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25ba Arithmetic Intensity (FLOPs/Byte)\n                                  I* = 295.2 FLOPs/Byte (Ridge Point)\n</code></pre>\n<h3>2.2 Operational Regimes in Large Language Models:</h3>\n<ol>\n<li><strong>Memory-Bound Regime (<span class=\"katex-inline\">$\\text{AI} &lt; I^* = 295$</span>)</strong>:<br />\n   - <strong>Autoregressive Decoding (Batch Size 1)</strong>: For a 70B parameter model in FP16 (<span class=\"katex-inline\">$140\\text{ GB}$</span> weights), generating 1 token requires loading <span class=\"katex-inline\">$140\\text{ GB}$</span> to perform <span class=\"katex-inline\">$2 \\times 70\\times 10^9 = 140\\text{ GFLOPs}$</span>.<br />\n     <span class=\"katex-inline\">$\\text{AI} = \\frac{140 \\times 10^9 \\text{ FLOPs}}{140 \\times 10^9 \\text{ Bytes}} = \\mathbf{1.0 \\text{ FLOP/Byte}} \\ll 295.2$</span>.<br />\n<em>Hardware Utilization</em>: The H100 achieves only <span class=\"katex-inline\">$\\frac{1 \\times 3.35 \\text{ TB/s}}{989 \\text{ TFLOPs}} \\approx \\mathbf{0.34\\%}$</span> of its peak compute capacity!<br />\n   - <strong>Element-wise Kernels</strong>: LayerNorm, RMSNorm, GeLU, Softmax, Residual addition (<span class=\"katex-inline\">$\\text{AI} \\approx 0.25 - 2 \\text{ FLOPs/Byte}$</span>).</li>\n<li><strong>Compute-Bound Regime (<span class=\"katex-inline\">$\\text{AI} \\geq I^* = 295$</span>)</strong>:<br />\n   - <strong>Prefill Phase (Large Prompts)</strong>: Processing a prompt of sequence length <span class=\"katex-inline\">$S = 4096$</span> with batch size <span class=\"katex-inline\">$B=8$</span>.<br />\n     Matrix Multiply <span class=\"katex-inline\">$X W$</span>: <span class=\"katex-inline\">$\\text{FLOPs} = 2 \\cdot B \\cdot S \\cdot d_{\\text{in}} \\cdot d_{\\text{out}}$</span>.<br />\n     Memory read: <span class=\"katex-inline\">$d_{\\text{in}} \\cdot d_{\\text{out}} \\times 2\\text{ bytes}$</span>.<br />\n     <span class=\"katex-inline\">$\\text{AI} = \\frac{2 \\cdot B \\cdot S \\cdot d^2}{2 \\cdot d^2} = B \\cdot S = 8 \\times 4096 = \\mathbf{32,768 \\text{ FLOPs/Byte}} \\gg 295.2$</span>.<br />\n<em>Hardware Utilization</em>: Tensor Cores operate at near 100% capacity (<span class=\"katex-inline\">$&gt; 80\\%$</span> MFU).</li>\n</ol>\n<hr />\n<h2>3. FlashAttention Mechanics: Mathematical SRAM Tiling</h2>\n<h3>3.1 The Standard Attention Memory Wall</h3>\n<p>Standard PyTorch Attention computes:</p>\n<div class=\"katex-display\">$$S = Q K^T \\in \\mathbb{R}^{N \\times N}, \\quad P = \\text{Softmax}(S) \\in \\mathbb{R}^{N \\times N}, \\quad O = P V \\in \\mathbb{R}^{N \\times d}$$</div>\n<ul>\n<li><strong>HBM Round-Trips</strong>: Writes intermediate <span class=\"katex-inline\">$N \\times N$</span> matrices <span class=\"katex-inline\">$S$</span> and <span class=\"katex-inline\">$P$</span> to off-chip HBM, then reads them back to compute <span class=\"katex-inline\">$P V$</span>.</li>\n<li><strong>HBM Memory Access Complexity</strong>: <span class=\"katex-inline\">$O(N d + N^2)$</span> bytes transferred. For sequence length <span class=\"katex-inline\">$N = 64\\text{k}$</span>, <span class=\"katex-inline\">$N^2 = 4.096 \\times 10^9$</span> elements (<span class=\"katex-inline\">$8.2\\text{ GB}$</span> of VRAM per attention head just for attention scores!).</li>\n</ul>\n<hr />\n<h3>3.2 Online Softmax Normalization (Milakov &amp; Gimelshtein / Rabe &amp; Staats)</h3>\n<p>To compute attention in small SRAM blocks without materializing the <span class=\"katex-inline\">$N \\times N$</span> matrix in HBM, we must maintain running softmax normalizers across split chunks.</p>\n<p>Let a vector <span class=\"katex-inline\">$x \\in \\mathbb{R}^N$</span> be split into two blocks <span class=\"katex-inline\">$x^{(1)}, x^{(2)} \\in \\mathbb{R}^{N/2}$</span>.<br />\nLet local maximums and normalizers be:</p>\n<div class=\"katex-display\">$$m^{(1)} = \\max_i x_i^{(1)}, \\quad l^{(1)} = \\sum_i e^{x_i^{(1)} - m^{(1)}}$$</div>\n<div class=\"katex-display\">$$m^{(2)} = \\max_i x_i^{(2)}, \\quad l^{(2)} = \\sum_i e^{x_i^{(2)} - m^{(2)}}$$</div>\n\n<p>The global maximum and combined normalizer are:</p>\n<div class=\"katex-display\">$$m = \\max(m^{(1)}, m^{(2)})$$</div>\n<div class=\"katex-display\">$$l = e^{m^{(1)} - m} l^{(1)} + e^{m^{(2)} - m} l^{(2)}$$</div>\n\n<h4>Incremental Output Aggregation Update Formula:</h4>\n<p>Let <span class=\"katex-inline\">$O^{(1)} = \\sum_j \\frac{e^{x_j^{(1)} - m^{(1)}}}{l^{(1)}} V_j^{(1)}$</span>. When combining with block 2:</p>\n<div class=\"katex-display\">$$\\mathbf{O = \\frac{l^{(1)} e^{m^{(1)} - m}}{l} O^{(1)} + \\frac{e^{m^{(2)} - m}}{l} \\left( \\sum_j e^{x_j^{(2)} - m^{(2)}} V_j^{(2)} \\right)}$$</div>\n\n<hr />\n<h3>3.3 FlashAttention Tiling Algorithm &amp; IO Complexity Proof</h3>\n<pre><code>High Bandwidth Memory (HBM)\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502  Q (N x d)        K (N x d)        V (N x d)           \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                        \u2502 Block Tiling (Load B_r, B_c into SRAM)\n                        \u25bc\nStreaming Multiprocessor SRAM (Fast On-Chip Memory: ~228KB)\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502  Q_i (B_r x d)   x   K_j^T (d x B_c)  \u2500\u2500\u25ba S_ij (B_r x B_c)\u2502\n\u2502  Online Softmax Accumulation in Registers               \u2502\n\u2502  O_i = Rescale(O_prev) + P_ij \u00b7 V_j                    \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                        \u2502 Write final output block directly to HBM\n                        \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502  O (N x d) in HBM (Zero N x N Intermediate Matrices!)  \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n</code></pre>\n<p>Let SRAM capacity be <span class=\"katex-inline\">$M$</span> bytes. Block sizes are chosen such that <span class=\"katex-inline\">$B_c, B_r \\approx \\Theta\\left(\\frac{M}{d}\\right)$</span>.<br />\n- <strong>Outer Loop</strong>: Iterate over blocks of <span class=\"katex-inline\">$K, V$</span> of size <span class=\"katex-inline\">$B_c \\times d$</span> (loaded into SRAM once).<br />\n- <strong>Inner Loop</strong>: Iterate over blocks of <span class=\"katex-inline\">$Q$</span> of size <span class=\"katex-inline\">$B_r \\times d$</span>, update local output <span class=\"katex-inline\">$O_i$</span> in registers, and write back only the final <span class=\"katex-inline\">$N \\times d$</span> output to HBM.</p>\n<h4>IO Complexity Proof (Dao et al., 2022):</h4>\n<ul>\n<li>Standard Attention Memory IO: <span class=\"katex-inline\">$\\Theta(N d + N^2)$</span> accesses to HBM.</li>\n<li>FlashAttention Memory IO: <span class=\"katex-inline\">$\\Theta\\left(\\frac{N^2 d^2}{M}\\right)$</span> accesses to HBM.</li>\n<li>For typical SRAM size <span class=\"katex-inline\">$M \\approx 100\\text{KB}$</span> and <span class=\"katex-inline\">$d = 128$</span>: FlashAttention requires <strong><span class=\"katex-inline\">$10\\times$</span> to <span class=\"katex-inline\">$20\\times$</span> fewer HBM accesses</strong>, achieving a <strong><span class=\"katex-inline\">$3\\times - 5\\times$</span> end-to-end wall-clock speedup</strong>.</li>\n</ul>\n<hr />\n<h3>3.4 FlashAttention-3 Innovations (Hopper H100 Architecture)</h3>\n<ol>\n<li><strong>Warp Specialization</strong>: Divides SM warps into <strong>Producer Warps</strong> (loading data from HBM to Shared Memory via asynchronous TMA instructions) and <strong>Consumer Warps</strong> (executing Tensor Core MMA instructions without waiting on memory barriers).</li>\n<li><strong>Ping-Pong Buffering</strong>: Overlaps GEMM computation of block <span class=\"katex-inline\">$k$</span> with asynchronous memory copy of block <span class=\"katex-inline\">$k+1$</span>.</li>\n<li><strong>FP8 Tensor Core GEMMs</strong>: Leverages FP8 low-precision arithmetic with block quantization, doubling theoretical peak compute to <span class=\"katex-inline\">$1.98 \\text{ PFLOPs/s}$</span>.</li>\n</ol>\n<hr />\n<h2>4. CUDA Execution Mechanics: Warps, Divergence &amp; Bank Conflicts</h2>\n<h3>4.1 Warps and SIMT Execution</h3>\n<p>On NVIDIA GPUs, threads are grouped into <strong>Warps of 32 threads</strong>. All 32 threads in a warp execute the exact same instruction at the same clock cycle in a Single Instruction, Multiple Threads (SIMT) fashion.</p>\n<ul>\n<li><strong>Warp Divergence Penalty</strong>:<br />\n<code>cuda\n  if (threadIdx.x % 2 == 0) {\n      // Path A (16 threads active, 16 threads masked/idle)\n  } else {\n      // Path B (16 threads active, 16 threads masked/idle)\n  }</code><br />\n<em>Cost</em>: Total execution time = <span class=\"katex-inline\">$\\text{Time}(\\text{Path A}) + \\text{Time}(\\text{Path B})$</span>. Effective compute throughput drops by <span class=\"katex-inline\">$50\\%$</span>.</li>\n</ul>\n<hr />\n<h3>4.2 Shared Memory Bank Conflicts</h3>\n<p>Shared memory (SRAM) is organized into <strong>32 independent banks</strong> (each 4 bytes wide).<br />\nSuccessive 32-bit words are assigned to successive banks: <span class=\"katex-inline\">$\\text{Bank Index} = (\\text{Byte Address} / 4) \\pmod{32}$</span>.</p>\n<pre><code>Bank 0    Bank 1    Bank 2   ...  Bank 31\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510 \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510 \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510     \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 Word 0\u2502 \u2502 Word 1\u2502 \u2502 Word 2\u2502 ... \u2502Word 31\u2502  &lt;-- Threads 0..31 access words 0..31 (0 conflicts: 1 cycle)\n\u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524 \u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524 \u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524     \u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502Word 32\u2502 \u2502Word 33\u2502 \u2502Word 34\u2502 ... \u2502Word 63\u2502  &lt;-- Threads 0..31 access words 0, 2, 4.. (2-way conflict: 2 cycles)\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518 \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518 \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518     \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n</code></pre>\n<ul>\n<li><strong>Conflict-Free Access</strong>: All 32 threads in a warp access distinct banks in parallel (serviced in 1 cycle).</li>\n<li><strong><span class=\"katex-inline\">$k$</span>-Way Bank Conflict</strong>: If <span class=\"katex-inline\">$k$</span> threads in the same warp request distinct addresses belonging to the <em>same bank</em>, the requests are serialized, taking <strong><span class=\"katex-inline\">$k$</span> clock cycles</strong>.</li>\n<li><strong>Padding Solution</strong>: Pad 2D shared memory arrays (e.g. <code>__shared__ float smem[32][33]</code> instead of <code>[32][32]</code>) to skew row strides and eliminate bank collisions.</li>\n</ul>\n<hr />\n<h2>5. Python / Triton Implementation: Online Softmax Attention Block</h2>\n<pre><code class=\"language-python\">import torch\nimport math\n\ndef online_softmax_reference(Q: torch.Tensor, K: torch.Tensor, V: torch.Tensor, block_size: int = 16) -&gt; torch.Tensor:\n    &quot;&quot;&quot;\n    Step-by-step Python simulation of FlashAttention's Online Softmax Tiling.\n    Q, K, V: [Seq_Len, d_head]\n    &quot;&quot;&quot;\n    S, D = Q.shape\n    scale = 1.0 / math.sqrt(D)\n    O = torch.zeros_like(Q)\n\n    # Running statistics per row\n    running_max = torch.full((S,), float('-inf'), device=Q.device)\n    running_sum = torch.zeros(S, device=Q.device)\n\n    # Outer loop: Iterate over K, V blocks (simulating loading into SRAM)\n    for j_start in range(0, S, block_size):\n        j_end = min(j_start + block_size, S)\n        K_j = K[j_start:j_end] # [B_c, D]\n        V_j = V[j_start:j_end] # [B_c, D]\n\n        # Inner loop: Iterate over Q blocks\n        for i_start in range(0, S, block_size):\n            i_end = min(i_start + block_size, S)\n            Q_i = Q[i_start:i_end] # [B_r, D]\n\n            # Compute block dot products: [B_r, B_c]\n            S_ij = torch.matmul(Q_i, K_j.t()) * scale\n\n            # Causal mask for the block\n            for r in range(i_start, i_end):\n                for c in range(j_start, j_end):\n                    if c &gt; r:\n                        S_ij[r - i_start, c - j_start] = float('-inf')\n\n            # Local block maximum &amp; exponential sums\n            block_max, _ = torch.max(S_ij, dim=-1)\n            new_max = torch.maximum(running_max[i_start:i_end], block_max)\n\n            # Rescaling factors\n            alpha = torch.exp(running_max[i_start:i_end] - new_max)\n            P_ij = torch.exp(S_ij - new_max.unsqueeze(-1))\n            P_ij = torch.nan_to_num(P_ij, nan=0.0)\n\n            # Update running normalizer\n            new_sum = running_sum[i_start:i_end] * alpha + P_ij.sum(dim=-1)\n\n            # Incremental output update\n            O_prev = O[i_start:i_end]\n            O_block = torch.matmul(P_ij, V_j)\n\n            # Rescale previous output and accumulate\n            O[i_start:i_end] = (O_prev * (running_sum[i_start:i_end] * alpha).unsqueeze(-1) + O_block) / (new_sum.unsqueeze(-1) + 1e-8)\n\n            running_max[i_start:i_end] = new_max\n            running_sum[i_start:i_end] = new_sum\n\n    return O\n\nif __name__ == &quot;__main__&quot;:\n    S, D = 64, 32\n    q, k, v = torch.randn(S, D), torch.randn(S, D), torch.randn(S, D)\n    out_online = online_softmax_reference(q, k, v, block_size=16)\n\n    # Standard Attention Baseline\n    scores = torch.matmul(q, k.t()) / math.sqrt(D)\n    mask = torch.triu(torch.full((S, S), float('-inf')), diagonal=1)\n    weights = torch.softmax(scores + mask, dim=-1)\n    weights = torch.nan_to_num(weights, nan=0.0)\n    out_standard = torch.matmul(weights, v)\n\n    assert torch.allclose(out_online, out_standard, atol=1e-4), &quot;Online softmax mismatch with standard attention!&quot;\n    print(&quot;Online Softmax mathematical tiling verified successfully.&quot;)\n</code></pre>\n<hr />\n<h2>6. Deep Interview Interrogation Ladder</h2>\n<ul>\n<li><strong>Level 1 (Concept)</strong>: What is the primary difference between memory-bound and compute-bound operations?</li>\n<li><strong>Level 3 (Roofline)</strong>: Calculate the arithmetic intensity of autoregressive token generation for a 70B parameter model at batch size 1, and explain why GPU compute utilization is <span class=\"katex-inline\">$&lt; 1\\%$</span>.</li>\n<li><strong>Level 5 (Hardware)</strong>: What is a Shared Memory Bank Conflict, and how does array padding resolve it?</li>\n<li><strong>Level 7 (Derivation)</strong>: Derive the incremental output update formula in FlashAttention's online softmax algorithm when combining two disjoint blocks.</li>\n<li><strong>Level 9 (Microarchitecture)</strong>: Explain how FlashAttention-3 leverages TMA (Tensor Memory Accelerator) and Warp Specialization on NVIDIA Hopper GPUs to achieve asynchronous memory-compute overlap.</li>\n<li><strong>Level 10 (Principal Engineering)</strong>: You are tasked with optimizing a custom mixture-of-experts model on an 8xH100 node. All-to-All communication between GPUs is stalling SM execution. Walk through how you would trace the bottleneck using NVIDIA Nsight Systems (<code>nsys</code>) and re-architect the dispatch kernel to overlap computation with NVLink transfers.</li>\n</ul>"}, {"id": "09_INFERENCE_SYSTEMS", "file": "09_INFERENCE_SYSTEMS.md", "title": "Inference Systems (PagedAttention, SGLang, PD Split)", "priority": "P0", "phase": "Phase 4: Hardware & Inference", "content": "# 09_INFERENCE_SYSTEMS \u2014 Mathematical & Systems Engineering Reference\n\n> **Audience**: ML Engineers, LLM Systems Engineers, and AI Researchers preparing for senior/principal technical interviews.  \n> **Core Objective**: Provide an exhaustive mathematical, algorithmic, and systems reference on LLM Inference \u2014 covering PagedAttention, SGLang's RadixAttention, Disaggregated Prefill/Decode (PD split), Chunked Prefill scheduling, Speculative Decoding acceptance proofs, and FP8/INT4 quantization.\n\n---\n\n## 1. The Two-Phase Inference Lifecycle & Latency Modeling\n\nAutoregressive LLM generation operates in two radically distinct phases:\n\n```\n[Request Arrives]\n      \u2502\n      \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502  Phase 1: Prefill (Prompt Processing)                  \u2502\n\u2502  - Input: Entire Prompt of S_p tokens in parallel       \u2502\n\u2502  - Nature: Compute-Bound (Dense GEMM on Tensor Cores)  \u2502\n\u2502  - Metric: Time To First Token (TTFT)                  \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                        \u2502 Initial KV Cache Generated & Cached\n                        \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502  Phase 2: Decode (Autoregressive Token Generation)     \u2502\n\u2502  - Input: 1 new token per step, reads past S_t KV cache \u2502\n\u2502  - Nature: Memory-Bound (Loading weights & KV from HBM)\u2502\n\u2502  - Metric: Time Per Output Token (TPOT) / Inter-Token  \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n### 1.1 First-Principles Latency & Throughput Formulations\n\nLet:\n- $P$: Model parameter count (e.g. $70 \\times 10^9$).\n- $S_p$: Prompt sequence length.\n- $S_o$: Generated output sequence length.\n- $B$: Concurrent batch size.\n- $C_{\\text{peak}}$: Peak GPU compute throughput (FLOPs/s, e.g. $989 \\times 10^{12}$ for H100 FP16).\n- $B_{\\text{mem}}$: Peak GPU memory bandwidth (Bytes/s, e.g. $3.35 \\times 10^{12}$ for H100 HBM3).\n- $b_{\\text{model}}$: Bytes per model parameter (2 for FP16, 1 for FP8).\n- $b_{\\text{kv}}$: Bytes per KV cache element (2 for FP16, 1 for FP8).\n\n#### 1. Time To First Token (TTFT):\nDuring prefill, the model computes $2 P$ FLOPs per prompt token across batch $B$:\n$$ \\text{FLOPs}_{\\text{prefill}} = 2 \\cdot P \\cdot B \\cdot S_p + 2 \\cdot L \\cdot N_h \\cdot d_k \\cdot B \\cdot S_p^2 $$\nAssuming compute dominates ($S_p \\gg 1$):\n$$ \\mathbf{\\text{TTFT} \\approx \\frac{2 \\cdot P \\cdot S_p}{\\text{MFU} \\cdot C_{\\text{peak}}}} $$\n*Example*: Processing $S_p = 4096$ prompt tokens on a 70B model using an 8xH100 node ($\\text{MFU} \\approx 0.60$, $C_{\\text{peak}} = 8 \\times 989\\text{ TFLOPs}$):\n$$ \\text{TTFT} = \\frac{2 \\times (70 \\times 10^9) \\times 4096}{0.60 \\times (8 \\times 989 \\times 10^{12})} \\approx \\mathbf{0.121 \\text{ seconds (121 ms)}} $$\n\n#### 2. Time Per Output Token (TPOT / Decode Step Latency):\nAt each decode step, the model loads all $P$ weights and the cumulative KV cache for all $B$ requests:\n$$ \\text{Bytes Transferred per Step} = (P \\cdot b_{\\text{model}}) + B \\cdot \\text{KVCache}_{\\text{size}}(S_t) $$\n$$ \\mathbf{\\text{TPOT}(t) = \\frac{P \\cdot b_{\\text{model}} + B \\cdot (2 \\cdot L \\cdot N_{kv} \\cdot d_h \\cdot b_{\\text{kv}} \\cdot S_t)}{B_{\\text{mem}}}} $$\n\n---\n\n### 1.2 The KV Cache Memory Equation\n\nFor a Transformer with $L$ layers, $N_{kv}$ Key/Value heads, head dimension $d_h$, sequence length $S$, and batch size $B$:\n\n$$ \\mathbf{\\text{Memory}_{\\text{KV}} = 2 \\times B \\times S \\times L \\times N_{kv} \\times d_h \\times b_{\\text{kv}} \\quad [\\text{Bytes}]} $$\n\n#### Concrete Production Sizing Example:\n- Model: LLaMA-3 70B ($L = 80, N_q = 64, N_{kv} = 8, d_h = 128$).\n- Precision: FP16 ($b_{\\text{kv}} = 2\\text{ bytes}$).\n- Context Length: $S = 8192$, Batch Size: $B = 32$.\n\n$$ \\text{Memory}_{\\text{KV}} = 2 \\times 32 \\times 8192 \\times 80 \\times 8 \\times 128 \\times 2 = 85,899,345,920 \\text{ Bytes} \\approx \\mathbf{80.0 \\text{ GB}} $$\n\n*Insight*: The KV cache alone occupies an entire 80GB H100 GPU's VRAM. Without memory management, KV cache fragmentation causes premature Out-Of-Memory (OOM) failures.\n\n---\n\n## 2. Memory & Scheduling Engines: PagedAttention vs. RadixAttention\n\n### 2.1 PagedAttention (vLLM Architecture)\n\nIn traditional serving, KV caches are allocated contiguously for maximum sequence length ($S_{\\max}$), causing **$60\\%-80\\%$ VRAM waste** due to internal fragmentation, external fragmentation, and reservation waste.\n\n#### OS Virtual Memory Analogy:\nPagedAttention partitions the KV cache into fixed-size **Physical Blocks (Pages)** (e.g. 16 or 32 tokens).\n- **Logical KV Blocks**: Continuous token indices $0 \\dots S-1$.\n- **Physical Block Table**: Maps logical blocks to non-contiguous physical pages in GPU VRAM.\n- **Copy-on-Write (CoW)**: When an agent branches or forks multiple parallel generation trajectories (e.g. Tree-of-Thought, Beam Search), child processes share parent physical pages until a new token is appended.\n\n```\nLogical Blocks (Request A):   [ Block 0 ] \u2500\u2500\u25ba Physical Page #14 (VRAM)\n                              [ Block 1 ] \u2500\u2500\u25ba Physical Page #3  (VRAM)\n                              [ Block 2 ] \u2500\u2500\u25ba Physical Page #89 (VRAM)\n```\n\n$$\\text{Memory Waste in PagedAttention} \\leq \\frac{\\text{Block Size} - 1}{\\text{Average Sequence Length}} \\approx \\frac{15}{2048} < \\mathbf{0.73\\%}$$\n\n---\n\n### 2.2 RadixAttention (SGLang Architecture)\n\nWhile PagedAttention manages memory per request, multi-turn AI agents and tool-calling loops frequently reuse long shared system prompts, tool schemas, and multi-turn dialogue histories.\n\n#### Radix Tree Structure:\nSGLang maintains a global **Radix Tree (Prefix Trie)** over all past and present KV cache pages in GPU VRAM:\n- Nodes in the tree represent token sequences with associated KV cache pointers.\n- When a new request arrives, SGLang traverses the Radix Tree to find the **longest common prefix match**.\n- If matched, the engine **skips prefill entirely** for the matched prefix, reducing TTFT from seconds to milliseconds.\n- **Cache Eviction Policy (LRU)**: When VRAM is full, least recently used leaf nodes are recursively evicted.\n\n```\n                  [ Root (Empty) ]\n                         \u2502\n        \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n        \u25bc                                 \u25bc\n[ System Prompt & Tool Schemas (1.5k tok) ] [ Math Agent Prompt (800 tok) ]\n        \u2502\n   \u250c\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n   \u25bc                             \u25bc\n[ Turn 1: User Query A ]   [ Turn 1: User Query B ]\n   \u2502\n[ Turn 2: Tool Execution Result ]\n```\n\n---\n\n## 3. Advanced Serving Architectures\n\n### 3.1 Disaggregated Prefill and Decode (PD Split / Mooncake / Splitwise)\n\nIn unified serving nodes, heavy prefills and continuous decodes run on the same GPUs, causing:\n1. **Preemption Stalls**: A massive prefill monopolizes Tensor Cores, stalling active decode streams and creating massive P99 TPOT latency spikes.\n2. **Hardware Inefficiency**: Prefill requires massive compute (FLOPs-bound), while decode requires massive memory bandwidth.\n\n#### The Disaggregated Architecture:\n- **Prefill Fleet**: Compute-optimized GPUs (e.g. NVIDIA H100 with high TFLOPs) dedicated exclusively to processing prompt tokens.\n- **KV Transfer Network**: High-speed RDMA / PCIe / NVLink transfers the generated KV cache directly to the Decode Fleet.\n- **Decode Fleet**: Memory-bandwidth-optimized GPUs (or large clustered pools) dedicated exclusively to autoregressive token generation.\n\n```\nIncoming Request \u2500\u2500\u25ba [ Prefill Node (Compute Heavy) ] \n                            \u2502 \n                            \u25bc (RDMA KV Cache Transfer: ~100 GB/s)\n                     [ Decode Node (Bandwidth Heavy) ] \u2500\u2500\u25ba Token Stream\n```\n\n---\n\n### 3.2 Chunked Prefill & Iteration-Level Continuous Batching (Sarathi-Serve)\n\nTo prevent prefill requests from starving decode steps in a unified engine:\n- Chunk long prefills into smaller segments (e.g., $C = 512$ tokens).\n- Interleave chunked prefill GEMMs with ongoing decode steps within the same continuous batch iteration:\n  $$ \\text{Batch Budget} = \\text{Chunked Prefill}(512 \\text{ tokens}) + \\sum_{i=1}^{B_{\\text{decode}}} \\text{Decode}(1 \\text{ token}) $$\n- Keeps GPU compute utilization near 100% while strictly bounding P99 Inter-Token Latency (ITL).\n\n---\n\n## 4. Speculative Decoding Mathematics\n\n### 4.1 Target Model Verification & Expected Acceptance Length\n\nLet $M_p$ be a small, fast **Draft Model** (e.g. 1B params), and $M_q$ be the large **Target Model** (e.g. 70B params).\n1. Draft model autoregressively generates $K$ draft tokens: $(\\tilde{x}_1, \\dots, \\tilde{x}_K)$.\n2. Target model evaluates all $K$ tokens in a **single parallel forward pass** (as a prefill).\n3. The acceptance criterion for token $\\tilde{x}_{n}$ (Leviathan et al., 2023) is:\n   $$ P(\\text{Accept } \\tilde{x}_n) = \\min\\left( 1, \\; \\frac{q(\\tilde{x}_n \\mid x_{<n})}{p(\\tilde{x}_n \\mid x_{<n})} \\right) $$\n   If rejected, sample replacement token from the residual distribution:\n   $$ P_{\\text{res}}(x) = \\frac{\\max(0, q(x) - p(x))}{1 - \\sum_y \\min(p(y), q(y))} $$\n\n#### Mathematical Proof: Expected Tokens per Step ($\\mathbb{E}[N]$)\nLet $\\alpha \\in [0, 1]$ be the average acceptance probability per token:\n$$ \\mathbb{E}[N] = 1 + \\sum_{k=1}^K \\alpha^k = 1 + \\frac{\\alpha(1 - \\alpha^K)}{1 - \\alpha} = \\mathbf{\\frac{1 - \\alpha^{K+1}}{1 - \\alpha}} $$\n\n- If $\\alpha = 0.8$ and $K = 5$:\n  $$ \\mathbb{E}[N] = \\frac{1 - 0.8^6}{1 - 0.8} = \\frac{1 - 0.262}{0.2} = \\mathbf{3.69 \\text{ tokens/step}} $$\n\n- **Theoretical Latency Speedup**:\n  Let $t_p$ be the draft step time, and $t_q$ be the target step time ($t_p \\ll t_q$).\n  $$ \\text{Speedup} = \\frac{\\mathbb{E}[N] \\cdot t_q}{K \\cdot t_p + t_q} = \\frac{\\frac{1 - \\alpha^{K+1}}{1 - \\alpha}}{1 + K \\frac{t_p}{t_q}} $$\n\n---\n\n## 5. Quantization Mathematics: FP8, INT8, and INT4\n\n```\nFP16:  1 Sign | 5 Exponent | 10 Mantissa  (Dynamic Range: 10^-5 to 6.5x10^4)\nFP8 E4M3: 1 Sign | 4 Exponent | 3 Mantissa  (Higher Precision: Best for Weights & Activations)\nFP8 E5M2: 1 Sign | 5 Exponent | 2 Mantissa  (Wider Dynamic Range: Best for Gradients & KV Cache)\n```\n\n### 5.1 Symmetric Block Quantization\nGiven continuous weight vector $W \\in \\mathbb{R}^N$:\n$$ s = \\frac{\\max(|W|)}{2^{b-1} - 1} \\quad \\text{(Quantization Scale Factor)} $$\n$$ W_{\\text{quant}} = \\text{clamp}\\left( \\left\\lfloor \\frac{W}{s} \\right\\rceil, \\; -2^{b-1}, \\; 2^{b-1} - 1 \\right) $$\n$$ W_{\\text{dequant}} = W_{\\text{quant}} \\times s $$\n\n### 5.2 SmoothQuant: Outlier Migration (Xiao et al., 2023)\nIn LLMs, activations have extreme systematic outlier channels ($> 100\\times$ normal values), making activation quantization difficult.  \nSmoothQuant mathematically migrates the quantization difficulty from activations $X$ to weights $W$ by scaling channels with diagonal matrix $S = \\text{diag}(s)$:\n\n$$ Y = X W = (X S^{-1}) (S W) = \\hat{X} \\hat{W} $$\nWhere the per-channel scale $s_j$ is:\n$$ s_j = \\frac{\\max(|X_j|)^\\alpha}{\\max(|W_j|)^{1 - \\alpha}} \\quad (\\alpha = 0.5 \\text{ splits difficulty equally}) $$\n\n---\n\n## 6. PyTorch Simulation: Paged KV-Cache Allocator\n\n```python\nimport torch\nfrom typing import List, Dict\n\nclass PagedKVCacheManager:\n    \"\"\"\n    Physical Block Memory Allocator for PagedAttention.\n    \"\"\"\n    def __init__(self, num_blocks: int, block_size: int, num_layers: int, num_heads: int, head_dim: int):\n        self.block_size = block_size\n        self.num_layers = num_layers\n        self.num_heads = num_heads\n        self.head_dim = head_dim\n        \n        # Allocate physical memory pool: [Num_Blocks, Num_Layers, 2 (K/V), Block_Size, Num_Heads, Head_Dim]\n        self.gpu_memory_pool = torch.zeros(\n            (num_blocks, num_layers, 2, block_size, num_heads, head_dim),\n            dtype=torch.float16,\n            device=\"cuda\" if torch.cuda.is_available() else \"cpu\"\n        )\n        \n        # Free list tracking available physical block IDs\n        self.free_blocks = list(range(num_blocks))\n        self.block_tables: Dict[int, List[int]] = {} # Request ID -> [Physical Block IDs]\n\n    def allocate_request(self, request_id: int, prompt_len: int) -> List[int]:\n        num_blocks_needed = (prompt_len + self.block_size - 1) // self.block_size\n        assert len(self.free_blocks) >= num_blocks_needed, \"Out of Memory (OOM): No free physical blocks!\"\n        \n        allocated = [self.free_blocks.pop(0) for _ in range(num_blocks_needed)]\n        self.block_tables[request_id] = allocated\n        return allocated\n\n    def append_token(self, request_id: int, current_len: int) -> int:\n        \"\"\"\n        Allocates a new block if the current sequence length crosses block boundary.\n        \"\"\"\n        if current_len % self.block_size == 0:\n            assert len(self.free_blocks) > 0, \"OOM during token decode!\"\n            new_block = self.free_blocks.pop(0)\n            self.block_tables[request_id].append(new_block)\n            return new_block\n        return self.block_tables[request_id][-1]\n\n    def free_request(self, request_id: int):\n        if request_id in self.block_tables:\n            self.free_blocks.extend(self.block_tables[request_id])\n            del self.block_tables[request_id]\n\nif __name__ == \"__main__\":\n    manager = PagedKVCacheManager(num_blocks=100, block_size=16, num_layers=4, num_heads=8, head_dim=64)\n    req1_blocks = manager.allocate_request(request_id=1, prompt_len=35) # Requires 3 blocks\n    assert len(req1_blocks) == 3\n    print(f\"Request 1 assigned physical blocks: {req1_blocks}\")\n    \n    # Simulate generating tokens until new page is triggered\n    manager.append_token(request_id=1, current_len=48) # 48 % 16 == 0 -> Allocates 4th block\n    assert len(manager.block_tables[1]) == 4\n    print(f\"Request 1 expanded to physical blocks: {manager.block_tables[1]}\")\n    \n    manager.free_request(request_id=1)\n    assert len(manager.free_blocks) == 100\n    print(\"Paged KV Cache Allocation and Free Lifecycle Verified.\")\n```\n\n---\n\n## 7. Deep Interview Interrogation Ladder\n\n- **Level 1 (Concept)**: What is the primary hardware difference between the prefill phase and the decode phase in LLM serving?\n- **Level 3 (Derivation)**: Calculate the exact KV cache memory footprint for a 70B parameter model ($L=80, N_{kv}=8, d_h=128$) at batch size 64 with 8k context in FP16.\n- **Level 5 (Mechanics)**: How does PagedAttention eliminate external and internal memory fragmentation?\n- **Level 7 (Speculative Decoding Proof)**: Prove mathematically why the expected number of tokens accepted per step in Speculative Decoding is $\\frac{1 - \\alpha^{K+1}}{1 - \\alpha}$.\n- **Level 9 (Serving Architecture)**: Why does unified serving suffer from P99 latency spikes during long prefills, and how does Disaggregated Prefill/Decode (PD Disaggregation) resolve it?\n- **Level 10 (Principal Engineering)**: Design an inference cluster architecture serving a high-volume agentic workflow with shared system prompts and dynamic multi-step branching. Detail the cache eviction policy, KV transfer protocol across nodes, and speculative draft validation strategy.\n", "html": "<h1>09_INFERENCE_SYSTEMS \u2014 Mathematical &amp; Systems Engineering Reference</h1>\n<blockquote>\n<p><strong>Audience</strong>: ML Engineers, LLM Systems Engineers, and AI Researchers preparing for senior/principal technical interviews.<br />\n<strong>Core Objective</strong>: Provide an exhaustive mathematical, algorithmic, and systems reference on LLM Inference \u2014 covering PagedAttention, SGLang's RadixAttention, Disaggregated Prefill/Decode (PD split), Chunked Prefill scheduling, Speculative Decoding acceptance proofs, and FP8/INT4 quantization.</p>\n</blockquote>\n<hr />\n<h2>1. The Two-Phase Inference Lifecycle &amp; Latency Modeling</h2>\n<p>Autoregressive LLM generation operates in two radically distinct phases:</p>\n<pre><code>[Request Arrives]\n      \u2502\n      \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502  Phase 1: Prefill (Prompt Processing)                  \u2502\n\u2502  - Input: Entire Prompt of S_p tokens in parallel       \u2502\n\u2502  - Nature: Compute-Bound (Dense GEMM on Tensor Cores)  \u2502\n\u2502  - Metric: Time To First Token (TTFT)                  \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                        \u2502 Initial KV Cache Generated &amp; Cached\n                        \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502  Phase 2: Decode (Autoregressive Token Generation)     \u2502\n\u2502  - Input: 1 new token per step, reads past S_t KV cache \u2502\n\u2502  - Nature: Memory-Bound (Loading weights &amp; KV from HBM)\u2502\n\u2502  - Metric: Time Per Output Token (TPOT) / Inter-Token  \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n</code></pre>\n<h3>1.1 First-Principles Latency &amp; Throughput Formulations</h3>\n<p>Let:<br />\n- <span class=\"katex-inline\">$P$</span>: Model parameter count (e.g. <span class=\"katex-inline\">$70 \\times 10^9$</span>).<br />\n- <span class=\"katex-inline\">$S_p$</span>: Prompt sequence length.<br />\n- <span class=\"katex-inline\">$S_o$</span>: Generated output sequence length.<br />\n- <span class=\"katex-inline\">$B$</span>: Concurrent batch size.<br />\n- <span class=\"katex-inline\">$C_{\\text{peak}}$</span>: Peak GPU compute throughput (FLOPs/s, e.g. <span class=\"katex-inline\">$989 \\times 10^{12}$</span> for H100 FP16).<br />\n- <span class=\"katex-inline\">$B_{\\text{mem}}$</span>: Peak GPU memory bandwidth (Bytes/s, e.g. <span class=\"katex-inline\">$3.35 \\times 10^{12}$</span> for H100 HBM3).<br />\n- <span class=\"katex-inline\">$b_{\\text{model}}$</span>: Bytes per model parameter (2 for FP16, 1 for FP8).<br />\n- <span class=\"katex-inline\">$b_{\\text{kv}}$</span>: Bytes per KV cache element (2 for FP16, 1 for FP8).</p>\n<h4>1. Time To First Token (TTFT):</h4>\n<p>During prefill, the model computes <span class=\"katex-inline\">$2 P$</span> FLOPs per prompt token across batch <span class=\"katex-inline\">$B$</span>:</p>\n<div class=\"katex-display\">$$\\text{FLOPs}_{\\text{prefill}} = 2 \\cdot P \\cdot B \\cdot S_p + 2 \\cdot L \\cdot N_h \\cdot d_k \\cdot B \\cdot S_p^2$$</div>\n<p>Assuming compute dominates (<span class=\"katex-inline\">$S_p \\gg 1$</span>):</p>\n<div class=\"katex-display\">$$\\mathbf{\\text{TTFT} \\approx \\frac{2 \\cdot P \\cdot S_p}{\\text{MFU} \\cdot C_{\\text{peak}}}}$$</div>\n<p><em>Example</em>: Processing <span class=\"katex-inline\">$S_p = 4096$</span> prompt tokens on a 70B model using an 8xH100 node (<span class=\"katex-inline\">$\\text{MFU} \\approx 0.60$</span>, <span class=\"katex-inline\">$C_{\\text{peak}} = 8 \\times 989\\text{ TFLOPs}$</span>):</p>\n<div class=\"katex-display\">$$\\text{TTFT} = \\frac{2 \\times (70 \\times 10^9) \\times 4096}{0.60 \\times (8 \\times 989 \\times 10^{12})} \\approx \\mathbf{0.121 \\text{ seconds (121 ms)}}$$</div>\n\n<h4>2. Time Per Output Token (TPOT / Decode Step Latency):</h4>\n<p>At each decode step, the model loads all <span class=\"katex-inline\">$P$</span> weights and the cumulative KV cache for all <span class=\"katex-inline\">$B$</span> requests:</p>\n<div class=\"katex-display\">$$\\text{Bytes Transferred per Step} = (P \\cdot b_{\\text{model}}) + B \\cdot \\text{KVCache}_{\\text{size}}(S_t)$$</div>\n<div class=\"katex-display\">$$\\mathbf{\\text{TPOT}(t) = \\frac{P \\cdot b_{\\text{model}} + B \\cdot (2 \\cdot L \\cdot N_{kv} \\cdot d_h \\cdot b_{\\text{kv}} \\cdot S_t)}{B_{\\text{mem}}}}$$</div>\n\n<hr />\n<h3>1.2 The KV Cache Memory Equation</h3>\n<p>For a Transformer with <span class=\"katex-inline\">$L$</span> layers, <span class=\"katex-inline\">$N_{kv}$</span> Key/Value heads, head dimension <span class=\"katex-inline\">$d_h$</span>, sequence length <span class=\"katex-inline\">$S$</span>, and batch size <span class=\"katex-inline\">$B$</span>:</p>\n<div class=\"katex-display\">$$\\mathbf{\\text{Memory}_{\\text{KV}} = 2 \\times B \\times S \\times L \\times N_{kv} \\times d_h \\times b_{\\text{kv}} \\quad [\\text{Bytes}]}$$</div>\n\n<h4>Concrete Production Sizing Example:</h4>\n<ul>\n<li>Model: LLaMA-3 70B (<span class=\"katex-inline\">$L = 80, N_q = 64, N_{kv} = 8, d_h = 128$</span>).</li>\n<li>Precision: FP16 (<span class=\"katex-inline\">$b_{\\text{kv}} = 2\\text{ bytes}$</span>).</li>\n<li>Context Length: <span class=\"katex-inline\">$S = 8192$</span>, Batch Size: <span class=\"katex-inline\">$B = 32$</span>.</li>\n</ul>\n<div class=\"katex-display\">$$\\text{Memory}_{\\text{KV}} = 2 \\times 32 \\times 8192 \\times 80 \\times 8 \\times 128 \\times 2 = 85,899,345,920 \\text{ Bytes} \\approx \\mathbf{80.0 \\text{ GB}}$$</div>\n\n<p><em>Insight</em>: The KV cache alone occupies an entire 80GB H100 GPU's VRAM. Without memory management, KV cache fragmentation causes premature Out-Of-Memory (OOM) failures.</p>\n<hr />\n<h2>2. Memory &amp; Scheduling Engines: PagedAttention vs. RadixAttention</h2>\n<h3>2.1 PagedAttention (vLLM Architecture)</h3>\n<p>In traditional serving, KV caches are allocated contiguously for maximum sequence length (<span class=\"katex-inline\">$S_{\\max}$</span>), causing <strong><span class=\"katex-inline\">$60\\%-80\\%$</span> VRAM waste</strong> due to internal fragmentation, external fragmentation, and reservation waste.</p>\n<h4>OS Virtual Memory Analogy:</h4>\n<p>PagedAttention partitions the KV cache into fixed-size <strong>Physical Blocks (Pages)</strong> (e.g. 16 or 32 tokens).<br />\n- <strong>Logical KV Blocks</strong>: Continuous token indices <span class=\"katex-inline\">$0 \\dots S-1$</span>.<br />\n- <strong>Physical Block Table</strong>: Maps logical blocks to non-contiguous physical pages in GPU VRAM.<br />\n- <strong>Copy-on-Write (CoW)</strong>: When an agent branches or forks multiple parallel generation trajectories (e.g. Tree-of-Thought, Beam Search), child processes share parent physical pages until a new token is appended.</p>\n<pre><code>Logical Blocks (Request A):   [ Block 0 ] \u2500\u2500\u25ba Physical Page #14 (VRAM)\n                              [ Block 1 ] \u2500\u2500\u25ba Physical Page #3  (VRAM)\n                              [ Block 2 ] \u2500\u2500\u25ba Physical Page #89 (VRAM)\n</code></pre>\n<div class=\"katex-display\">$$\\text{Memory Waste in PagedAttention} \\leq \\frac{\\text{Block Size} - 1}{\\text{Average Sequence Length}} \\approx \\frac{15}{2048} &lt; \\mathbf{0.73\\%}$$</div>\n\n<hr />\n<h3>2.2 RadixAttention (SGLang Architecture)</h3>\n<p>While PagedAttention manages memory per request, multi-turn AI agents and tool-calling loops frequently reuse long shared system prompts, tool schemas, and multi-turn dialogue histories.</p>\n<h4>Radix Tree Structure:</h4>\n<p>SGLang maintains a global <strong>Radix Tree (Prefix Trie)</strong> over all past and present KV cache pages in GPU VRAM:<br />\n- Nodes in the tree represent token sequences with associated KV cache pointers.<br />\n- When a new request arrives, SGLang traverses the Radix Tree to find the <strong>longest common prefix match</strong>.<br />\n- If matched, the engine <strong>skips prefill entirely</strong> for the matched prefix, reducing TTFT from seconds to milliseconds.<br />\n- <strong>Cache Eviction Policy (LRU)</strong>: When VRAM is full, least recently used leaf nodes are recursively evicted.</p>\n<pre><code>                  [ Root (Empty) ]\n                         \u2502\n        \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n        \u25bc                                 \u25bc\n[ System Prompt &amp; Tool Schemas (1.5k tok) ] [ Math Agent Prompt (800 tok) ]\n        \u2502\n   \u250c\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n   \u25bc                             \u25bc\n[ Turn 1: User Query A ]   [ Turn 1: User Query B ]\n   \u2502\n[ Turn 2: Tool Execution Result ]\n</code></pre>\n<hr />\n<h2>3. Advanced Serving Architectures</h2>\n<h3>3.1 Disaggregated Prefill and Decode (PD Split / Mooncake / Splitwise)</h3>\n<p>In unified serving nodes, heavy prefills and continuous decodes run on the same GPUs, causing:<br />\n1. <strong>Preemption Stalls</strong>: A massive prefill monopolizes Tensor Cores, stalling active decode streams and creating massive P99 TPOT latency spikes.<br />\n2. <strong>Hardware Inefficiency</strong>: Prefill requires massive compute (FLOPs-bound), while decode requires massive memory bandwidth.</p>\n<h4>The Disaggregated Architecture:</h4>\n<ul>\n<li><strong>Prefill Fleet</strong>: Compute-optimized GPUs (e.g. NVIDIA H100 with high TFLOPs) dedicated exclusively to processing prompt tokens.</li>\n<li><strong>KV Transfer Network</strong>: High-speed RDMA / PCIe / NVLink transfers the generated KV cache directly to the Decode Fleet.</li>\n<li><strong>Decode Fleet</strong>: Memory-bandwidth-optimized GPUs (or large clustered pools) dedicated exclusively to autoregressive token generation.</li>\n</ul>\n<pre><code>Incoming Request \u2500\u2500\u25ba [ Prefill Node (Compute Heavy) ] \n                            \u2502 \n                            \u25bc (RDMA KV Cache Transfer: ~100 GB/s)\n                     [ Decode Node (Bandwidth Heavy) ] \u2500\u2500\u25ba Token Stream\n</code></pre>\n<hr />\n<h3>3.2 Chunked Prefill &amp; Iteration-Level Continuous Batching (Sarathi-Serve)</h3>\n<p>To prevent prefill requests from starving decode steps in a unified engine:<br />\n- Chunk long prefills into smaller segments (e.g., <span class=\"katex-inline\">$C = 512$</span> tokens).<br />\n- Interleave chunked prefill GEMMs with ongoing decode steps within the same continuous batch
